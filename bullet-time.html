<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>BULLET TIME</title>
<style>
  /* --u は「枠の幅の 1/100」（JS が入れる）。文字や余白をこれで決めるので、スマホ(375)でも PC の枠(540)でも同じ見た目の比になる */
  :root{--u:3.75px;--ink:#f2efe8;--gold:#ffd04a;--ice:#8fc8ff;--red:#e0483c;--jp:"Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Meiryo","Noto Sans JP",sans-serif}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#020305;color:var(--ink);font-family:var(--jp);
    touch-action:none;user-select:none;-webkit-user-select:none}
  button{font-family:var(--jp)}

  /* ---- 縦長 9:16 の枠。PC では高さいっぱいの 9:16 を中央に置き、左右は暗い帯。スマホ(縦)では画面いっぱい ---- */
  #stage{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(100vw,56.25vh);overflow:hidden;background:#05070a;
    box-shadow:0 0 0 1px rgba(255,255,255,.06),0 0 60px rgba(0,0,0,.8)}
  #stage canvas{display:block;width:100%;height:100%}

  /* ---- 上：目的・未来の数 ---- */
  #obj{position:absolute;left:calc(var(--u)*4);top:calc(env(safe-area-inset-top) + var(--u)*3.5);z-index:6;pointer-events:none;text-shadow:0 1px 8px #000}
  #obj b{display:block;font-size:calc(var(--u)*4.2);letter-spacing:.1em}
  #obj small{display:block;margin-top:2px;font-size:calc(var(--u)*3.1);opacity:.75;letter-spacing:.06em}
  #topR{position:absolute;right:calc(var(--u)*4);top:calc(env(safe-area-inset-top) + var(--u)*3.5);z-index:7;pointer-events:none}
  #fut{padding:calc(var(--u)*1.2) calc(var(--u)*3.4);border-radius:calc(var(--u)*5);background:rgba(8,10,14,.6);font-size:calc(var(--u)*3.6);letter-spacing:.1em;white-space:nowrap}
  #fut b{font-size:calc(var(--u)*5);color:var(--gold);font-variant-numeric:tabular-nums}

  /* ---- 下：やり直し・撃つ（親指が届く位置） ---- */
  #bar{position:absolute;left:calc(var(--u)*4);right:calc(var(--u)*4);bottom:calc(env(safe-area-inset-bottom) + var(--u)*4);z-index:9;display:flex;gap:calc(var(--u)*3);pointer-events:none}
  #bar button{pointer-events:auto;touch-action:manipulation;cursor:pointer}
  #retryBtn{flex:none;padding:0 calc(var(--u)*4.5);height:calc(var(--u)*13);border:1px solid rgba(255,255,255,.5);border-radius:calc(var(--u)*7);
    background:rgba(8,10,14,.7);color:var(--ink);font-size:calc(var(--u)*3.6);letter-spacing:.06em}
  #retryBtn.off{display:none}
  #fireBtn{flex:1;display:none;height:calc(var(--u)*13);border:2px solid var(--gold);border-radius:calc(var(--u)*7);background:rgba(60,44,10,.9);color:var(--gold);
    font-size:calc(var(--u)*5.6);font-weight:700;letter-spacing:.4em;text-indent:.4em}
  #fireBtn.on{display:block}
  #hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + var(--u)*21);z-index:6;text-align:center;font-size:calc(var(--u)*3);letter-spacing:.06em;
    opacity:0;pointer-events:none;text-shadow:0 1px 6px #000;transition:opacity .2s}
  #hint.on{opacity:.85}
  body.touch #hint{display:none}

  /* ---- 分岐点：青白い色合いと、印（輪） ---- */
  #tint{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .25s;
    background:radial-gradient(ellipse at center,rgba(90,150,255,0) 45%,rgba(20,50,130,.38) 100%)}
  #tint.on{opacity:1}
  #markers{position:absolute;inset:0;z-index:8;pointer-events:none}
  .mk{position:absolute;display:none;width:calc(var(--u)*17);height:calc(var(--u)*17);margin:calc(var(--u)*-8.5) 0 0 calc(var(--u)*-8.5);cursor:pointer;pointer-events:auto;touch-action:manipulation}
  .mk.on{display:block}
  .mk i{position:absolute;left:calc(var(--u)*2.5);top:calc(var(--u)*2.5);width:calc(var(--u)*12);height:calc(var(--u)*12);border-radius:50%;border:3px solid rgba(255,255,255,.85);
    background:rgba(255,255,255,.08);box-shadow:0 0 12px rgba(0,0,0,.6),inset 0 0 8px rgba(0,0,0,.4);transition:transform .12s}
  .mk span{position:absolute;left:50%;top:calc(var(--u)*15);transform:translateX(-50%);white-space:nowrap;font-size:calc(var(--u)*3.2);font-weight:700;letter-spacing:.12em;
    text-shadow:0 1px 6px #000,0 0 3px #000}
  .mk.sel i{border-color:var(--gold);background:rgba(255,208,74,.16);transform:scale(1.18);animation:pulse .9s ease-in-out infinite}
  .mk.sel span{color:var(--gold);font-size:calc(var(--u)*3.8)}
  @keyframes pulse{0%,100%{box-shadow:0 0 12px rgba(255,208,74,.5),inset 0 0 8px rgba(0,0,0,.4)}50%{box-shadow:0 0 26px rgba(255,208,74,.95),inset 0 0 8px rgba(0,0,0,.4)}}

  /* ---- 状況を見る・お知らせ ---- */
  #intro{position:absolute;left:50%;top:24%;transform:translate(-50%,-50%);z-index:7;text-align:center;opacity:0;pointer-events:none;transition:opacity .3s;text-shadow:0 2px 14px #000;white-space:nowrap}
  #intro.on{opacity:1}
  #intro h2{font-size:calc(var(--u)*9);letter-spacing:.2em}
  #intro p{margin-top:8px;font-size:calc(var(--u)*3.4);letter-spacing:.15em;opacity:.8}
  #pop{position:absolute;left:50%;top:20%;transform:translate(-50%,-50%);z-index:7;font-size:calc(var(--u)*11);font-weight:700;letter-spacing:.1em;
    opacity:0;pointer-events:none;text-shadow:0 2px 16px #000;white-space:nowrap}
  #pop.on{opacity:1}
  #flash{position:absolute;inset:0;z-index:4;background:#fff;opacity:0;pointer-events:none}
  #hurt{position:absolute;inset:0;z-index:4;background:radial-gradient(ellipse at center,rgba(160,0,0,0) 30%,rgba(190,20,10,.7) 100%);opacity:0;pointer-events:none}

  /* ---- 結果：上に判定、下にログとボタン（真ん中は連鎖の絵を見せる） ---- */
  #result{position:absolute;inset:0;z-index:12;display:none;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;
    padding:calc(env(safe-area-inset-top) + var(--u)*16) calc(var(--u)*4) calc(env(safe-area-inset-bottom) + var(--u)*5);
    background:linear-gradient(to bottom,rgba(6,8,12,.7) 0%,rgba(6,8,12,.1) 30%,rgba(6,8,12,.1) 45%,rgba(6,8,12,.82) 70%)}
  #result.on{display:flex}
  #stage.res #obj,#stage.res #topR{opacity:0}
  #result h2{font-size:calc(var(--u)*13);letter-spacing:.1em;line-height:1.1}
  #result h2.ok{color:var(--gold)} #result h2.ng{color:var(--red)}
  #result .sub{margin-top:calc(var(--u)*1.5);font-size:calc(var(--u)*4.4);letter-spacing:.2em;opacity:.9}
  #result .low{width:100%;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*2.4)}
  #chain{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:calc(var(--u)*1.6) calc(var(--u)*1.2);font-size:calc(var(--u)*3.6)}
  #chain span{padding:calc(var(--u)*.8) calc(var(--u)*3);border-radius:calc(var(--u)*4);background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);white-space:nowrap}
  #chain span.last{background:rgba(255,208,74,.2);border-color:var(--gold)}
  #chain span.last.ng{background:rgba(224,72,60,.22);border-color:var(--red)}
  #chain b{line-height:1;font-size:calc(var(--u)*3.4);opacity:.55;font-weight:400}
  #resFut{font-size:calc(var(--u)*4);letter-spacing:.15em}
  #resFut b{color:var(--gold);font-size:1.4em}
  #againBtn{width:100%;height:calc(var(--u)*13);font-size:calc(var(--u)*5);font-weight:700;letter-spacing:.2em;color:#fff;background:#c8402f;border:0;border-radius:calc(var(--u)*7);cursor:pointer;touch-action:manipulation}
  #result small{font-size:calc(var(--u)*2.8);opacity:.6;letter-spacing:.08em}

  /* ---- スマホが横向きのときの案内（縦専用なので、縦にしてもらう） ---- */
  #rotate{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:22px;padding:24px;text-align:center;background:#0b0e14}
  #rotate .phone{width:46px;height:80px;border:4px solid var(--ink);border-radius:9px;position:relative;animation:turn 2.4s ease-in-out infinite}
  #rotate .phone::after{content:"";position:absolute;left:50%;bottom:5px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--ink)}
  @keyframes turn{0%,25%{transform:rotate(-90deg)}55%,85%{transform:rotate(0)}100%{transform:rotate(-90deg)}}
  #rotate p{font-size:20px;letter-spacing:.1em;line-height:1.8}
  #rotate small{display:block;font-size:14px;opacity:.75;letter-spacing:.05em}
  @media (orientation: landscape) and (pointer: coarse){#rotate{display:flex}}
</style>
</head>
<body>
<div id="stage">
  <div id="tint"></div>
  <div id="obj"><b>目的：主人公を助けろ</b><small>3.5 秒後、敵が主人公を撃つ</small></div>
  <div id="topR"><div id="fut">未来 <b id="futN">0</b>/4</div></div>
  <div id="markers">
    <div class="mk" data-id="A"><i></i><span></span></div>
    <div class="mk" data-id="lamp"><i></i><span></span></div>
    <div class="mk" data-id="banana"><i></i><span></span></div>
    <div class="mk" data-id="bottle"><i></i><span></span></div>
  </div>
  <div id="hint">← → ↑ ↓ で選ぶ　Enter / Space で撃つ　R でやり直し</div>
  <div id="bar"><button id="retryBtn" class="off">やり直し</button><button id="fireBtn">撃つ</button></div>
  <div id="intro"><h2>状況を見る</h2><p>タップかキーで飛ばす</p></div>
  <div id="pop"></div>
  <div id="flash"></div>
  <div id="hurt"></div>
  <div id="result">
    <div><h2 id="resTitle"></h2><div class="sub" id="resSub"></div></div>
    <div class="low">
      <div id="chain"></div>
      <div id="resFut"></div>
      <button id="againBtn">もう一度</button>
      <small>画面をタップでもやり直せます（R キー）</small>
    </div>
  </div>
</div>
<div id="rotate"><div class="phone"></div><p>縦画面にしてください<small>スマホを縦向きにすると遊べます</small></p></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script>
"use strict";
// ===== 調整する数字はここだけ =====
const CFG = {
  // 時間の流れ
  time: {
    step: 1 / 60,            // 物理を進める刻み（秒）
    aFireAt: 3.5,            // 敵 A が主人公を撃つ時刻（命中から。資料どおり 3.5 秒）
    aFireJit: 0.15,          // 撃つ時刻のばらつき
    endAt: 6.0,              // 命中からこの時刻まで主人公が無事なら CLEAR
    hitHold: 1.3,            // 主人公が撃たれてから結果を出すまでの間
    simMax: 9,               // 念のための上限
  },
  // 弾の飛行（slow は演出用の「ゲーム内の時間の遅さ」。弾の進みは下の秒数で決める）
  bullet: {
    slowScale: 0.08,         // 飛行中の周りの時間（ガラス片・ちり）の速さ
    nearScale: 0.03,         // 命中直前の周りの時間
    fly1Sec: 0.95,           // 窓から分岐点まで
    fly1Extra: 0.55,         // 最初の 1 回だけ、窓の外から始まる分の追加秒
    fly2Sec: 1.8,            // 分岐点から命中まで
    nearFrac: 0.65,          // 経路のここから先を「近い」とする
    nearSpeed: 0.35,         // 近い間の速さ（それまでを 1 として）
    curve: 0.28,             // 曲がり方
    startZ: 9.5,             // 最初の 1 回の弾の出発点（窓の外）
  },
  // 敵
  enemy: {
    hearing: 7,              // 音が届く距離（音の大きさ 1 のとき）
    aimErr: 0.015,           // ふだんの狙いのずれ（ラジアン）
    startleDist: 3.2,        // A が驚く距離（砕ける音がこの近さ）
    panicDelay: 0.3,         // 驚いてから反射で撃つまで
    panicPitch: 0.75,        // 驚いたときに銃口が上へ跳ねる角度
    panicJit: 0.2,
    bTurn: 0.45,             // B が振り向いてから撃つまで
    bReactMin: 0.25, bReactMax: 0.45,   // バナナの音から駆け出すまで
    bRun: 4.4, bRunJit: 0.4, // 駆け足の速さ
    bDuck: 3.0,              // 伏せている時間
    slipDist: 0.55,          // バナナを踏む距離
    chaseTimeout: 3.0,
    misfireDelay: 0.18,      // 転んでから暴発するまで
    misfireErr: 0.04,        // 暴発の向きのずれ（ボンベのほうを向いている）
  },
  // バナナ
  banana: {
    landX: 1.8, landZ: -1.3, // 撃たれたバナナが落ちる場所（B の足元）
    land: 0.3,               // 落下点のばらつき（半径）
    flight: 1.0,             // 飛んでいる時間
    flightJit: 0.06,
  },
  // 爆発
  blast: {
    radius: 7.5,             // 吹き飛ぶ範囲
    lethal: 2.4,             // 主人公に当たる致死範囲（椅子ごと倒れてかわせるのはこの外）
    speed: 9,                // 吹き飛ぶ速さ
    min: 0.35,               // 遠くでも最低これだけの強さ
    up: 0.55,                // 上向きの成分
    spin: 3,
  },
  // 撃たれたときの衝撃
  hit: {
    aPush: 6.5,              // 敵 A を押す速さ
    aUp: 1.5,
  },
  // 音の大きさ（1 で hearing の距離まで届く）
  loud: { lamp: 1.0, allyDown: 0.9, banana: 0.5, bottle: 0.4 },
  // 物理
  phys: { gravity: -9.8, friction: 0.5, restitution: 0.15, iterations: 12, bananaFriction: 0.9 },
  // カメラ
  camera: {
    // fov は横の視野角（縦長の画面でも横に同じだけ入るように。縦は画面の比から求める）
    wide: { x: -1.3, y: 3.7, z: 4.6, lx: 1.0, ly: 0.7, lz: -2.4, fov: 66 },
    freeze: { x: 0, y: 3.6, z: 4.6, lx: 0, ly: 1.0, lz: -1.2, fov: 62 },
    follow: { back: 2.0, up: 0.45, side: 0.6, fov: 56 },
    near: { back: 0.9, up: 0.2, side: 0.3, fov: 30 },
    introSec: 2.5,
  },
  ui: { hintSec: 2.2 },
  futures: 4,
};
// ===== STAGE 1「単純な未来」の配置（データだけ。three.js は使わない） =====
// 座標：x は右、y は上、z は手前（窓の側）。部屋は x ±5.5、z -4.8〜4.8、高さ 4.2。
// 向き yaw：0 で -z（奥）を向く。yawToward(dx,dz) で向きたい方向から求める
const STAGE1 = {
  title: '単純な未来',
  goal: '主人公を助けろ',
  room: { x: 4.2, zBack: -4.8, zFront: 4.8, h: 4.2 },
  window: { x: 0, y: 1.75, w: 1.5, h: 1.1 },        // 手前の壁の窓（ここを割って弾が入る）
  gun: { x: 0, y: 1.75, z: 9.5 },                    // 窓の外の狙撃銃
  branch: { x: 0, y: 1.75, z: 1.8 },                 // 分岐点（時間が止まる場所）
  // body: half は箱の半分の大きさ。mass 0 は動かない
  ents: {
    hero:   { kind: 'person', pos: [0, 0.7, -4.15],  half: [0.3, 0.7, 0.3],   mass: 60, yaw: Math.PI },
    A:      { kind: 'person', pos: [0, 0.9, -1.3],   half: [0.28, 0.9, 0.22], mass: 75, yaw: 0 },
    B:      { kind: 'person', pos: [2.6, 0.9, -2.4], half: [0.28, 0.9, 0.22], mass: 75, yaw: Math.PI * 0.85 },
    lamp:   { kind: 'lamp',   pos: [0, 3.0, -2.1],   radius: 0.3, mass: 4 },
    table:  { kind: 'table',  pos: [0, 0.4, 0.6], half: [1.7, 0.4, 0.5],   mass: 0 },
    banana: { kind: 'banana', pos: [-1.2, 0.87, 0.6], half: [0.14, 0.04, 0.06], mass: 0.3, yaw: 0.5 },
    bottle: { kind: 'bottle', pos: [1.2, 0.95, 0.6], half: [0.045, 0.15, 0.045], mass: 0.6 },
    crate:  { kind: 'crate',  pos: [3.2, 0.4, -3.2], half: [0.4, 0.4, 0.4],   mass: 25 },
    cyl:    { kind: 'cyl',    pos: [3.6, 0.65, -4.4], half: [0.17, 0.65, 0.17], mass: 30 },
  },
  chainTop: 4.2,             // 鎖の上端（天井）
  // 撃てる対象。aim は弾が当たる点
  targets: [
    { id: 'A',      name: '敵A',     aim: { x: 0,     y: 1.3,  z: -1.05 } },
    { id: 'lamp',   name: 'ランプ',  aim: { x: 0,     y: 3.85, z: -2.1 } },
    { id: 'banana', name: 'バナナ',  aim: { x: -1.2, y: 0.95, z: 0.6 } },
    { id: 'bottle', name: 'ワイン瓶', aim: { x: 1.2,  y: 1.08, z: 0.6 } },
  ],
};

function yawToward(dx, dz) { return Math.atan2(-dx, -dz); }
function yawFwd(yaw) { return { x: -Math.sin(yaw), z: -Math.cos(yaw) }; }
// ===== 物理（cannon.js）。世界の構築・保持・衝突の記録・レイキャスト。three.js は使わない =====
function makeWorldBodies(S) {
  const st = S.stage, P = CFG.phys, w = new CANNON.World();
  w.gravity.set(0, P.gravity, 0);
  w.broadphase = new CANNON.NaiveBroadphase();
  w.solver.iterations = P.iterations;
  w.defaultContactMaterial.friction = P.friction;
  w.defaultContactMaterial.restitution = P.restitution;
  const matBan = new CANNON.Material('banana'), matGround = new CANNON.Material('ground');
  w.addContactMaterial(new CANNON.ContactMaterial(matGround, matBan, { friction: P.bananaFriction, restitution: 0.1 }));
  S.world = w;

  // 床・天井・壁（吹き飛んだものが部屋の外へ出ないように）
  const R = st.room;
  const plane = (px, py, pz, nx, ny, nz, tag, mat) => {
    const b = new CANNON.Body({ mass: 0, material: mat || null });
    b.addShape(new CANNON.Plane());
    b.quaternion.setFromVectors(new CANNON.Vec3(0, 0, 1), new CANNON.Vec3(nx, ny, nz));
    b.position.set(px, py, pz); b.tag = tag; w.addBody(b);
  };
  plane(0, 0, 0, 0, 1, 0, 'floor', matGround);
  plane(0, R.h, 0, 0, -1, 0, 'ceil');
  plane(R.x, 0, 0, -1, 0, 0, 'wall'); plane(-R.x, 0, 0, 1, 0, 0, 'wall');
  plane(0, 0, R.zBack, 0, 0, 1, 'wall'); plane(0, 0, R.zFront, 0, 0, -1, 'wall');

  S.ents = {};
  for (const id in st.ents) {
    const d = st.ents[id];
    const e = { id, def: d, body: null, held: false, hold: { x: d.pos[0], y: d.pos[1], z: d.pos[2] }, yaw: d.yaw || 0, pv: new CANNON.Vec3(), broken: false };
    const b = new CANNON.Body({ mass: d.mass, material: id === 'banana' ? matBan : null });
    b.addShape(d.radius ? new CANNON.Sphere(d.radius) : new CANNON.Box(new CANNON.Vec3(d.half[0], d.half[1], d.half[2])));
    b.position.set(d.pos[0], d.pos[1], d.pos[2]);
    b.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), e.yaw);
    b.tag = id;
    if (d.kind === 'person' || d.kind === 'lamp') e.held = true;   // 立っている人・吊られたランプは、手を離されるまで動かない
    if (d.kind === 'person') { b.linearDamping = 0.05; b.angularDamping = 0.15; }
    b.addEventListener('collide', ev => { S.collisions.push({ ent: e, other: ev.body.tag, speed: Math.hypot(e.pv.x, e.pv.y, e.pv.z) }); });
    e.body = b; w.addBody(b);
    S.ents[id] = e;
  }
}

function holdEnts(S) {
  for (const id in S.ents) {
    const e = S.ents[id];
    if (!e.held || !e.body) continue;
    const b = e.body;
    b.position.set(e.hold.x, e.hold.y, e.hold.z);
    b.velocity.set(0, 0, 0); b.angularVelocity.set(0, 0, 0);
    b.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), e.yaw);
  }
}

function physStep(S, dt) {
  holdEnts(S);
  for (const id in S.ents) { const e = S.ents[id]; if (e.body) { const v = e.body.velocity; e.pv.set(v.x, v.y, v.z); } }
  S.world.step(dt);
}

function releaseEnt(e) { e.held = false; if (e.body) e.body.wakeUp(); }

// ===== レイキャスト（敵の射撃）。箱・球と、部屋の壁・天井・床 =====
function rayEnt(from, dir, e) {
  const b = e.body, d = e.def;
  if (d.radius) {                                           // 球
    const ox = from.x - b.position.x, oy = from.y - b.position.y, oz = from.z - b.position.z;
    const bq = ox * dir.x + oy * dir.y + oz * dir.z, c = ox * ox + oy * oy + oz * oz - d.radius * d.radius;
    const disc = bq * bq - c; if (disc < 0) return null;
    const t = -bq - Math.sqrt(disc); return t > 0 ? t : null;
  }
  const qi = b.quaternion.inverse();                        // 箱：回転を戻して軸に沿った箱として調べる
  const p = qi.vmult(new CANNON.Vec3(from.x - b.position.x, from.y - b.position.y, from.z - b.position.z));
  const v = qi.vmult(new CANNON.Vec3(dir.x, dir.y, dir.z));
  let t0 = 0, t1 = 1e9;
  const pp = [p.x, p.y, p.z], vv = [v.x, v.y, v.z], hh = d.half;
  for (let i = 0; i < 3; i++) {
    if (Math.abs(vv[i]) < 1e-9) { if (Math.abs(pp[i]) > hh[i]) return null; continue; }
    let a = (-hh[i] - pp[i]) / vv[i], c = (hh[i] - pp[i]) / vv[i];
    if (a > c) { const t = a; a = c; c = t; }
    t0 = Math.max(t0, a); t1 = Math.min(t1, c);
    if (t0 > t1) return null;
  }
  return t0 > 0 ? t0 : null;
}

// from から dir（単位ベクトル）へ撃つ。最初に当たったものを返す
function castRay(S, from, dir, exclude) {
  let best = { t: 1e9, ent: null, surface: null };
  for (const id of ['hero', 'A', 'B', 'crate', 'cyl', 'lamp', 'table']) {
    if (id === exclude) continue;
    const e = S.ents[id]; if (!e || e.broken) continue;
    const t = rayEnt(from, dir, e);
    if (t !== null && t < best.t) best = { t, ent: e, surface: null };
  }
  const R = S.stage.room;
  const planes = [[dir.x > 0 ? R.x : -R.x, 'x', 'wall'], [dir.z > 0 ? R.zFront : R.zBack, 'z', 'wall'],
                  [dir.y > 0 ? R.h : 0, 'y', dir.y > 0 ? 'ceiling' : 'floor']];
  for (const [val, ax, name] of planes) {
    if (Math.abs(dir[ax]) < 1e-9) continue;
    const t = (val - from[ax]) / dir[ax];
    if (t > 0 && t < best.t) best = { t, ent: null, surface: name };
  }
  best.point = { x: from.x + dir.x * best.t, y: from.y + dir.y * best.t, z: from.z + dir.z * best.t };
  return best;
}
// ===== 連鎖のルール。物理の衝突・音・時刻 → 敵の行動 → 結果。three.js は使わない =====
// 結果は台本ではなく、敵の弾（レイキャスト）と爆発の判定で決まる。
function newSim(stage, rng) {
  const S = { stage, rng: rng || Math.random, t: 0, state: 'ready', events: [], log: [], logKeys: {}, collisions: [],
    world: null, ents: null, target: null, result: null, doneAt: null, exploded: false, bananaLanded: false,
    hero: { alive: true, tipped: false, blasted: false, killedBy: null } };
  makeWorldBodies(S);
  S.A = newEnemyA(S);
  S.B = newEnemyB(S);
  return S;
}

function rnd(S, a, b) { return a + (b - a) * S.rng(); }
function pushLog(S, key, text) { if (S.logKeys[key]) return; S.logKeys[key] = 1; S.log.push({ key, text, t: S.t }); }
function emit(S, ev) { S.events.push(ev); }
function posOf(e) { const p = e.body.position; return { x: p.x, y: p.y, z: p.z }; }
function dist3(a, b) { return Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z); }
function distXZ(a, b) { return Math.hypot(a.x - b.x, a.z - b.z); }

// 命中：ここから連鎖が始まる（t = 0）
function simShoot(S, id) {
  const tg = S.stage.targets.find(x => x.id === id);
  S.state = 'running'; S.target = id; S.t = 0;
  pushLog(S, 'target', tg.name);
  emit(S, { type: 'impact', target: id, point: tg.aim });
  const E = S.ents, br = S.stage.branch;
  if (id === 'A') {
    const a = E.A; releaseEnt(a);
    const d = { x: tg.aim.x - br.x, z: tg.aim.z - br.z }, l = Math.hypot(d.x, d.z);
    a.body.velocity.set(d.x / l * CFG.hit.aPush, CFG.hit.aUp, d.z / l * CFG.hit.aPush);
    a.body.angularVelocity.set(-3.2, 0, 0);               // 前へのめって倒れる
    S.A.state = 'down'; S.A.byBullet = true;
    pushLog(S, 'aDown', '倒れる');
  } else if (id === 'lamp') {
    releaseEnt(E.lamp);
    E.lamp.body.velocity.set(rnd(S, -0.15, 0.15), 0, rnd(S, -0.1, 0.1));
    pushLog(S, 'lampFall', '落下');
    emit(S, { type: 'chainSnap', point: tg.aim });
  } else if (id === 'banana') {
    const b = E.banana.body, B = CFG.banana, T = B.flight + rnd(S, -B.flightJit, B.flightJit);
    const ang = rnd(S, 0, Math.PI * 2), r = Math.sqrt(S.rng()) * B.land;
    const lx = B.landX + Math.cos(ang) * r, lz = B.landZ + Math.sin(ang) * r;
    b.velocity.set((lx - b.position.x) / T, (0.05 - b.position.y - 0.5 * CFG.phys.gravity * T * T) / T, (lz - b.position.z) / T);
    b.angularVelocity.set(rnd(S, -6, 6), rnd(S, -6, 6), rnd(S, -6, 6));
    b.wakeUp();
    pushLog(S, 'banFly', '飛ぶ');
    emit(S, { type: 'bananaHit', point: tg.aim });
  } else if (id === 'bottle') {
    const e = E.bottle; e.broken = true; S.world.remove(e.body);
    emit(S, { type: 'shatter', kind: 'bottle', pos: posOf(e) });
    pushLog(S, 'bottle', '割れる');
    const heard = emitNoise(S, 'shatter', posOf(e), CFG.loud.bottle);
    if (!heard) pushLog(S, 'ignored', '誰も気にしない');
  }
}

// 音。聞こえた敵が反応する。誰かが反応したら true
function emitNoise(S, kind, pos, loud) {
  emit(S, { type: 'noise', kind, pos, loud });
  const a = enemyAHear(S, kind, pos, loud), b = enemyBHear(S, kind, pos, loud);
  return a || b;
}

function simStep(S, dt) {
  if (S.state !== 'running') return;
  S.t += dt;
  enemyAUpdate(S, dt);
  enemyBUpdate(S, dt);
  physStep(S, dt);
  processCollisions(S);
  checkEnd(S);
}

function processCollisions(S) {
  const list = S.collisions; S.collisions = [];
  for (const c of list) {
    const e = c.ent;
    if (e.id === 'lamp' && !e.broken && c.speed > 2) {
      e.broken = true; S.world.remove(e.body);
      emit(S, { type: 'shatter', kind: 'lamp', pos: posOf(e) });
      emitNoise(S, 'crash', posOf(e), CFG.loud.lamp);
    } else if (e.id === 'banana' && c.other === 'floor' && c.speed > 1.5 && !S.bananaLanded) {
      S.bananaLanded = true;
      const p = posOf(e);
      emit(S, { type: 'thud', pos: p, speed: 3, soft: true });
      emitNoise(S, 'drop', p, CFG.loud.banana);
      if (distXZ(p, posOf(S.ents.B)) < 3) pushLog(S, 'nearB', '敵Bの足元へ');
    } else if (e.id === 'A' && c.other === 'floor' && c.speed > 1.2 && S.A.byBullet && !S.A.noised && e.body.quaternion.vmult(new CANNON.Vec3(0, 1, 0)).y < 0.6) {   // 体が傾いて倒れたとき
      S.A.noised = true;
      emit(S, { type: 'thud', pos: posOf(e), speed: 6 });
      emitNoise(S, 'allyDown', posOf(e), CFG.loud.allyDown);
    } else if ((e.def.kind === 'person' || e.id === 'crate' || e.id === 'cyl') && c.other === 'floor' && c.speed > 2.5) {
      if (!e.lastThud || S.t - e.lastThud > 0.3) { e.lastThud = S.t; emit(S, { type: 'thud', pos: posOf(e), speed: c.speed }); }
    }
  }
}

// 銃を撃つ。レイキャストで当たったものが決まる
function fireGun(S, who, from, dir, kind) {
  const r = castRay(S, from, dir, who);
  emit(S, { type: 'gunshot', who, kind, from, to: r.point, hit: r.ent ? r.ent.id : r.surface });
  if (r.ent && r.ent.id === 'hero' && S.hero.alive) {
    S.hero.alive = false; S.hero.killedBy = who;
    releaseEnt(r.ent);
    r.ent.body.velocity.set(dir.x * 2, 1.2, dir.z * 2);
    r.ent.body.angularVelocity.set(dir.z * 2, 0, -dir.x * 2);
    emit(S, { type: 'heroHit', point: r.point });
  } else if (r.ent && r.ent.id === 'cyl' && !S.exploded) {
    pushLog(S, 'cylHit', 'ボンベに命中');
    explode(S, posOf(r.ent));
  }
  return r;
}

function explode(S, pos) {
  const B = CFG.blast; S.exploded = true;
  emit(S, { type: 'explode', pos });
  pushLog(S, 'explode', '爆発');
  S.ents.cyl.broken = true; S.world.remove(S.ents.cyl.body);
  let blown = false;
  for (const id of ['A', 'B', 'crate', 'hero']) {
    const e = S.ents[id], p = posOf(e), d = dist3(p, pos);
    if (d > B.radius) continue;
    const k = Math.max(B.min, 1 - d / B.radius);
    const hx = p.x - pos.x, hz = p.z - pos.z, hl = Math.hypot(hx, hz) || 1;
    if (e.held) releaseEnt(e);
    e.body.velocity.set(hx / hl * B.speed * k, B.speed * B.up * k + 1, hz / hl * B.speed * k);
    e.body.angularVelocity.set(rnd(S, -B.spin, B.spin), rnd(S, -1, 1), rnd(S, -B.spin, B.spin));
    if (id === 'A') { S.A.state = 'down'; blown = true; }
    if (id === 'B') { S.B.state = 'down'; blown = true; }
    if (id === 'hero') {
      S.hero.tipped = true; S.hero.blasted = true;
      if (d < B.lethal && S.hero.alive) { S.hero.alive = false; S.hero.killedBy = 'blast'; emit(S, { type: 'heroHit', point: p }); }
    }
  }
  if (blown) pushLog(S, 'blown', '敵が吹き飛ぶ');
}

function checkEnd(S) {
  if (S.doneAt === null) {
    if (!S.hero.alive) { S.doneAt = S.t + CFG.time.hitHold; finishSim(S, false); }
    else if (S.t >= CFG.time.endAt) { S.doneAt = S.t + 0.3; finishSim(S, true); }
  }
  if (S.doneAt !== null && S.t >= S.doneAt && S.state === 'running') { S.state = 'done'; emit(S, { type: 'done', result: S.result }); }
  if (S.t > CFG.time.simMax && S.state === 'running') { S.state = 'done'; if (!S.result) finishSim(S, S.hero.alive); }
}

function finishSim(S, ok) {
  const id = S.target;
  if (ok) pushLog(S, 'end', S.hero.blasted ? '主人公 無傷' : '主人公 生存');
  else pushLog(S, 'end', S.hero.killedBy === 'blast' ? '主人公 爆風を受ける' : '主人公 被弾');
  let sub;
  if (ok) sub = id === 'lamp' ? '正攻法' : id === 'banana' ? 'バカな方法' : '偶然の成功';
  else sub = id === 'bottle' ? '何も変わらなかった' : id === 'A' ? '仲間に気づかれた' : '未来は変わらなかった';
  S.result = { ok, target: id, sub, lines: S.log.map(l => l.text) };
}
// ===== 敵の状態と射撃。three.js は使わない =====
// A：aim（主人公を狙う）→ 時刻が来たら撃つ。近くで物が砕けると startled（驚いて反射で撃つ・銃口が跳ねる）。倒れたら down
// B：idle → 音で行動が変わる（allyDown: 振り向いて撃つ / crash: 伏せる / drop: 駆け寄る）。転ぶと slip（暴発）
function newEnemyA(S) {
  return { state: 'aim', fireAt: CFG.time.aFireAt + rnd(S, -CFG.time.aFireJit, CFG.time.aFireJit), panicAt: 0, byBullet: false, noised: false };
}
function newEnemyB(S) {
  const e = S.ents.B;
  return { state: 'idle', reactAt: 0, target: null, speed: CFG.enemy.bRun + rnd(S, -CFG.enemy.bRunJit, CFG.enemy.bRunJit),
    turnEnd: 0, duckEnd: 0, misfireAt: 0, heading: yawFwd(e.yaw), chaseEnd: 0, yawGoal: e.yaw };
}

function aimDir(from, to, errYaw, errPitch) {
  const dx = to.x - from.x, dy = to.y - from.y, dz = to.z - from.z, l = Math.hypot(dx, dy, dz);
  const yaw = Math.atan2(dx, dz) + errYaw, pitch = Math.asin(dy / l) + errPitch;
  return { x: Math.sin(yaw) * Math.cos(pitch), y: Math.sin(pitch), z: Math.cos(yaw) * Math.cos(pitch) };
}
function chestOf(e) { const p = posOf(e); return { x: p.x, y: p.y + 0.2, z: p.z }; }
function muzzleOf(e) {                                   // 立っている人の銃口（向いている方向の前）
  const p = posOf(e), f = yawFwd(e.yaw);
  return { x: p.x + f.x * 0.6, y: p.y + 0.45, z: p.z + f.z * 0.6 };
}

function enemyAHear(S, kind, pos, loud) {
  const a = S.A, e = S.ents.A;
  if (a.state !== 'aim') return false;
  if (kind === 'crash' && distXZ(posOf(e), pos) < CFG.enemy.startleDist) {
    a.state = 'startled'; a.panicAt = S.t + CFG.enemy.panicDelay;
    pushLog(S, 'startle', '敵が驚く');
    return true;
  }
  return false;
}

function enemyAUpdate(S, dt) {
  const a = S.A, e = S.ents.A, E = CFG.enemy;
  if (a.state === 'aim' && S.t >= a.fireAt) {
    a.state = 'fired';
    pushLog(S, 'aFire', '敵Aが撃つ');
    fireGun(S, 'A', muzzleOf(e), aimDir(muzzleOf(e), chestOf(S.ents.hero), rnd(S, -E.aimErr, E.aimErr), rnd(S, -E.aimErr, E.aimErr)), 'aim');
  } else if (a.state === 'startled' && S.t >= a.panicAt) {
    a.state = 'frozen';                                   // 驚いて撃ったあとは固まる
    fireGun(S, 'A', muzzleOf(e), aimDir(muzzleOf(e), chestOf(S.ents.hero), rnd(S, -0.3, 0.3), E.panicPitch + rnd(S, -E.panicJit, E.panicJit)), 'panic');
    if (S.hero.alive) pushLog(S, 'miss', '銃撃が外れる');
  }
}

function enemyBHear(S, kind, pos, loud) {
  const b = S.B, e = S.ents.B;
  if (b.state !== 'idle' && b.state !== 'duck') return false;
  if (distXZ(posOf(e), pos) > loud * CFG.enemy.hearing) return false;
  const E = CFG.enemy;
  if (kind === 'allyDown') {
    const hp = posOf(S.ents.hero), ep = posOf(e);
    b.state = 'turn'; b.turnEnd = S.t + E.bTurn; b.yawGoal = yawToward(hp.x - ep.x, hp.z - ep.z);
    pushLog(S, 'bTurn', '物音で敵Bが振り向く');
    return true;
  }
  if (kind === 'crash' && b.state === 'idle') { b.state = 'duck'; b.duckEnd = S.t + E.bDuck; return true; }
  if (kind === 'drop' && b.state === 'idle') {
    b.state = 'investigate'; b.reactAt = S.t + rnd(S, E.bReactMin, E.bReactMax); b.chaseEnd = b.reactAt + E.chaseTimeout;
    return true;
  }
  return false;
}

function enemyBUpdate(S, dt) {
  const b = S.B, e = S.ents.B, E = CFG.enemy;
  if (b.state === 'turn') {
    const diff = Math.atan2(Math.sin(b.yawGoal - e.yaw), Math.cos(b.yawGoal - e.yaw));
    e.yaw += Math.sign(diff) * Math.min(Math.abs(diff), dt * 9);
    if (S.t >= b.turnEnd) {
      b.state = 'shot'; e.yaw = b.yawGoal;
      pushLog(S, 'bFire', '敵Bが撃つ');
      fireGun(S, 'B', muzzleOf(e), aimDir(muzzleOf(e), chestOf(S.ents.hero), rnd(S, -E.aimErr, E.aimErr), rnd(S, -E.aimErr, E.aimErr)), 'aim');
    }
  } else if (b.state === 'duck') {
    if (S.t >= b.duckEnd) b.state = 'idle';
  } else if (b.state === 'investigate') {
    if (S.t < b.reactAt) return;
    const bp = posOf(S.ents.banana), p = posOf(e);
    const dx = bp.x - p.x, dz = bp.z - p.z, l = Math.hypot(dx, dz) || 1;
    if (l < E.slipDist && bp.y < 0.4) {                    // 踏んだ
      b.state = 'slip'; b.heading = { x: dx / l, z: dz / l };
      releaseEnt(e);
      e.body.velocity.set(-b.heading.x * 2.2, 2.6, -b.heading.z * 2.2);
      e.body.angularVelocity.set(-3 * b.heading.z, 0, 3 * b.heading.x);   // 後ろへのけぞって倒れる
      b.misfireAt = S.t + E.misfireDelay;
      pushLog(S, 'slip', '敵Bが転ぶ');
      emit(S, { type: 'slip', pos: p });
      return;
    }
    if (S.t > b.chaseEnd) { b.state = 'idle'; return; }
    const st = Math.min(l, b.speed * dt);
    e.hold.x += dx / l * st; e.hold.z += dz / l * st;
    e.yaw = yawToward(dx, dz); b.heading = { x: dx / l, z: dz / l };
  } else if (b.state === 'slip') {
    if (S.t >= b.misfireAt) {
      b.state = 'down';                                    // 暴発は 1 回だけ
      const cyl = S.ents.cyl;
      if (cyl.broken) return;
      const p = posOf(e), from = { x: p.x, y: p.y + 0.4, z: p.z }, to = posOf(cyl);
      pushLog(S, 'misfire', '銃が暴発');
      fireGun(S, 'B', from, aimDir(from, to, rnd(S, -E.misfireErr, E.misfireErr), rnd(S, -E.misfireErr, E.misfireErr)), 'misfire');
    }
  }
}
// ===== 音（Web Audio で作る。音声ファイルは使わない） =====
// ブラウザは最初の操作（クリック・タップ・キー）まで音を出せないので、そのときに作る
const SND = { ctx: null, out: null, noise: null, mute: false, whoosh: null };

function sndInit() {
  if (SND.ctx) { if (SND.ctx.state === 'suspended') SND.ctx.resume(); return; }
  try {
    const C = window.AudioContext || window.webkitAudioContext;
    SND.ctx = new C();
    SND.out = SND.ctx.createGain();
    SND.out.gain.value = 0.6;
    SND.out.connect(SND.ctx.destination);
    const len = SND.ctx.sampleRate * 2, buf = SND.ctx.createBuffer(1, len, SND.ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    SND.noise = buf;
  } catch (e) { SND.ctx = null; }                         // 音が出せない環境では鳴らさないだけ
}

// 音程のある音（freq から to へ下がる・上がる）
function sndTone(freq, to, dur, type, vol, delay) {
  if (!SND.ctx || SND.mute) return;
  const t0 = SND.ctx.currentTime + (delay || 0), o = SND.ctx.createOscillator(), g = SND.ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, to), t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(SND.out);
  o.start(t0); o.stop(t0 + dur + 0.02);
}

// ざらついた音（フィルタの周波数を from から to へ動かす）
function sndNoise(dur, vol, filter, from, to, delay) {
  if (!SND.ctx || SND.mute) return;
  const t0 = SND.ctx.currentTime + (delay || 0), s = SND.ctx.createBufferSource(), f = SND.ctx.createBiquadFilter(), g = SND.ctx.createGain();
  s.buffer = SND.noise;
  f.type = filter; f.frequency.setValueAtTime(from, t0);
  f.frequency.exponentialRampToValueAtTime(Math.max(20, to), t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(SND.out);
  s.start(t0); s.stop(t0 + dur + 0.02);
}

function sndShot() { sndNoise(0.5, 0.9, 'lowpass', 3000, 120, 0); sndTone(160, 40, 0.35, 'sawtooth', 0.5, 0); sndNoise(1.2, 0.25, 'lowpass', 900, 100, 0.12); }
function sndGlass() { sndNoise(0.5, 0.5, 'highpass', 3500, 6000, 0); for (let i = 0; i < 6; i++) sndTone(2500 + Math.random() * 3000, 1500, 0.12, 'triangle', 0.07, 0.03 + i * 0.06); }

// 風切り音：弾が飛んでいる間ずっと鳴らし、近づくほど高く・大きくする
function sndWhooshStart() {
  if (!SND.ctx || SND.mute || SND.whoosh) return;
  const s = SND.ctx.createBufferSource(), f = SND.ctx.createBiquadFilter(), g = SND.ctx.createGain();
  s.buffer = SND.noise; s.loop = true;
  f.type = 'bandpass'; f.frequency.value = 500; f.Q.value = 1.2;
  g.gain.value = 0.0;
  s.connect(f); f.connect(g); g.connect(SND.out); s.start();
  SND.whoosh = { s, f, g };
}
function sndWhooshSet(k) {                                // k: 0〜1
  const w = SND.whoosh; if (!w) return;
  const t = SND.ctx.currentTime;
  w.f.frequency.setTargetAtTime(400 + k * 2600, t, 0.05);
  w.g.gain.setTargetAtTime(0.05 + k * 0.4, t, 0.05);
}
function sndWhooshStop() {
  const w = SND.whoosh; if (!w) return;
  SND.whoosh = null;
  try { w.g.gain.setTargetAtTime(0, SND.ctx.currentTime, 0.03); w.s.stop(SND.ctx.currentTime + 0.2); } catch (e) {}
}
// ===== 部屋・光・小物の見た目（薄暗い夜の倉庫） =====
const ROOM = { lampLight: null, hemi: null, moon: null, glass: null, views: {}, chain: null, lampBase: null, dust: [] };

function canvasTex(w, h, draw, rx, ry) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx || 1, ry || 1);
  t.anisotropy = 4;
  return t;
}
function noiseFill(g, w, h, base, amp, n) {
  g.fillStyle = base; g.fillRect(0, 0, w, h);
  for (let i = 0; i < n; i++) {
    const v = Math.floor((Math.random() - 0.5) * amp);
    g.fillStyle = v > 0 ? 'rgba(255,255,255,' + (v / 255) + ')' : 'rgba(0,0,0,' + (-v / 255) + ')';
    g.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random() * 3, 1 + Math.random() * 3);
  }
}
function mkBox(parent, w, h, d, mat, x, y, z, cast) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.castShadow = cast !== false; m.receiveShadow = true;
  parent.add(m); return m;
}
const stdMat = (color, rough, metal, extra) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: rough === undefined ? 0.85 : rough, metalness: metal || 0 }, extra || {}));

function buildRoom(scene) {
  const R = STAGE1.room, W = STAGE1.window, H = R.h, zl = R.zBack, zf = R.zFront, Wd = R.x * 2, D = zf - zl;
  scene.background = new THREE.Color(0x05070a);
  scene.fog = new THREE.Fog(0x05070a, 9, 24);

  // 材質（キャンバスで作った模様）
  const concrete = canvasTex(256, 256, (g, w, h) => {
    noiseFill(g, w, h, '#4a4c4e', 70, 2600);
    g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 2;
    g.strokeRect(1, 1, w - 2, h - 2);
  }, R.x * 2 / 2.2, D / 2.2);
  const wallTex = canvasTex(256, 256, (g, w, h) => {
    noiseFill(g, w, h, '#3c3a38', 50, 1800);
    g.fillStyle = 'rgba(0,0,0,.35)';
    for (let y = 0; y < h; y += 32) { g.fillRect(0, y, w, 2); for (let x = (y / 32 % 2) * 32; x < w; x += 64) g.fillRect(x, y, 2, 32); }
  }, 6, 2);
  const woodTex = canvasTex(128, 128, (g, w, h) => {
    noiseFill(g, w, h, '#6b4a2a', 40, 600);
    g.fillStyle = 'rgba(0,0,0,.3)'; for (let y = 0; y < h; y += 16) g.fillRect(0, y, w, 1.5);
  }, 1, 1);
  const floorM = stdMat(0xffffff, 0.9, 0, { map: concrete });
  const wallM = stdMat(0xffffff, 0.95, 0, { map: wallTex });
  const darkM = stdMat(0x1a1b1d, 0.9);
  const woodM = stdMat(0xffffff, 0.8, 0, { map: woodTex });
  const metalM = stdMat(0x25282b, 0.5, 0.7);

  // 光：窓からの月明かり（青白い光の筋）、吊りランプ（暖かい光）、うっすらした環境光
  ROOM.hemi = new THREE.HemisphereLight(0x4a5870, 0x1a1410, 0.3);
  scene.add(ROOM.hemi);
  const moon = new THREE.DirectionalLight(0x7f9ad0, 0.75);
  moon.position.set(0, 5.5, 13); moon.target.position.set(0, 0, -2);
  moon.castShadow = true; moon.shadow.mapSize.set(1024, 1024);
  Object.assign(moon.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 30 });
  moon.shadow.bias = -0.001;
  scene.add(moon, moon.target); ROOM.moon = moon;
  const lamp = new THREE.PointLight(0xffb464, 1.7, 15, 1.6);
  lamp.position.set(...STAGE1.ents.lamp.pos);
  lamp.castShadow = true; lamp.shadow.mapSize.set(1024, 1024); lamp.shadow.bias = -0.003; lamp.shadow.radius = 3;
  scene.add(lamp); ROOM.lampLight = lamp;

  // 床・天井・壁
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(Wd, D), floorM);
  floor.rotation.x = -Math.PI / 2; floor.position.set(0, 0, (zf + zl) / 2); floor.receiveShadow = true; scene.add(floor);
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(Wd, D), darkM);
  ceil.rotation.x = Math.PI / 2; ceil.position.set(0, H, (zf + zl) / 2); scene.add(ceil);
  mkBox(scene, Wd, 3, 0.3, wallM, 0, 1.5, zl - 0.15);                          // 奥
  mkBox(scene, Wd, H - 3, 0.3, wallM, 0, 3 + (H - 3) / 2, zl - 0.15);
  mkBox(scene, 0.3, H, D, wallM, R.x + 0.15, H / 2, (zf + zl) / 2);            // 左右
  mkBox(scene, 0.3, H, D, wallM, -R.x - 0.15, H / 2, (zf + zl) / 2);
  // 手前の壁（窓の穴つき）
  const wy0 = W.y - W.h / 2, wy1 = W.y + W.h / 2, wx0 = W.x - W.w / 2, wx1 = W.x + W.w / 2;
  mkBox(scene, Wd, wy0, 0.3, wallM, 0, wy0 / 2, zf + 0.15);
  mkBox(scene, Wd, H - wy1, 0.3, wallM, 0, wy1 + (H - wy1) / 2, zf + 0.15);
  mkBox(scene, wx0 + R.x, W.h, 0.3, wallM, (-R.x + wx0) / 2, W.y, zf + 0.15);
  mkBox(scene, R.x - wx1, W.h, 0.3, wallM, (R.x + wx1) / 2, W.y, zf + 0.15);
  // 窓枠・ガラス
  mkBox(scene, 0.06, W.h + 0.1, 0.1, metalM, W.x, W.y, zf);
  mkBox(scene, W.w + 0.1, 0.06, 0.1, metalM, W.x, W.y, zf);
  mkBox(scene, W.w + 0.1, 0.07, 0.12, metalM, W.x, wy0, zf);
  mkBox(scene, W.w + 0.1, 0.07, 0.12, metalM, W.x, wy1, zf);
  const glass = new THREE.Mesh(new THREE.BoxGeometry(W.w, W.h, 0.02),
    new THREE.MeshStandardMaterial({ color: 0x9fb8d8, roughness: 0.1, metalness: 0.1, transparent: true, opacity: 0.28 }));
  glass.position.set(W.x, W.y, zf); scene.add(glass); ROOM.glass = glass;
  // 梁・柱・配管（暗い倉庫らしさ）
  for (let z = -4; z <= 2; z += 2) mkBox(scene, Wd, 0.25, 0.18, darkM, 0, H - 0.12, z);
  for (const sx of [-1, 1]) {
    mkBox(scene, 0.35, H, 0.35, wallM, sx * (R.x - 0.3), H / 2, -4.3);
    mkBox(scene, 0.35, H, 0.35, wallM, sx * (R.x - 0.3), H / 2, 1.5);
    const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, D, 8), metalM);
    pipe.rotation.x = Math.PI / 2; pipe.position.set(sx * (R.x - 0.1), 3.5, (zf + zl) / 2); scene.add(pipe);
  }
  // 棚と木箱（奥・左）
  mkBox(scene, 0.12, 2.4, 0.5, metalM, -3.9, 1.2, -3.2); mkBox(scene, 0.12, 2.4, 0.5, metalM, -2.6, 1.2, -3.2);
  for (const y of [0.6, 1.3, 2.0]) mkBox(scene, 1.4, 0.06, 0.55, metalM, -3.25, y, -3.2);
  mkBox(scene, 0.5, 0.4, 0.4, woodM, -3.5, 0.83, -3.2); mkBox(scene, 0.4, 0.3, 0.4, woodM, -2.9, 1.53, -3.2);
  mkBox(scene, 0.6, 0.6, 0.6, woodM, -3.5, 0.3, -1.6); mkBox(scene, 0.55, 0.5, 0.55, woodM, -2.8, 0.25, -1.5);
  for (const [x, z] of [[-3.6, 3.6], [-2.9, 3.9], [3.6, 2.8]]) {
    const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.9, 14), stdMat(0x2c3a4a, 0.5, 0.5));
    bar.position.set(x, 0.45, z); bar.castShadow = bar.receiveShadow = true; scene.add(bar);
  }

  // ほこり（ゆっくり漂う光の粒）
  const dg = new THREE.SphereGeometry(0.012, 4, 3), dm = new THREE.MeshBasicMaterial({ color: 0xffe0b0, transparent: true, opacity: 0.55 });
  for (let i = 0; i < 70; i++) {
    const m = new THREE.Mesh(dg, dm);
    m.position.set((Math.random() - 0.5) * 9, Math.random() * 3.6, -4 + Math.random() * 8);
    m.userData = { ph: Math.random() * 6.3, sp: 0.1 + Math.random() * 0.2 };
    scene.add(m); ROOM.dust.push(m);
  }
}

// 動く小物・テーブルなど（STAGE1.ents ごとに見た目を作る。位置は剛体から毎フレーム反映）
function buildProps(scene) {
  const E = STAGE1.ents;
  const woodM = stdMat(0x5a3d22, 0.8), darkM = stdMat(0x1a1b1d, 0.9);
  const V = ROOM.views;
  const wrap = (id, build) => { const g = new THREE.Group(); build(g); scene.add(g); V[id] = { obj: g }; return g; };

  wrap('table', g => {
    const h = E.table.half;
    mkBox(g, h[0] * 2, 0.07, h[2] * 2, woodM, 0, h[1] - 0.035, 0);
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) mkBox(g, 0.07, h[1] * 2 - 0.07, 0.07, woodM, sx * (h[0] - 0.08), -0.035, sz * (h[2] - 0.08));
  });
  wrap('crate', g => {
    const h = E.crate.half[0], m = stdMat(0x7a5530, 0.8);
    mkBox(g, h * 2, h * 2, h * 2, m, 0, 0, 0);
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) mkBox(g, 0.06, h * 2 + 0.02, 0.06, darkM, sx * (h - 0.02), 0, sz * (h - 0.02));
    mkBox(g, h * 2 + 0.02, 0.06, h * 2 + 0.02, darkM, 0, 0, 0);
  });
  wrap('cyl', g => {
    const r = 0.17, hh = E.cyl.half[1], m = stdMat(0xc0281e, 0.4, 0.3);
    const body = new THREE.Mesh(new THREE.CylinderGeometry(r, r, hh * 2 - 0.2, 16), m); body.castShadow = true; g.add(body);
    const dome = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2), m); dome.position.y = hh - 0.1; dome.castShadow = true; g.add(dome);
    const valve = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.14, 8), stdMat(0xb8a040, 0.4, 0.8)); valve.position.y = hh + 0.05; g.add(valve);
    const band = new THREE.Mesh(new THREE.CylinderGeometry(r + 0.004, r + 0.004, 0.1, 16), stdMat(0xe8e0d0, 0.6)); band.position.y = 0.15; g.add(band);
  });
  wrap('banana', g => {
    const m = stdMat(0xf2cf2a, 0.55), tip = stdMat(0x4a3a1a, 0.7);
    // 曲がったバナナ：3 つの棒をつないだ
    const seg = (x, y, rz, len) => { const s = mkBox(g, len, 0.075, 0.075, m, x, y, 0); s.rotation.z = rz; return s; };
    seg(-0.1, -0.012, 0.35, 0.12); seg(0, 0.012, 0, 0.14); seg(0.1, -0.012, -0.35, 0.12);
    mkBox(g, 0.03, 0.04, 0.04, tip, -0.165, -0.04, 0); mkBox(g, 0.035, 0.04, 0.04, tip, 0.165, -0.04, 0);
    g.scale.setScalar(1.15);
  });
  wrap('bottle', g => {
    const m = stdMat(0x1c4a2a, 0.15, 0.2, { transparent: true, opacity: 0.92 });
    const b = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.2, 12), m); b.position.y = -0.04; b.castShadow = true; g.add(b);
    const n = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.03, 0.12, 10), m); n.position.y = 0.12; n.castShadow = true; g.add(n);
    const l = new THREE.Mesh(new THREE.CylinderGeometry(0.047, 0.047, 0.07, 12), stdMat(0xe8dcc0, 0.8)); l.position.y = -0.05; g.add(l);
  });
  wrap('lamp', g => {
    const shade = new THREE.Mesh(new THREE.ConeGeometry(0.34, 0.3, 20, 1, true), new THREE.MeshStandardMaterial({ color: 0x2d4a36, roughness: 0.5, metalness: 0.4, side: THREE.DoubleSide }));
    shade.position.y = 0.12; shade.castShadow = false; g.add(shade);
    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 10), new THREE.MeshBasicMaterial({ color: 0xffe4a8 })); bulb.position.y = -0.04; g.add(bulb);
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.12, 8), metalOf()); cap.position.y = 0.32; g.add(cap);
    ROOM.lampShade = shade;
  });
  // 鎖（天井からランプまで。ランプが落ちたら短く残る）
  const chain = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 1, 6), stdMat(0x333333, 0.4, 0.8));
  scene.add(chain); ROOM.chain = chain;
  // ランプの光る傘が壁や天井にも明かりを作る（光源は本体の位置に合わせる）
  function metalOf() { return stdMat(0x25282b, 0.5, 0.7); }
}

// 場面をはじめの状態に戻す（リトライのとき）
function roomReset() {
  for (const id in ROOM.views) ROOM.views[id].obj.visible = true;
  ROOM.lampLight.intensity = 1.7; ROOM.lampLight.color.setHex(0xffb464);
  ROOM.chainCut = false;
}

// 剛体の位置・向きを見た目に反映
function roomSync(S, time) {
  for (const id in ROOM.views) {
    const e = S.ents[id], v = ROOM.views[id];
    if (!e) continue;
    if (e.broken) { v.obj.visible = false; continue; }
    const p = e.body.position, q = e.body.quaternion;
    v.obj.position.set(p.x, p.y, p.z); v.obj.quaternion.set(q.x, q.y, q.z, q.w);
  }
  const lamp = S.ents.lamp, top = STAGE1.chainTop;
  if (!lamp.broken) {
    const y = lamp.body.position.y + 0.3, len = lamp.held ? top - y : 0.9;
    ROOM.chain.visible = true;
    if (lamp.held) { ROOM.chain.scale.y = len; ROOM.chain.position.set(lamp.body.position.x, y + len / 2, lamp.body.position.z); ROOM.chain.quaternion.set(0, 0, 0, 1); }
    else { ROOM.chain.scale.y = 0.9; ROOM.chain.position.set(STAGE1.ents.lamp.pos[0], top - 0.45, STAGE1.ents.lamp.pos[2]); }   // 切れて短くなった鎖
    ROOM.lampLight.position.set(lamp.body.position.x, lamp.body.position.y - 0.05, lamp.body.position.z);
  } else {
    ROOM.chain.scale.y = 0.9; ROOM.chain.position.set(STAGE1.ents.lamp.pos[0], top - 0.45, STAGE1.ents.lamp.pos[2]);
  }
  // ほこり
  for (const m of ROOM.dust) {
    const u = m.userData;
    m.position.y += Math.sin(time * u.sp + u.ph) * 0.0006; m.position.x += Math.cos(time * u.sp * 0.7 + u.ph) * 0.0006;
  }
}
// ===== 人型（箱の組み合わせ）。立っている間は位置を追い、倒れる・吹き飛ぶときは剛体の動きにそのまま乗る =====
const PEOPLE = {};

function makePerson(scene, id, look) {
  const d = STAGE1.ents[id], hy = d.half[1];
  const outer = new THREE.Group(), g = new THREE.Group();     // outer：剛体の中心に合わせる／g：足元が原点
  g.position.y = -hy; outer.add(g); scene.add(outer);
  const skin = stdMat(0xd6a984, 0.7), cloth = stdMat(look.cloth, 0.8), pants = stdMat(look.pants, 0.85), dark = stdMat(0x111214, 0.5, 0.4);
  const P = { outer, g, id, limbs: {}, seated: id === 'hero' };
  const limb = (x, y, w, h, d2, mat, pivotY) => {            // 上端を軸に回せる四肢
    const piv = new THREE.Group(); piv.position.set(x, y, 0); g.add(piv);
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d2), mat); m.position.y = -h / 2; m.castShadow = true; m.receiveShadow = true; piv.add(m);
    return piv;
  };
  if (!P.seated) {
    P.limbs.legL = limb(-0.1, 0.84, 0.16, 0.84, 0.18, pants);
    P.limbs.legR = limb(0.1, 0.84, 0.16, 0.84, 0.18, pants);
  } else {
    // 椅子にすわる：ももは前へ、すねは下へ。椅子と縄
    const wood = stdMat(0x4a3320, 0.8);
    mkBox(g, 0.5, 0.06, 0.5, wood, 0, 0.45, 0.02);
    mkBox(g, 0.5, 0.55, 0.05, wood, 0, 0.75, 0.27);
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) mkBox(g, 0.05, 0.45, 0.05, wood, sx * 0.21, 0.22, sz * 0.21 + 0.02);
    for (const sx of [-1, 1]) {
      mkBox(g, 0.16, 0.16, 0.45, pants, sx * 0.1, 0.56, -0.2);
      mkBox(g, 0.15, 0.45, 0.15, pants, sx * 0.1, 0.3, -0.42);
    }
    P.rope = mkBox(g, 0.54, 0.06, 0.34, stdMat(0xb89a64, 0.9), 0, 1.0, 0);
  }
  const torsoY = P.seated ? 0.88 : 1.16;
  const torso = mkBox(g, 0.5, 0.62, 0.28, cloth, 0, torsoY, 0); P.torso = torso;
  P.head = new THREE.Group(); P.head.position.set(0, torsoY + 0.42, 0); g.add(P.head);
  const hm = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.27, 0.24), skin); hm.castShadow = true; P.head.add(hm);
  const hair = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.1, 0.26), stdMat(look.hair, 0.9)); hair.position.y = 0.11; P.head.add(hair);
  if (look.mask) { const mk = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.1, 0.25), dark); mk.position.y = -0.05; P.head.add(mk); }
  if (P.seated) {

  } else {

function peopleSync(S, time) {
  for (const id of ['hero', 'A', 'B']) {
    const P = PEOPLE[id], e = S.ents[id], p = e.body.position, q = e.body.quaternion;
    P.outer.position.set(p.x, p.y, p.z); P.outer.quaternion.set(q.x, q.y, q.z, q.w);
    let crouch = 1, headTilt = 0;
    if (id === 'hero') {
      P.head.rotation.x = S.hero.alive ? Math.sin(time * 1.3) * 0.05 : 0.6;
      continue;
    }
    const en = id === 'A' ? S.A : S.B, held = e.held;
    const L = P.limbs;
    let la = 0, ra = 0, legs = 0;
    if (id === 'A') {
      if (en.state === 'aim' || en.state === 'fired') { la = ra = Math.PI / 2; }
      else if (en.state === 'startled' || en.state === 'frozen') { la = ra = 2.5; headTilt = -0.4; }
      else { la = 0.9 * Math.sin(time * 9); ra = 2.2; }
    } else {
      if (en.state === 'idle') { la = 0.15; ra = 0.25; P.head.rotation.y = Math.sin(time * 0.8) * 0.5; }
      else if (en.state === 'investigate') { const sw = held && S.t > en.reactAt ? Math.sin(time * 16) : 0; legs = sw * 0.9; la = -sw * 0.8; ra = 0.9 + sw * 0.4; P.head.rotation.y = 0; }
      else if (en.state === 'turn' || en.state === 'shot') { la = ra = Math.PI / 2; }
      else if (en.state === 'duck') { crouch = 0.62; la = 2.2; ra = 2.2; }
      else { la = 2.4 * Math.sin(time * 7); ra = 2.2 * Math.cos(time * 6) + 1.5; legs = 1.0; }
    }
    setArms(P, la, ra);
    if (L.legL) { L.legL.rotation.x = legs; L.legR.rotation.x = -legs; }
    P.g.scale.y = crouch; P.g.position.y = -STAGE1.ents[id].half[1];

  }
}

function fxUpdate(dt) {

    const k = 1 - p.life / p.max, s = p.s0 + (p.s1 - p.s0) * k;

// ===== カメラ：見回し・弾への追従・寄り・引き画（縦長の画面用） =====
// fov は「横の視野角」で持つ。縦の視野角は画面の縦横比から求める（縦長でも横に同じだけ入る）
const CAM = { cam: null, p: { x: 0, y: 2, z: 5 }, l: { x: 0, y: 1.5, z: 0 }, fov: 60 };

// goal: {x,y,z,lx,ly,lz,fov}。k: 追いつく速さ（1 秒あたり）。k が null なら即座に
function camGo(goal, dt, k) {
  const f = k === null ? 1 : Math.min(1, dt * k);
  const C = CAM;
  C.p.x += (goal.x - C.p.x) * f; C.p.y += (goal.y - C.p.y) * f; C.p.z += (goal.z - C.p.z) * f;
  C.l.x += (goal.lx - C.l.x) * f; C.l.y += (goal.ly - C.l.y) * f; C.l.z += (goal.lz - C.l.z) * f;
  C.fov += (goal.fov - C.fov) * f;
}
function camApply(shake) {

  c.position.set(C.p.x + rr(s * 0.15), C.p.y + rr(s * 0.15), C.p.z + rr(s * 0.15));
  c.lookAt(C.l.x, C.l.y, C.l.z);
  const v = Math.min(118, 2 * Math.atan(Math.tan(C.fov * Math.PI / 360) / c.aspect) * 180 / Math.PI);
  if (Math.abs(c.fov - v) > 0.01) { c.fov = v; c.updateProjectionMatrix(); }
}
function camShot(w) { return { x: w.x, y: w.y, z: w.z, lx: w.lx, ly: w.ly, lz: w.lz, fov: w.fov }; }
function camWide() { return camShot(CFG.camera.wide); }
function camFreeze() { return camShot(CFG.camera.freeze); }
// 弾の斜め後ろから追う。near（0〜1）が大きいほど近く・狭く
function camFollow(pos, dir, near) {
  const f = CFG.camera.follow, n = CFG.camera.near, k = near || 0;
  const back = f.back + (n.back - f.back) * k, up = f.up + (n.up - f.up) * k, side = f.side + (n.side - f.side) * k;
  const sx = dir.z, sz = -dir.x, sl = Math.hypot(sx, sz) || 1;       // 進行方向の右
  return { x: pos.x - dir.x * back + sx / sl * side, y: pos.y - dir.y * back + up, z: pos.z - dir.z * back + sz / sl * side,
    lx: pos.x + dir.x * 1.5, ly: pos.y + dir.y * 1.5, lz: pos.z + dir.z * 1.5, fov: CFG.camera.follow.fov + (n.fov - CFG.camera.follow.fov) * k };
}
// 状況を見る：部屋をゆっくり見回す（u: 0〜1）。机 → 敵 A と主人公 → 敵 B の順に縦へ・横へ
function camIntro(u) {
  const e = u * u * (3 - 2 * u);
  return { x: -0.8 + e * 1.6, y: 3.4 - e * 0.5, z: 4.5, lx: -1.0 + e * 3.0, ly: 1.1, lz: 0.2 - e * 3.6, fov: 58 };
}
// ===== 弾の経路と、分岐点での選択（画面上の向き）。three.js は使わない =====
const BUL = {
  // 時間の割合 tau(0〜1) → 経路の割合 u(0〜1)。経路の後ろのほう（nearFrac から先）は nearSpeed 倍の速さになる（近づいたらさらにスロー）
  u(tau) {
    const B = CFG.bullet, f = B.nearFrac, s = B.nearSpeed, tn = (1 - f) / s, total = f + tn, p = Math.max(0, Math.min(1, tau)) * total;
    return p <= f ? p : f + (p - f) * s;
  },
  // 近いか（寄りのカメラ・風切り音を強める割合 0〜1）
  near(u) { const f = CFG.bullet.nearFrac; return Math.max(0, Math.min(1, (u - f * 0.8) / (1 - f * 0.8))); },
  // 分岐点から対象へ曲がって飛ぶ 2 次ベジェ
  curve(from, to) {
    const dx = to.x - from.x, dy = to.y - from.y, dz = to.z - from.z, l = Math.hypot(dx, dy, dz);
    const sx = dz / (Math.hypot(dx, dz) || 1), sz = -dx / (Math.hypot(dx, dz) || 1);   // 進行方向の横
    const k = CFG.bullet.curve * l;
    return { p0: from, p1: to, c: { x: (from.x + to.x) / 2 + sx * k, y: (from.y + to.y) / 2 + k * 0.5, z: (from.z + to.z) / 2 + sz * k } };
  },
  at(cv, u) {
    const a = (1 - u) * (1 - u), b = 2 * (1 - u) * u, c = u * u;
    return { x: a * cv.p0.x + b * cv.c.x + c * cv.p1.x, y: a * cv.p0.y + b * cv.c.y + c * cv.p1.y, z: a * cv.p0.z + b * cv.c.z + c * cv.p1.z };
  },
};

// 画面上の向き dir（{x,y}。y は下が正）にある、次の対象を選ぶ。items: [{id, x, y}]（画面の座標）
function pickDir(items, curId, dir) {
  const cur = items.find(i => i.id === curId);
  if (!cur) return curId;
  let best = null, bestScore = 1e9;
  for (const it of items) {
    if (it.id === curId) continue;
    const vx = it.x - cur.x, vy = it.y - cur.y, l = Math.hypot(vx, vy);
    if (l < 1) continue;
    const cos = (vx * dir.x + vy * dir.y) / l;
    if (cos < 0.35) continue;                              // 向きがだいぶ違うものは選ばない
    const score = l * (2 - cos);
    if (score < bestScore) { bestScore = score; best = it.id; }
  }
  return best || curId;
}

function initInput(h) {
  addEventListener('touchstart', () => { INPUT.touch = true; document.body.classList.add('touch'); }, { passive: true });
  const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1], KeyA: [-1, 0], KeyD: [1, 0], KeyW: [0, -1], KeyS: [0, 1] };
  addEventListener('keydown', e => {
    if (e.repeat && !dirs[e.code]) return;
    h.any();
    if (dirs[e.code]) { e.preventDefault(); h.dir(dirs[e.code][0], dirs[e.code][1]); }
    else if (e.code === 'Enter' || e.code === 'Space') { e.preventDefault(); h.confirm(); }
    else if (e.code === 'KeyR') h.retry();
  });
  addEventListener('pointerdown', () => h.any());
}
// ===== 画面の文字・印・結果 =====
const HUD = { shownAt: 0 };
const $ = id => document.getElementById(id);

let __popTimer = 0;
function hudPop(text, sec) {
  const el = $('pop'); el.textContent = text; el.classList.add('on');
  clearTimeout(__popTimer); __popTimer = setTimeout(() => el.classList.remove('on'), (sec || 1.0) * 1000);
}
function hudFut(n) { $('futN').textContent = n; }
function hudIntro(on) { $('intro').classList.toggle('on', on); }
function hudTint(on) { $('tint').classList.toggle('on', on); }
function hudFlash(op, ms) {
  const el = $('flash'); el.style.transition = 'none'; el.style.opacity = op;
  requestAnimationFrame(() => { el.style.transition = 'opacity ' + (ms || 300) + 'ms'; el.style.opacity = 0; });
}
function hudHurt() {
  const el = $('hurt'); el.style.transition = 'none'; el.style.opacity = 1;
  requestAnimationFrame(() => { el.style.transition = 'opacity 1200ms'; el.style.opacity = 0; });
}
function hudRetryBtn(on) { $('retryBtn').classList.toggle('off', !on); }

// 分岐点：印を出す。items: [{id,x,y}]（画面の座標）、sel: 選んでいる id
function hudMarkers(items, sel) {
  for (const el of document.querySelectorAll('.mk')) {
    const it = items && items.find(i => i.id === el.dataset.id);
    el.classList.toggle('on', !!it);
    if (!it) continue;
    el.style.left = it.x + 'px'; el.style.top = it.y + 'px';
    el.classList.toggle('sel', it.id === sel);
    const t = it.id === sel ? '狙う' : '変更';
    const sp = el.querySelector('span'); if (sp.textContent !== t) sp.textContent = t;
  }
  $('fireBtn').classList.toggle('on', !!items);
  $('hint').classList.toggle('on', !!items);
}

function hudResult(res, found) {
  $('resTitle').textContent = res.ok ? 'CLEAR' : 'GAME OVER';
  $('resTitle').className = res.ok ? 'ok' : 'ng';
  $('resSub').textContent = res.sub;
  const c = $('chain'); c.innerHTML = '';
  res.lines.forEach((t, i) => {
    if (i) { const b = document.createElement('b'); b.textContent = '→'; c.appendChild(b); }
    const s = document.createElement('span'); s.textContent = t;
    if (i === res.lines.length - 1) s.className = 'last ' + (res.ok ? 'ok' : 'ng');
    c.appendChild(s);
  });
  $('resFut').innerHTML = '見つけた未来　<b>' + found + '</b> / ' + CFG.futures;
  $('result').classList.add('on'); $('stage').classList.add('res');
  HUD.shownAt = performance.now();
}
function hudHideResult() { $('result').classList.remove('on'); $('stage').classList.remove('res'); }
function hudResultOn() { return $('result').classList.contains('on'); }
// ===== 起動とメインループ =====
// 流れ：intro（状況を見る・最初の 1 回だけ）→ fly1（窓から分岐点へ）→ freeze（時間が止まる・対象を選ぶ）→ fly2（曲がって命中へ）
//       → sim（通常の速さで連鎖）→ result。リトライは fly1 の頭（発射直後）から。
(function boot() {
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  const stage = document.getElementById('stage');
  stage.prepend(renderer.domElement);
  const SZ = { w: 1, h: 1 };
  function fit() {                                           // 枠（縦 9:16）の大きさに描画を合わせ、文字の基準 --u（枠の幅の 1/100）を入れる
    SZ.w = stage.clientWidth; SZ.h = stage.clientHeight;
    renderer.setSize(SZ.w, SZ.h);
    document.documentElement.style.setProperty('--u', SZ.w / 100 + 'px');
    if (typeof camera !== 'undefined') { camera.aspect = SZ.w / SZ.h; camera.updateProjectionMatrix(); }
  }

  const scene = new THREE.Scene();
  buildRoom(scene); buildProps(scene); buildPeople(scene); initFx(scene);
  const camera = new THREE.PerspectiveCamera(70, 9 / 16, 0.1, 80);
  fit();
  CAM.cam = camera;

  const G = { phase: 'intro', S: null, sel: 'A', introDone: false, glassBroken: false, found: {}, nFound: 0, t: 0, time: 0, ts: 1, acc: 0,
    curve: null, f1: null, grade: 0, lastRetry: 0, camDir: { x: 0, y: 0, z: -1 }, hero: false };
  window.GAME = G;                                           // 確認用（テストプレイで局面を直接動かす）

  const portrait = matchMedia('(orientation: landscape) and (pointer: coarse)');   // スマホが横向き（縦専用なので止めて案内を出す）
  let touched = false, triedLandscape = false;
  addEventListener('touchstart', () => { touched = true; }, { passive: true });
  function tryLandscape() {                                  // スマホで最初にタップしたとき、全画面＋縦向き固定を試す（できない端末では何もしない）
    if (triedLandscape || !touched) return; triedLandscape = true;
    const el = document.documentElement;
    if (!el.requestFullscreen) return;
    el.requestFullscreen().then(() => { if (screen.orientation && screen.orientation.lock) return screen.orientation.lock('portrait'); }).catch(() => {});
  }

  const B = CFG.bullet, br = STAGE1.branch;
  const tgt = id => STAGE1.targets.find(t => t.id === id);

  // ---------- 局面の切り替え ----------
  function startRound() {                                    // 新しい世界を作って、発射直後からやり直す（0.3 秒もかからない）
    hudHideResult(); hudMarkers(null); hudTint(false); hudIntro(false);
    sndWhooshStop(); fxClear();
    G.S = newSim(STAGE1, Math.random);
    roomReset(); G.acc = 0; G.hero = false;
    startFly1();
  }
  function startIntro() {
    G.phase = 'intro'; G.t = 0; G.S = newSim(STAGE1, Math.random); roomReset(); hudIntro(true); hudRetryBtn(false);
  }
  function endIntro() {
    G.introDone = true; hudIntro(false); startRound();
  }
  function startFly1() {
    const outside = !G.glassBroken;
    G.phase = 'fly1'; G.t = 0;
    G.f1 = { outside, ex: outside ? B.fly1Extra : 0, broke: !outside, startZ: outside ? B.startZ : STAGE1.room.zFront };
    G.ts = outside ? 1 : B.slowScale;
    if (outside) sndShot();
    sndWhooshStart(); sndWhooshSet(0.1);
    hudRetryBtn(true);
    FX.trailPts.length = 0;
    const p = { x: STAGE1.gun.x, y: STAGE1.gun.y, z: G.f1.startZ };
    G.camDir = { x: 0, y: 0, z: -1 };
    const g = camFollow(p, G.camDir, 0); camGo(g, 0, null);
    if (outside) fxMuzzle({ x: p.x, y: p.y, z: p.z + 0.5 });
  }
  function enterFreeze() {
    G.phase = 'freeze'; G.t = 0; G.ts = 0.01;
    sndWhooshStop(); sndFreeze(); hudTint(true);
    G.sel = G.lastTarget || 'A';
  }
  function fire() {
    if (G.phase !== 'freeze') return;
    G.phase = 'fly2'; G.t = 0;
    G.curve = BUL.curve(br, tgt(G.sel).aim);
    G.lastTarget = G.sel;
    hudMarkers(null); hudTint(false); FX.preview.visible = false;
    sndConfirm(); sndWhooshStart();
  }
  function impact() {
    G.phase = 'sim'; G.ts = 1; G.t = 0; G.acc = 0;
    fxBullet(br, G.camDir, false); FX.trailPts.length = 0; fxRings(br, 0, camera.position, false);
    sndWhooshStop(); sndImpact();
    hudFlash(0.55, 350);
    G.S.events.length = 0;
    simShoot(G.S, G.sel);
    if (!G.found[G.sel]) { G.found[G.sel] = true; G.nFound++; }
    hudFut(G.nFound);
    handleEvents();
  }
  function showResult() {
    G.phase = 'result'; hudRetryBtn(false);
    const res = G.S.result;
    hudResult(res, G.nFound);
    sndResult(res.ok);
  }

  // ---------- 連鎖の出来事 → 見た目と音 ----------
  function handleEvents() {
    const S = G.S, list = S.events; S.events = [];
    for (const ev of list) {
      switch (ev.type) {
        case 'impact': fxSparks(ev.point, 18, 0xffd890, 5); FX.shake += 0.3; break;
        case 'chainSnap': sndMetal(); fxSparks(ev.point, 26, 0xffe0a0, 4); break;
        case 'bananaHit': fxSparks(ev.point, 10, 0xfff0a0, 3); break;
        case 'shatter':
          sndShatter();
          if (ev.kind === 'lamp') { fxShards(ev.pos, 0xfff0c0, 26, 3); fxSparks(ev.pos, 14, 0xffd070, 4); ROOM.lampLight.intensity = 0.3; ROOM.lampLight.color.setHex(0xff9a50); FX.shake += 0.35; }
          else { fxShards(ev.pos, 0x2a7a3a, 14, 3); fxShards(ev.pos, 0x7a1020, 10, 2.5); }
          break;
        case 'gunshot':
          sndGun(); fxMuzzle(ev.from); fxTracer(ev.from, ev.to);
          if (ev.hit === 'ceiling' || ev.hit === 'wall' || ev.hit === 'floor') fxSparks(ev.to, 12, 0xffd890, 4);
          FX.shake += 0.25;
          break;
        case 'explode': sndBoom(); fxExplosion(ev.pos); hudFlash(0.85, 600); break;
        case 'thud': sndThud(ev.speed); break;
        case 'slip': sndSlip(); hudPop('ツルッ！', 1.0); break;
        case 'heroHit': hudHurt(); FX.shake += 0.5; break;
        case 'done': showResult(); break;
      }
    }
  }

  // ---------- 入力 ----------
  function markerItems() {                                   // 対象の印の、いまの画面の位置
    camera.updateMatrixWorld();
    return STAGE1.targets.map(t => {
      const v = new THREE.Vector3(t.aim.x, t.aim.y, t.aim.z).project(camera);
      return { id: t.id, x: (v.x + 1) / 2 * SZ.w, y: (1 - v.y) / 2 * SZ.h };
    });
  }
  function doDir(dx, dy) {
    if (G.phase !== 'freeze') return;
    const n = pickDir(markerItems(), G.sel, { x: dx, y: dy });
    if (n !== G.sel) { G.sel = n; sndTick(); }
  }
  function doRetry() {
    if (G.phase === 'intro') return;
    const now = performance.now(); if (now - G.lastRetry < 200) return; G.lastRetry = now;
    startRound();
  }
  initInput({
    any() { sndInit(); tryLandscape(); if (G.phase === 'intro' && !portrait.matches) endIntro(); },
    dir: doDir,
    confirm() { if (G.phase === 'freeze') fire(); else if (G.phase === 'result') doRetry(); },
    retry: doRetry,
  });
  for (const el of document.querySelectorAll('.mk')) {
    el.addEventListener('pointerdown', e => {
      e.preventDefault(); e.stopPropagation(); sndInit();
      if (G.phase !== 'freeze') return;
      if (el.dataset.id === G.sel) fire(); else { G.sel = el.dataset.id; sndTick(); }
    });
  }
  $('fireBtn').addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); fire(); });
  $('retryBtn').addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); doRetry(); });
  $('againBtn').addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); doRetry(); });
  $('result').addEventListener('pointerdown', () => { if (performance.now() - HUD.shownAt > 500) doRetry(); });

  addEventListener('resize', fit);

  // ---------- 色合い（分岐点では冷たい青白い光に） ----------
  const hemiN = new THREE.Color(0x4a5870), hemiF = new THREE.Color(0x7aa4e8), lampN = new THREE.Color(0xffb464), lampF = new THREE.Color(0xa6c4ff);
  function applyGrade(dt) {
    const want = G.phase === 'freeze' ? 1 : G.phase === 'fly2' ? 0.5 : 0;
    G.grade += (want - G.grade) * Math.min(1, dt * 6);
    ROOM.hemi.color.copy(hemiN).lerp(hemiF, G.grade); ROOM.hemi.intensity = 0.4 + G.grade * 0.2 + (G.S.ents.lamp.broken ? 0.28 : 0);
    if (ROOM.lampLight.intensity > 0.5) ROOM.lampLight.color.copy(lampN).lerp(lampF, G.grade);
  }

  // ---------- 毎フレーム ----------
  startIntro();
  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000); last = now;     // 止めている間も last は進める
    if (portrait.matches) { renderer.render(scene, camera); return; }
    G.time += dt;
    const S = G.S;

    if (G.phase === 'intro') {
      G.t += dt; G.ts = 1;
      camGo(camIntro(Math.min(1, G.t / CFG.camera.introSec)), dt, null);
      if (G.t >= CFG.camera.introSec) endIntro();
    } else if (G.phase === 'fly1') {
      G.t += dt;
      const f = G.f1, slow = G.t >= f.ex;
      let z;
      if (!slow) z = f.startZ + (STAGE1.room.zFront - f.startZ) * (G.t / f.ex);
      else z = STAGE1.room.zFront + (br.z - STAGE1.room.zFront) * Math.min(1, (G.t - f.ex) / B.fly1Sec);
      const p = { x: br.x, y: br.y, z };
      if (!f.broke && slow) {                                  // ガラスが割れる
        f.broke = true; G.glassBroken = true; ROOM.glass.visible = false; G.ts = B.slowScale;
        sndGlass(); fxGlassBreak(p.x, p.y, STAGE1.room.zFront, 36); FX.shake += 0.4; hudFlash(0.25, 250);
      }
      fxBullet(p, G.camDir, true); fxTrailPush(p); fxTrailDraw();
      camGo(camFollow(p, G.camDir, 0), dt, null);
      sndWhooshSet(0.15);
      if (G.t >= f.ex + B.fly1Sec) { fxBullet(br, G.camDir, true); enterFreeze(); }
    } else if (G.phase === 'freeze') {
      G.t += dt; G.ts = 0.01;
      camGo(camFreeze(), dt, 3);
      camApply(0); camera.updateMatrixWorld();
      const items = markerItems();
      hudMarkers(items, G.sel);
      fxPreview(BUL.curve(br, tgt(G.sel).aim));
      fxBullet(br, { x: 0, y: 0, z: -1 }, true);
      fxRings(br, G.time, camera.position, true);
      fxTrailDraw();
    } else if (G.phase === 'fly2') {
      G.t += dt;
      const tau = Math.min(1, G.t / B.fly2Sec), u = BUL.u(tau), near = BUL.near(u);
      const p = BUL.at(G.curve, u), q = BUL.at(G.curve, Math.min(1, u + 0.02)), r = BUL.at(G.curve, Math.max(0, u - 0.02));
      const d = u < 0.98 ? { x: q.x - p.x, y: q.y - p.y, z: q.z - p.z } : { x: p.x - r.x, y: p.y - r.y, z: p.z - r.z };
      const dl = Math.hypot(d.x, d.y, d.z) || 1; d.x /= dl; d.y /= dl; d.z /= dl;
      G.camDir.x += (d.x - G.camDir.x) * Math.min(1, dt * 5); G.camDir.y += (d.y - G.camDir.y) * Math.min(1, dt * 5); G.camDir.z += (d.z - G.camDir.z) * Math.min(1, dt * 5);
      G.ts = B.slowScale + (B.nearScale - B.slowScale) * near;
      fxBullet(p, d, true); fxTrailPush(p); fxTrailDraw();
      fxRings(p, G.time, camera.position, near > 0.3);
      camGo(camFollow(p, G.camDir, near), dt, 7);
      sndWhooshSet(0.25 + near * 0.75);
      if (tau >= 1) impact();
    } else {                                                   // sim / result
      if (G.phase === 'sim') {
        G.acc += dt; let n = 0;
        while (G.acc >= CFG.time.step && G.S.state === 'running' && n++ < 10) { simStep(G.S, CFG.time.step); G.acc -= CFG.time.step; if (G.S.events.length) handleEvents(); }
        if (G.S.events.length) handleEvents();
      }
      G.ts = 1;
      camGo(camWide(), dt, 2.2);
    }

    roomSync(G.S, G.time); peopleSync(G.S, G.time);
    applyGrade(dt);
    fxUpdate(dt * G.ts); fxTracerUpdate(dt);
    if (G.phase !== 'freeze') camApply(FX.shake);
    renderer.render(scene, camera);
  }
  G.dbg = { fire, retry: doRetry, endIntro };
  requestAnimationFrame(frame);
})();
</script>
</body>
