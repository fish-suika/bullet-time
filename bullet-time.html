<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>BULLET TIME</title>
<style>
  /* --u は「枠の幅の 1/100」（JS が入れる）。文字や余白をこれで決めるので、スマホ(375)でも PC の枠(540)でも同じ見た目の比になる */
  :root{--u:3.75px;--ink:#f2efe8;--gold:#ffd04a;--ice:#8fc8ff;--red:#e0483c;--jp:"Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Meiryo","Noto Sans JP",sans-serif}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#020305;color:var(--ink);font-family:var(--jp);
    touch-action:none;user-select:none;-webkit-user-select:none}
  button{font-family:var(--jp)}

  /* ---- 縦長 9:16 の枠。PC では高さいっぱいの 9:16 を中央に置き、左右は暗い帯。スマホ(縦)では画面いっぱい ---- */
  #stage{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(100vw,56.25vh);overflow:hidden;background:#05070a;
    box-shadow:0 0 0 1px rgba(255,255,255,.06),0 0 60px rgba(0,0,0,.8)}
  #stage canvas{display:block;width:100%;height:100%}

  /* ---- 上：目的・未来の数 ---- */
  #obj{position:absolute;left:calc(var(--u)*4);top:calc(env(safe-area-inset-top) + var(--u)*3.5);z-index:6;pointer-events:none;text-shadow:0 1px 8px #000}
  #obj b{display:block;font-size:calc(var(--u)*4.2);letter-spacing:.1em}
  #obj small{display:block;margin-top:2px;font-size:calc(var(--u)*3.1);opacity:.75;letter-spacing:.06em}
  #topR{position:absolute;right:calc(var(--u)*4);top:calc(env(safe-area-inset-top) + var(--u)*3.5);z-index:7;pointer-events:none}
  #fut{padding:calc(var(--u)*1.2) calc(var(--u)*3.4);border-radius:calc(var(--u)*5);background:rgba(8,10,14,.6);font-size:calc(var(--u)*3.6);letter-spacing:.1em;white-space:nowrap}
  #fut b{font-size:calc(var(--u)*5);color:var(--gold);font-variant-numeric:tabular-nums}

  /* ---- 下：やり直し・撃つ（親指が届く位置） ---- */
  #bar{position:absolute;left:calc(var(--u)*4);right:calc(var(--u)*4);bottom:calc(env(safe-area-inset-bottom) + var(--u)*4);z-index:9;display:flex;gap:calc(var(--u)*3);pointer-events:none}
  #bar button{pointer-events:auto;touch-action:manipulation;cursor:pointer}
  #retryBtn{flex:none;padding:0 calc(var(--u)*4.5);height:calc(var(--u)*13);border:1px solid rgba(255,255,255,.5);border-radius:calc(var(--u)*7);
    background:rgba(8,10,14,.7);color:var(--ink);font-size:calc(var(--u)*3.6);letter-spacing:.06em}
  #retryBtn.off{display:none}
  #fireBtn{flex:1;display:none;height:calc(var(--u)*13);border:2px solid var(--gold);border-radius:calc(var(--u)*7);background:rgba(60,44,10,.9);color:var(--gold);
    font-size:calc(var(--u)*5.6);font-weight:700;letter-spacing:.4em;text-indent:.4em}
  #fireBtn.on{display:block}
  #hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + var(--u)*21);z-index:6;text-align:center;font-size:calc(var(--u)*3);letter-spacing:.06em;
    opacity:0;pointer-events:none;text-shadow:0 1px 6px #000;transition:opacity .2s}
  #hint.on{opacity:.85}
  body.touch #hint{display:none}

  /* ---- 分岐点：青白い色合いと、印（輪） ---- */
  #tint{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .25s;
    background:radial-gradient(ellipse at center,rgba(90,150,255,0) 45%,rgba(20,50,130,.38) 100%)}
  #tint.on{opacity:1}
  #markers{position:absolute;inset:0;z-index:8;pointer-events:none}
  .mk{position:absolute;display:none;width:calc(var(--u)*17);height:calc(var(--u)*17);margin:calc(var(--u)*-8.5) 0 0 calc(var(--u)*-8.5);cursor:pointer;pointer-events:auto;touch-action:manipulation}
  .mk.on{display:block}
  .mk i{position:absolute;left:calc(var(--u)*2.5);top:calc(var(--u)*2.5);width:calc(var(--u)*12);height:calc(var(--u)*12);border-radius:50%;border:3px solid rgba(255,255,255,.85);
    background:rgba(255,255,255,.08);box-shadow:0 0 12px rgba(0,0,0,.6),inset 0 0 8px rgba(0,0,0,.4);transition:transform .12s}
  .mk span{position:absolute;left:50%;top:calc(var(--u)*15);transform:translateX(-50%);white-space:nowrap;font-size:calc(var(--u)*3.2);font-weight:700;letter-spacing:.12em;
    text-shadow:0 1px 6px #000,0 0 3px #000}
  .mk.sel i{border-color:var(--gold);background:rgba(255,208,74,.16);transform:scale(1.18);animation:pulse .9s ease-in-out infinite}
  .mk.sel span{color:var(--gold);font-size:calc(var(--u)*3.8)}
  @keyframes pulse{0%,100%{box-shadow:0 0 12px rgba(255,208,74,.5),inset 0 0 8px rgba(0,0,0,.4)}50%{box-shadow:0 0 26px rgba(255,208,74,.95),inset 0 0 8px rgba(0,0,0,.4)}}

  /* ---- 状況を見る・お知らせ ---- */
  #intro{position:absolute;left:50%;top:24%;transform:translate(-50%,-50%);z-index:7;text-align:center;opacity:0;pointer-events:none;transition:opacity .3s;text-shadow:0 2px 14px #000;white-space:nowrap}
  #intro.on{opacity:1}
  #intro h2{font-size:calc(var(--u)*9);letter-spacing:.2em}
  #intro p{margin-top:8px;font-size:calc(var(--u)*3.4);letter-spacing:.15em;opacity:.8}
  #pop{position:absolute;left:50%;top:20%;transform:translate(-50%,-50%);z-index:7;font-size:calc(var(--u)*11);font-weight:700;letter-spacing:.1em;
    opacity:0;pointer-events:none;text-shadow:0 2px 16px #000;white-space:nowrap}
  #pop.on{opacity:1}
  #step{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + var(--u)*24);transform:translateX(-50%) translateY(calc(var(--u)*2));z-index:7;width:max-content;max-width:calc(100% - var(--u)*8);text-align:center;padding:calc(var(--u)*1.6) calc(var(--u)*4.4);border-radius:calc(var(--u)*3.4);background:rgba(10,12,16,.86);border:1px solid rgba(255,208,74,.65);box-shadow:0 4px 18px rgba(0,0,0,.6);color:#fff;font-size:calc(var(--u)*5);font-weight:800;letter-spacing:.06em;line-height:1.35;text-wrap:balance;text-shadow:0 1px 3px #000,0 2px 8px #000;opacity:0;pointer-events:none;transition:opacity .35s,transform .35s}
  #step.on{opacity:1;transform:translateX(-50%)}
  #ff{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + var(--u)*19);z-index:6;text-align:center;font-size:calc(var(--u)*2.8);letter-spacing:.12em;opacity:0;pointer-events:none;text-shadow:0 1px 6px #000;transition:opacity .3s}
  #ff.on{opacity:.5}
  #flash{position:absolute;inset:0;z-index:4;background:#fff;opacity:0;pointer-events:none}
  #hurt{position:absolute;inset:0;z-index:4;background:radial-gradient(ellipse at center,rgba(160,0,0,0) 30%,rgba(190,20,10,.7) 100%);opacity:0;pointer-events:none}

  /* ---- 結果：上に判定、下にログとボタン（真ん中は連鎖の絵を見せる） ---- */
  #result{position:absolute;inset:0;z-index:12;display:none;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;
    padding:calc(env(safe-area-inset-top) + var(--u)*16) calc(var(--u)*4) calc(env(safe-area-inset-bottom) + var(--u)*5);
    background:linear-gradient(to bottom,rgba(6,8,12,.7) 0%,rgba(6,8,12,.1) 30%,rgba(6,8,12,.1) 45%,rgba(6,8,12,.82) 70%)}
  #result.on{display:flex}
  #stage.res #obj,#stage.res #topR{opacity:0}
  #result h2{font-size:calc(var(--u)*13);letter-spacing:.1em;line-height:1.1}
  #result h2.ok{color:var(--gold)} #result h2.ng{color:var(--red)}
  #result .sub{margin-top:calc(var(--u)*1.5);font-size:calc(var(--u)*4.4);letter-spacing:.2em;opacity:.9}
  #result .low{width:100%;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*2.4)}
  #chain{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:calc(var(--u)*1.6) calc(var(--u)*1.2);font-size:calc(var(--u)*3.6)}
  #chain span{padding:calc(var(--u)*.8) calc(var(--u)*3);border-radius:calc(var(--u)*4);background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);white-space:nowrap}
  #chain span.last{background:rgba(255,208,74,.2);border-color:var(--gold)}
  #chain span.last.ng{background:rgba(224,72,60,.22);border-color:var(--red)}
  #chain b{line-height:1;font-size:calc(var(--u)*3.4);opacity:.55;font-weight:400}
  #resFut{font-size:calc(var(--u)*4);letter-spacing:.15em}
  #resFut b{color:var(--gold);font-size:1.4em}
  #againBtn{width:100%;height:calc(var(--u)*13);font-size:calc(var(--u)*5);font-weight:700;letter-spacing:.2em;color:#fff;background:#c8402f;border:0;border-radius:calc(var(--u)*7);cursor:pointer;touch-action:manipulation}
  #result small{font-size:calc(var(--u)*2.8);opacity:.6;letter-spacing:.08em}

  /* ---- スマホが横向きのときの案内（縦専用なので、縦にしてもらう） ---- */
  #rotate{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:22px;padding:24px;text-align:center;background:#0b0e14}
  #rotate .phone{width:46px;height:80px;border:4px solid var(--ink);border-radius:9px;position:relative;animation:turn 2.4s ease-in-out infinite}
  #rotate .phone::after{content:"";position:absolute;left:50%;bottom:5px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--ink)}
  @keyframes turn{0%,25%{transform:rotate(-90deg)}55%,85%{transform:rotate(0)}100%{transform:rotate(-90deg)}}
  #rotate p{font-size:20px;letter-spacing:.1em;line-height:1.8}
  #rotate small{display:block;font-size:14px;opacity:.75;letter-spacing:.05em}
  @media (orientation: landscape) and (pointer: coarse){#rotate{display:flex}}
</style>
</head>
<body>
<div id="stage">
  <div id="tint"></div>
  <div id="obj"><b>目的：主人公を助けろ</b><small>3.5 秒後、敵が主人公を撃つ</small></div>
  <div id="topR"><div id="fut">未来 <b id="futN">0</b>/4</div></div>
  <div id="markers">
    <div class="mk" data-id="A"><i></i><span></span></div>
    <div class="mk" data-id="ext"><i></i><span></span></div>
    <div class="mk" data-id="duck"><i></i><span></span></div>
    <div class="mk" data-id="cyl"><i></i><span></span></div>
  </div>
  <div id="hint">← → ↑ ↓ で選ぶ　Enter / Space で撃つ　R でやり直し</div>
  <div id="bar"><button id="retryBtn" class="off">やり直し</button><button id="fireBtn">撃つ</button></div>
  <div id="intro"><h2>状況を見る</h2><p>タップかキーで飛ばす</p></div>
  <div id="pop"></div>
  <div id="step"></div>
  <div id="ff">タップで早送り</div>
  <div id="flash"></div>
  <div id="hurt"></div>
  <div id="result">
    <div><h2 id="resTitle"></h2><div class="sub" id="resSub"></div></div>
    <div class="low">
      <div id="chain"></div>
      <div id="resFut"></div>
      <button id="againBtn">もう一度</button>
      <small>画面をタップでもやり直せます（R キー）</small>
    </div>
  </div>
</div>
<div id="rotate"><div class="phone"></div><p>縦画面にしてください<small>スマホを縦向きにすると遊べます</small></p></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script>
"use strict";
// ===== 調整する数字はここだけ =====
const CFG = {
  // 時間の流れ
  time: {
    step: 1 / 60,            // 物理を進める刻み（秒）
    aFireAt: 3.5,            // 敵 A が主人公を撃つ時刻（命中から。資料どおり 3.5 秒）
    aFireJit: 0.15,          // 撃つ時刻のばらつき
    endAt: 6.0,              // 命中からこの時刻まで主人公が無事なら CLEAR
    hitHold: 1.3,            // 主人公が撃たれてから結果を出すまでの間
    simMax: 9,               // 念のための上限
    chainScale: 0.6,         // 命中後の連鎖を流す速さ（1 でそのまま。論理の時間は変えず、見る速さだけ遅くする）
  },
  // 弾の飛行（slow は演出用の「ゲーム内の時間の遅さ」。弾の進みは下の秒数で決める）
  bullet: {
    slowScale: 0.08,         // 飛行中の周りの時間（ガラス片・ちり）の速さ
    nearScale: 0.03,         // 命中直前の周りの時間
    fly1Sec: 0.95,           // 窓から分岐点まで
    fly1Extra: 0.55,         // 最初の 1 回だけ、窓の外から始まる分の追加秒
    fly2Sec: 1.8,            // 分岐点から命中まで
    nearFrac: 0.65,          // 経路のここから先を「近い」とする
    nearSpeed: 0.35,         // 近い間の速さ（それまでを 1 として）
    curve: 0.28,             // 曲がり方
    startZ: 9.5,             // 最初の 1 回の弾の出発点（窓の外）
  },
  // 敵の共通
  enemy: {
    hearing: 7,              // 音が届く距離（音の大きさ 1 のとき）
    aimErr: 0.015,           // ふだんの狙いのずれ（ラジアン）
    turnRate: 4.5,           // 振り向く速さ（rad/s）。光が主人公へ振れるのが見える速さ
  },
  // ① 敵 A を撃つ：A が倒れながら引き金を引く → 弾がガスボンベに命中 → 大爆発（主人公も吹き飛ぶ）
  //    ルール：ガスボンベが爆発するのは「A の暴発の弾（kind 'discharge'）」が当たったときだけ。プレイヤーの弾（④）は栓を飛ばすだけで爆発しない
  discharge: {
    at: 0.3,                 // 撃たれてから、倒れながら A が引き金を引くまで
    aimErr: 0.02,            // ボンベへの狙いのずれ（ラジアン）
  },
  blast: {
    fuse: 0.3,               // 命中から爆発まで
    radius: 9,               // 吹き飛ぶ範囲
    lethal: 6.2,             // 主人公に届く致死範囲（主人公までの約 5m を含む）
    speed: 11,               // 吹き飛ぶ速さ
    min: 0.4,                // 遠くでも最低これだけの強さ
    up: 0.6, spin: 4,
  },
  // ② 消火器：ロケットのように飛ぶ → 敵 A の顔面に直撃 → A が吹っ飛んで B を巻き込む
  ext: {
    thrust: 70,              // 噴射の力（N）。A の顔のほうへ向ける
    maxSpeed: 8,
    hitDist: 0.6,            // A の顔までこの近さで直撃
    bowlSpeed: 9, bowlUp: 2.2,   // 直撃された A が B のほうへ飛ぶ強さ
    bowlPush: 7,             // 巻き込まれた B の飛ぶ強さ
    bowlWait: 0.9,           // A が B に届かなかったとき、この時間で B を巻き込ませる（そっと押す）
    endAfter: 1.4,           // 敵が全員倒れてから結果までの間
  },
  // ③ アヒル：鳴く → A が B のほうへ振り向く → B が A を照らす → 撃ち合い
  duck: {
    loud: 0.95,
    aTurn: 0.4, bTurn: 0.35, bTurnJit: 0.08,
    fireMin: 0.12, fireMax: 0.3,     // 振り向いてから撃つまで
    aimErr: 0.02,
    push: 3.6, up: 1.2,              // 撃たれて飛ばされる強さ
  },
  // ④ ガスボンベ：爆発しない。ロケットになって跳ね回る → 主人公に直撃
  rocket: {
    thrust: 450,             // 噴射の力（N）。速さの向きに押す
    maxSpeed: 9.5,
    launch: { x: -0.7, y: 0.28, z: 0.65 },   // 最初の向き（跳ね回ってから主人公へ寄る）
    steerFrom: 0.7,          // この時刻から主人公のほうへ寄せ始める
    steerRamp: 0.6,          // 完全に主人公へ向くまで
    restitution: 0.85,       // 壁・天井・床での跳ね返り
    dodgeDist: 3.2,          // 敵がこの近さまで来たら伏せる
    dodgeT: 1.1,
    hitSpeed: 2,             // 主人公に当たる最低の速さ
  },
  // 物理
  phys: { gravity: -9.8, friction: 0.5, restitution: 0.15, iterations: 12 },
  // カメラ
  camera: {
    // fov は横の視野角（縦長の画面でも横に同じだけ入るように。縦は画面の比から求める）
    wide: { x: -1.0, y: 3.7, z: 4.6, lx: 0.5, ly: 0.7, lz: -2.4, fov: 68 },
    freeze: { x: 0, y: 3.6, z: 4.6, lx: 0, ly: 1.0, lz: -1.2, fov: 62 },
    follow: { back: 2.0, up: 0.45, side: 0.6, fov: 56 },
    near: { back: 0.9, up: 0.2, side: 0.3, fov: 30 },
    introSec: 2.5,
  },
  // 連鎖の見せ場：ステップ（ログ）が来るたびに一瞬スローにして、そのステップの物へカメラが寄る
  beat: { slow: 0.3, dur: 0.7, ease: 0.2, cooldown: 0.5, ffScale: 3,
    // 寄るのは 1 つの未来につき 1 回だけ（その未来の山場のステップ）。① は大爆発そのものが山場なので寄らず、引き画で見せる。ほかのステップは、カメラを動かさず光る輪で示す
    key: { ext: 'faceHit', duck: 'bothDown', cyl: 'heroHit' }, pushDur: 2.0, pushIn: 0.5, pushOut: 0.6, pushDist: 3.2, pushFov: 46, hlDur: 0.8, hlFade: 0.25,
    bounceSlow: 0.25, bounceDur: 0.45, bounceCool: 0.2, bounceMax: 6,   // ロケットの跳ね返り 1 回ごとの小さな見せ場（回数に上限）
    capMin0: 1.3, capBase: 0.7, capPer: 0.08,   // 字幕 1 つが最低限出ている実時間 = max(capMin0, capBase + capPer × 文字数)
    backlogScale: 0.25,                          // 字幕が追いついていない間の、見る速さ（さらに掛ける）
    rocketScale: 0.9 },                                                  // ロケットの間は、さらに少しゆっくり（見る速さだけ）
  // ロケットの間のカメラ：手前の壁を消して、部屋の外から全体を見る。ボンベと次にぶつかる所を結んで、ゆっくり追う
  rocketCam: { x: 0, y: 2.7, z: 9.2, cx: 0, cy: 1.4, cz: -0.3, fov: 52, k: 2.0 },
  ui: { hintSec: 2.2 },
  futures: 4,
};
// ===== STAGE 1「単純な未来」の配置（データだけ。three.js は使わない） =====
// 座標：x は右、y は上、z は手前（窓の側）。部屋は x ±4.2、z -4.8〜4.8、高さ 4.2。
// 向き yaw：0 で -z（奥）を向く。yawToward(dx,dz) で向きたい方向から求める
// 撃てる対象は 4 つ：敵 A（普通の答え → 大爆発）／消火器（地味な置物）／ゴムのアヒル（どうでもいい物）／ガスボンベ（いかにも正解 → 爆発しない）
const STAGE1 = {
  title: '単純な未来',
  goal: '主人公を助けろ',
  room: { x: 4.2, zBack: -4.8, zFront: 4.8, h: 4.2 },
  window: { x: 0, y: 1.75, w: 1.5, h: 1.1 },        // 手前の壁の窓（ここを割って弾が入る）
  gun: { x: 0, y: 1.75, z: 9.5 },                    // 窓の外の狙撃銃
  branch: { x: 0, y: 1.75, z: 1.8 },                 // 分岐点（時間が止まる場所）
  // half は箱の半分の大きさ、radius は球。held：手を離されるまで動かない
  ents: {
    hero:  { kind: 'person', pos: [0, 0.7, -4.15],  half: [0.3, 0.7, 0.3],   mass: 60, yaw: Math.PI },
    A:     { kind: 'person', pos: [0, 0.9, -1.3],   half: [0.28, 0.9, 0.22], mass: 75, yaw: 0 },
    B:     { kind: 'person', pos: [2.6, 0.9, -2.4], half: [0.28, 0.9, 0.22], mass: 75, yaw: Math.PI * 0.85 },
    lamp:  { kind: 'lamp',   pos: [0, 3.0, -2.1],   radius: 0.3, mass: 4 },                 // 部屋の明かり（ずっと吊られている）
    ext:   { kind: 'ext',    pos: [1.5, 0.1, -3.5], half: [0.32, 0.1, 0.1], mass: 5, yaw: 0 },   // 床に寝ている消火器（撃たれると A の顔へ飛ぶ）
    drum:  { kind: 'drum',   pos: [0.6, 0.32, 0.0], radius: 0.32, mass: 10 },                 // ドラム缶（飾り）
    shelf: { kind: 'shelf',  pos: [3.4, 0.85, -2.85], half: [0.3, 0.85, 0.5], mass: 40 },     // B の後ろの棚（飾り。動かない）
    duck:  { kind: 'duck',   pos: [-3.3, 1.42, -3.2], radius: 0.09, mass: 0.15, held: true },          // 左奥の棚の上のアヒル
    flash: { kind: 'flash',  pos: [2.3, 1.0, -2.7], half: [0.04, 0.04, 0.12], mass: 0.3, held: true }, // B の懐中電灯（ずっと B の手に付いている）
    cyl:   { kind: 'cyl',    pos: [2.1, 0.65, 0.5], half: [0.17, 0.65, 0.17], mass: 30 },
  },
  chainTop: 4.2,             // 鎖の上端（天井）
  // 撃てる対象。aim は弾が当たる点
  targets: [
    { id: 'A',    name: '敵A',        aim: { x: 0,    y: 1.3,  z: -1.05 } },
    { id: 'ext',  name: '消火器',     aim: { x: 1.5, y: 0.22, z: -3.5 } },
    { id: 'duck', name: 'ゴムのアヒル', aim: { x: -3.3, y: 1.44, z: -3.2 } },

function yawToward(dx, dz) { return Math.atan2(-dx, -dz); }
function yawFwd(yaw) { return { x: -Math.sin(yaw), z: -Math.cos(yaw) }; }
// ===== 物理（cannon.js）。世界の構築・保持・衝突の記録・レイキャスト。three.js は使わない =====
function makeWorldBodies(S) {
  const st = S.stage, P = CFG.phys, w = new CANNON.World();
  w.gravity.set(0, P.gravity, 0);
  w.broadphase = new CANNON.NaiveBroadphase();
  w.solver.iterations = P.iterations;
  w.defaultContactMaterial.friction = P.friction;
  w.defaultContactMaterial.restitution = P.restitution;
  const matRocket = new CANNON.Material('rocket'), matGround = new CANNON.Material('ground');
  w.addContactMaterial(new CANNON.ContactMaterial(matGround, matRocket, { friction: 0, restitution: CFG.rocket.restitution }));
  S.world = w;

  // 床・天井・壁（吹き飛んだものが部屋の外へ出ないように）
  const R = st.room;
  const plane = (px, py, pz, nx, ny, nz, tag) => {
    const b = new CANNON.Body({ mass: 0, material: matGround });
    b.addShape(new CANNON.Plane());
    b.quaternion.setFromVectors(new CANNON.Vec3(0, 0, 1), new CANNON.Vec3(nx, ny, nz));
    b.position.set(px, py, pz); b.tag = tag; w.addBody(b);
  };
  plane(0, 0, 0, 0, 1, 0, 'floor');
  plane(0, R.h, 0, 0, -1, 0, 'ceil');
  plane(R.x, 0, 0, -1, 0, 0, 'wall'); plane(-R.x, 0, 0, 1, 0, 0, 'wall');
  plane(0, 0, R.zBack, 0, 0, 1, 'wall'); plane(0, 0, R.zFront, 0, 0, -1, 'wall');

  S.ents = {};
  for (const id in st.ents) {
    const d = st.ents[id];
    const e = { id, def: d, body: null, held: false, hold: { x: d.pos[0], y: d.pos[1], z: d.pos[2] }, yaw: d.yaw || 0, pv: new CANNON.Vec3(), broken: false };
    const b = new CANNON.Body({ mass: d.mass, material: id === 'cyl' ? matRocket : null });
    b.addShape(d.radius ? new CANNON.Sphere(d.radius) : new CANNON.Box(new CANNON.Vec3(d.half[0], d.half[1], d.half[2])));
    b.position.set(d.pos[0], d.pos[1], d.pos[2]);
    b.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), e.yaw);
    b.tag = id;
    if (d.kind === 'person' || d.kind === 'lamp' || d.kind === 'shelf' || d.held) e.held = true;   // 立っている人・吊られたもの・棚は、手を離されるまで動かない
    if (d.kind === 'person') { b.linearDamping = 0.05; b.angularDamping = 0.15; }
    if (id === 'drum') { b.linearDamping = 0.25; b.angularDamping = 0.1; }
    if (id === 'ext') { b.linearDamping = 0.05; b.angularDamping = 0.5; }
    b.addEventListener('collide', ev => { S.collisions.push({ ent: e, other: ev.body.tag, speed: Math.hypot(e.pv.x, e.pv.y, e.pv.z), ov: ev.body.velocity }); });
    e.body = b; w.addBody(b);
    S.ents[id] = e;
  }
}

function holdEnts(S) {
  const Y = new CANNON.Vec3(0, 1, 0);
  for (const id in S.ents) {
    const e = S.ents[id];
    if (!e.held || !e.body) continue;
    const b = e.body;
    b.position.set(e.hold.x, e.hold.y, e.hold.z);
    b.velocity.set(0, 0, 0); b.angularVelocity.set(0, 0, 0);
    b.quaternion.setFromAxisAngle(Y, e.yaw);
  }
}

function physStep(S, dt) {
  holdEnts(S);
  for (const id in S.ents) { const e = S.ents[id]; if (e.body) { const v = e.body.velocity; e.pv.set(v.x, v.y, v.z); } }
  S.world.step(dt);
}

function releaseEnt(e) { e.held = false; if (e.body) e.body.wakeUp(); }

// ===== レイキャスト（敵の射撃）。箱・球と、部屋の壁・天井・床 =====
function rayEnt(from, dir, e) {
  const b = e.body, d = e.def;
  if (d.radius) {                                           // 球
    const ox = from.x - b.position.x, oy = from.y - b.position.y, oz = from.z - b.position.z;
    const bq = ox * dir.x + oy * dir.y + oz * dir.z, c = ox * ox + oy * oy + oz * oz - d.radius * d.radius;
    const disc = bq * bq - c; if (disc < 0) return null;
    const t = -bq - Math.sqrt(disc); return t > 0 ? t : null;
  }
  const qi = b.quaternion.inverse();                        // 箱：回転を戻して軸に沿った箱として調べる
  const p = qi.vmult(new CANNON.Vec3(from.x - b.position.x, from.y - b.position.y, from.z - b.position.z));
  const v = qi.vmult(new CANNON.Vec3(dir.x, dir.y, dir.z));
  let t0 = 0, t1 = 1e9;
  const pp = [p.x, p.y, p.z], vv = [v.x, v.y, v.z], hh = d.half;
  for (let i = 0; i < 3; i++) {
    if (Math.abs(vv[i]) < 1e-9) { if (Math.abs(pp[i]) > hh[i]) return null; continue; }
    let a = (-hh[i] - pp[i]) / vv[i], c = (hh[i] - pp[i]) / vv[i];
    if (a > c) { const t = a; a = c; c = t; }
    t0 = Math.max(t0, a); t1 = Math.min(t1, c);
    if (t0 > t1) return null;
  }
  return t0 > 0 ? t0 : null;
}

// from から dir（単位ベクトル）へ撃つ。最初に当たったものを返す
function castRay(S, from, dir, exclude) {
  let best = { t: 1e9, ent: null, surface: null };
  for (const id of ['hero', 'A', 'B', 'shelf', 'cyl', 'lamp', 'drum', 'ext']) {
    if (id === exclude) continue;
    const e = S.ents[id]; if (!e || e.broken) continue;
    const t = rayEnt(from, dir, e);
    if (t !== null && t < best.t) best = { t, ent: e, surface: null };
  }
  const R = S.stage.room;
  const planes = [[dir.x > 0 ? R.x : -R.x, 'x', 'wall'], [dir.z > 0 ? R.zFront : R.zBack, 'z', 'wall'],
                  [dir.y > 0 ? R.h : 0, 'y', dir.y > 0 ? 'ceiling' : 'floor']];
  for (const [val, ax, name] of planes) {
    if (Math.abs(dir[ax]) < 1e-9) continue;
    const t = (val - from[ax]) / dir[ax];
    if (t > 0 && t < best.t) best = { t, ent: null, surface: name };
  }
  best.point = { x: from.x + dir.x * best.t, y: from.y + dir.y * best.t, z: from.z + dir.z * best.t };
  return best;
}
// ===== 連鎖のルール。物理の衝突・音・時刻 → 物や敵の動き → 結果。three.js は使わない =====
// 結果は台本ではなく、剛体の衝突・敵の弾（レイキャスト）・単純な状態機械で決まる。展開は少なく、山場を 1 つ。
//  ① 敵 A      ：A が倒れながら引き金を引く → 弾がガスボンベに命中 → 大爆発（主人公も吹き飛ぶ）… GAME OVER
//  ② 消火器    ：ロケットのように飛ぶ → A の顔面に直撃 → A が吹っ飛んで B を巻き込む … CLEAR
//  ③ アヒル    ：ピーッと鳴く → A と B が驚いて撃ち合う → 2 人とも倒れる … CLEAR
//  ④ ガスボンベ：爆発せず、ロケットになって跳ね回る → 主人公に直撃 … GAME OVER
// 爆発のルール：ガスボンベが爆発するのは A の暴発の弾（kind 'discharge'）が当たったときだけ。プレイヤーの弾は栓を飛ばすだけ（④）。
function newSim(stage, rng) {
  const S = { stage, rng: rng || Math.random, t: 0, state: 'ready', events: [], log: [], logKeys: {}, collisions: [],
    world: null, ents: null, target: null, result: null, doneAt: null, exploded: false, bothDownAt: null, knocks: [],
    flags: { extOn: false, rocketOn: false },                    // 見た目（粒・ループ音）用
    ext: { on: false, t0: 0, faceHit: false, bowled: false, bowlHit: false, bowlAt: 0, dirx: 0, dirz: 0 },
    discharge: { at: null, fired: false }, ignite: { at: null },
    rocket: { startAt: null, on: false },
    hero: { alive: true, killedBy: null, hitText: null } };
  makeWorldBodies(S);
  S.A = newEnemyA(S);
  S.B = newEnemyB(S);
  return S;
}

function rnd(S, a, b) { return a + (b - a) * S.rng(); }
// ステップごとにカメラ・輪が見る物（ログのキー → 物の名前）
const STEP_FOCUS = { aDown: 'A', cylHit: 'cyl', explode: 'cyl', ext: 'ext', faceHit: 'A', bowl: 'B', duck: 'duck', shootout: 'A', bothDown: 'B', rocket: 'cyl', heroHit: 'hero' };
function pushLog(S, key, text) {
  if (S.logKeys[key]) return; S.logKeys[key] = 1; S.log.push({ key, text, t: S.t });
  if (key !== 'target' && key !== 'end') S.events.push({ type: 'step', key, text, focus: STEP_FOCUS[key] || null });   // 画面の字幕・見せ場の合図（本物の出来事から出る）
}
function emit(S, ev) { S.events.push(ev); }
function posOf(e) { const p = e.body.position; return { x: p.x, y: p.y, z: p.z }; }
function dist3(a, b) { return Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z); }
function distXZ(a, b) { return Math.hypot(a.x - b.x, a.z - b.z); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
const UP = () => new CANNON.Vec3(0, 1, 0);

// 命中：ここから連鎖が始まる（t = 0）
function simShoot(S, id) {
  const tg = S.stage.targets.find(x => x.id === id);
  S.state = 'running'; S.target = id; S.t = 0;
  pushLog(S, 'target', tg.name);
  emit(S, { type: 'impact', target: id, point: tg.aim });
  const E = S.ents, br = S.stage.branch;
  if (id === 'A') {                                          // ① 倒れながら引き金を引く
    const a = E.A; releaseEnt(a);
    const d = { x: tg.aim.x - br.x, z: tg.aim.z - br.z }, l = Math.hypot(d.x, d.z);
    a.body.velocity.set(d.x / l * 6.5, 1.5, d.z / l * 6.5);
    a.body.angularVelocity.set(-3.2, 0, 0);
    S.A.state = 'down';
    pushLog(S, 'aDown', '敵Aが倒れながら引き金を引く');
    S.discharge.at = S.t + CFG.discharge.at;
  } else if (id === 'ext') {                                  // ② 消火器がロケットのように飛ぶ
    S.ext.on = true; S.ext.t0 = S.t; S.flags.extOn = true;
    E.ext.body.velocity.set(0, 2.5, 0); E.ext.body.wakeUp();
    pushLog(S, 'ext', '消火器がロケットのように飛ぶ');
    emit(S, { type: 'extStart', point: tg.aim });
  } else if (id === 'duck') {                                 // ③ アヒルが鳴く
    const d = E.duck; releaseEnt(d);
    d.body.velocity.set(rnd(S, 0.4, 0.8), 1.2, rnd(S, 0.6, 1.0));
    pushLog(S, 'duck', 'アヒルが「ピーッ」と鳴く');
    emit(S, { type: 'squeak', pos: posOf(d) });
    emitNoise(S, 'squeak', posOf(d), CFG.duck.loud);
  } else if (id === 'cyl') {                                  // ④ 栓が飛ぶ（爆発はしない）→ ロケット
    S.rocket.startAt = S.t + 0.35;
    emit(S, { type: 'capPop', pos: posOf(E.cyl) });
  }
}

// 音。聞こえた敵が反応する。誰かが反応したら true
function emitNoise(S, kind, pos, loud) {
  emit(S, { type: 'noise', kind, pos, loud });
  const a = enemyAHear(S, kind, pos, loud), b = enemyBHear(S, kind, pos, loud);
  return a || b;
}

function simStep(S, dt) {
  if (S.state !== 'running') return;
  S.t += dt;
  syncFlashHold(S);
  extUpdate(S); dischargeUpdate(S); igniteUpdate(S); rocketUpdate(S);
  enemyAUpdate(S, dt);
  enemyBUpdate(S, dt);
  for (const k of S.knocks) knockPerson(S, k.e, k.dir);
  S.knocks.length = 0;
  physStep(S, dt);
  processCollisions(S);
  checkEnd(S);
}

function syncFlashHold(S) {                                   // 懐中電灯は B の手に付いていて、B について動く
  const f = S.ents.flash, b = S.ents.B.body, o = b.quaternion.vmult(new CANNON.Vec3(-0.3, 0.12, -0.35));
  f.hold.x = b.position.x + o.x; f.hold.y = b.position.y + o.y; f.hold.z = b.position.z + o.z;
  f.yaw = S.ents.B.yaw;
}

// ---- ① 暴発 → 命中 → 爆発 ----
function dischargeUpdate(S) {
  const D = S.discharge;
  if (D.at === null || D.fired || S.t < D.at) return;
  D.fired = true;
  const a = S.ents.A, m = muzzleOf(a), c = posOf(S.ents.cyl), e = CFG.discharge.aimErr;
  let r = fireGun(S, 'A', m, aimDir(m, c, rnd(S, -e, e), rnd(S, -e, e)), 'discharge');
  if (!(r.ent && r.ent.id === 'cyl')) fireGun(S, 'A', m, aimDir(m, c, 0, 0), 'discharge');          // ずれたときは、そっと補正してボンベに当てる
}
function igniteUpdate(S) {
  if (S.ignite.at === null || S.exploded || S.t < S.ignite.at) return;
  explode(S, posOf(S.ents.cyl));
}
function explode(S, pos) {
  const B = CFG.blast; S.exploded = true;
  emit(S, { type: 'explode', pos });
  pushLog(S, 'explode', '大爆発で全員吹き飛ぶ');
  S.ents.cyl.broken = true; S.world.remove(S.ents.cyl.body);
  for (const id of ['A', 'B', 'hero']) {
    const e = S.ents[id], p = posOf(e), d = dist3(p, pos);
    if (d > B.radius) continue;
    const k = Math.max(B.min, 1 - d / B.radius);
    const hx = p.x - pos.x, hz = p.z - pos.z, hl = Math.hypot(hx, hz) || 1;
    if (e.held) releaseEnt(e);
    e.body.velocity.set(hx / hl * B.speed * k, B.speed * B.up * k + 2, hz / hl * B.speed * k);
    e.body.angularVelocity.set(rnd(S, -B.spin, B.spin), rnd(S, -1, 1), rnd(S, -B.spin, B.spin));
    if (id === 'A') S.A.state = 'down';
    if (id === 'B') S.B.state = 'down';
    if (id === 'hero' && d < B.lethal && S.hero.alive) {
      S.hero.alive = false; S.hero.killedBy = 'blast'; S.hero.hitText = '主人公も吹き飛んだ';
      emit(S, { type: 'heroHit', point: p, who: 'blast' });
    }
  }
}

// ---- ② 消火器：A の顔へ → 直撃 → A が B を巻き込む ----
function extUpdate(S) {
  const x = S.ext, E = CFG.ext, e = S.ents.ext, a = S.ents.A;
  if (x.on) {
    const ap = posOf(a), head = { x: ap.x, y: ap.y + 0.65, z: ap.z - 0.1 }, p = e.body.position;
    const dx = head.x - p.x, dy = head.y - p.y, dz = head.z - p.z, l = Math.hypot(dx, dy, dz) || 1, b = e.body;
    b.force.x += dx / l * E.thrust; b.force.y += dy / l * E.thrust + b.mass * 9.8 * 0.95; b.force.z += dz / l * E.thrust;   // A の顔のほうへ噴射（ほぼ無重力）
    const v = b.velocity, sp = Math.hypot(v.x, v.y, v.z);
    if (sp > E.maxSpeed) { v.x *= E.maxSpeed / sp; v.y *= E.maxSpeed / sp; v.z *= E.maxSpeed / sp; }
    if (sp > 0.5) b.quaternion.setFromVectors(new CANNON.Vec3(1, 0, 0), new CANNON.Vec3(v.x / sp, v.y / sp, v.z / sp));    // 機首（+x）は進む向き
    b.angularVelocity.set(0, 0, 0);
    if (l < E.hitDist || S.t - x.t0 > 3) faceHit(S);
  }
  if (x.faceHit && !x.bowled && S.B.state !== 'down' && (x.bowlHit || S.t - x.bowlAt > E.bowlWait)) bowlB(S);
}
function faceHit(S) {
  const x = S.ext, E = CFG.ext, a = S.ents.A, b = posOf(S.ents.B), ap = posOf(a);
  if (x.faceHit) return;
  x.faceHit = true; x.on = false; S.flags.extOn = false; x.bowlAt = S.t;
  pushLog(S, 'faceHit', '敵Aの顔面に直撃');
  const dx = b.x - ap.x, dz = b.z - ap.z, l = Math.hypot(dx, dz) || 1;
  x.dirx = dx / l; x.dirz = dz / l;
  releaseEnt(a); S.A.state = 'down';
  a.body.velocity.set(x.dirx * E.bowlSpeed, E.bowlUp, x.dirz * E.bowlSpeed);        // 顔面に当たった A は、B のほうへ吹っ飛ぶ
  a.body.angularVelocity.set(-x.dirz * 5, rnd(S, -2, 2), x.dirx * 5);
  emit(S, { type: 'faceHit', pos: posOf(S.ents.ext) });
}
function bowlB(S) {
  const x = S.ext, E = CFG.ext, e = S.ents.B;
  x.bowled = true;
  releaseEnt(e); S.B.state = 'down';
  e.body.velocity.set(x.dirx * E.bowlPush, 2, x.dirz * E.bowlPush);
  e.body.angularVelocity.set(-x.dirz * 4, rnd(S, -2, 2), x.dirx * 4);
  pushLog(S, 'bowl', 'Aが吹っ飛んでBを巻き込む');
  emit(S, { type: 'thud', pos: posOf(e), speed: 8 });
}

// ---- ④ ロケット ----
function rocketUpdate(S) {
  const R = S.rocket, C = CFG.rocket, e = S.ents.cyl;
  if (R.startAt === null) return;
  if (!R.on) {
    if (S.t < R.startAt) return;
    R.on = true; R.t0 = S.t; S.flags.rocketOn = true;
    const l = Math.hypot(C.launch.x, C.launch.y, C.launch.z);
    e.body.velocity.set(C.launch.x / l * 3, C.launch.y / l * 3, C.launch.z / l * 3);
    pushLog(S, 'rocket', '爆発せず、ロケットになって跳ね回る');
    emit(S, { type: 'rocketStart', pos: posOf(e) });
  }
  const b = e.body, v = b.velocity, sp = Math.hypot(v.x, v.y, v.z), t = S.t - R.t0;
  let dx = sp > 0.5 ? v.x / sp : C.launch.x, dy = sp > 0.5 ? v.y / sp : C.launch.y, dz = sp > 0.5 ? v.z / sp : C.launch.z;
  const h = posOf(S.ents.hero), p = posOf(e); h.y += 0.3;     // 狙いは主人公の胸の高さ（椅子ではなく体）
  const hl = dist3(h, p) || 1, w = clamp((t - C.steerFrom) / C.steerRamp, 0, 1);
  dx = dx * (1 - w) + (h.x - p.x) / hl * w; dy = dy * (1 - w) + (h.y - p.y) / hl * w; dz = dz * (1 - w) + (h.z - p.z) / hl * w;
  const l = Math.hypot(dx, dy, dz) || 1;

  h.body.angularVelocity.set((dirv.z || 0) * 0.5, 0, -(dirv.x || 0) * 0.5);

  const list = S.collisions; S.collisions = [];

    const e = c.ent;

    else if (e.id === 'cyl' && c.other === 'hero' && c.speed > CFG.rocket.hitSpeed && S.rocket.on) killHero(S, 'cyl', '主人公に直撃', e.body.velocity);

// 銃を撃つ。レイキャストで当たったものが決まる
function fireGun(S, who, from, dir, kind) {
  const r = castRay(S, from, dir, who);
  emit(S, { type: 'gunshot', who, kind, from, to: r.point, hit: r.ent ? r.ent.id : r.surface });
  if (r.ent && r.ent.id === 'hero') {
    killHero(S, who, '弾が主人公に命中', dir);
  } else if (r.ent && r.ent.id === 'cyl') {
    if (who === 'A' && kind === 'discharge' && S.ignite.at === null && !S.exploded) {                  // A の暴発の弾だけがボンベに火をつける
      pushLog(S, 'cylHit', '弾がガスボンベに命中');
      S.ignite.at = S.t + CFG.blast.fuse;
    }
  } else if (r.ent && (r.ent.id === 'A' || r.ent.id === 'B')) {
    if (kind === 'duel') S.knocks.push({ e: r.ent, dir });      // 撃ち合いは同時：両方撃ってから倒す

  releaseEnt(e); X.state = 'down';
  e.body.velocity.set(dir.x * CFG.duck.push, CFG.duck.up, dir.z * CFG.duck.push);
  e.body.angularVelocity.set(dir.z * 3, 0, -dir.x * 3);
  emit(S, { type: 'thud', pos: posOf(e), speed: 6 });
}

function checkEnd(S) {
  const bothDown = S.A.state === 'down' && S.B.state === 'down';
  if (bothDown && S.bothDownAt === null) {
    S.bothDownAt = S.t;
    if (S.target === 'duck') pushLog(S, 'bothDown', '2人とも倒れる');                                       // ③ 2 人とも倒れた
  }
  if (S.doneAt === null) {
    if (!S.hero.alive) { S.doneAt = S.t + CFG.time.hitHold; finishSim(S, false); }
    else if (S.t >= CFG.time.endAt || (bothDown && S.target !== 'cyl' && S.t - S.bothDownAt >= CFG.ext.endAfter)) { S.doneAt = S.t + 0.3; finishSim(S, true); }   // 撃つ敵がいなくなったら、少しおいて結果へ
  }
  if (S.doneAt !== null && S.t >= S.doneAt && S.state === 'running') { S.state = 'done'; emit(S, { type: 'done', result: S.result }); }
  if (S.t > CFG.time.simMax && S.state === 'running') { S.state = 'done'; if (!S.result) finishSim(S, S.hero.alive); }
}

function finishSim(S, ok) {
  const id = S.target;
  if (ok) pushLog(S, 'end', '主人公 生存');
  else if (!S.hero.hitText) pushLog(S, 'end', '主人公 被弾');
  let sub;
  if (id === 'A') sub = ok ? '偶然の成功' : '主人公も吹き飛んだ';
  else if (id === 'ext') sub = ok ? '地味な物が一番強い' : '消火器は役に立たなかった';
  else if (id === 'duck') sub = ok ? '敵が勝手に全滅' : 'アヒルは鳴いただけ';
  else if (id === 'cyl') sub = ok ? '偶然よけた' : 'いちばん派手な方法で失敗';
  else sub = ok ? '偶然の成功' : '未来は変わらなかった';

    g.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random() * 3, 1 + Math.random() * 3);
  }
}
function mkBox(parent, w, h, d, mat, x, y, z, cast) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.castShadow = cast !== false; m.receiveShadow = true;
  parent.add(m); return m;
}
const stdMat = (color, rough, metal, extra) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: rough === undefined ? 0.85 : rough, metalness: metal || 0 }, extra || {}));

function buildRoom(scene) {
  const R = STAGE1.room, W = STAGE1.window, H = R.h, zl = R.zBack, zf = R.zFront, Wd = R.x * 2, D = zf - zl;
  scene.background = new THREE.Color(0x05070a);
  scene.fog = new THREE.Fog(0x05070a, 9, 24);

  // 材質（キャンバスで作った模様）
  const concrete = canvasTex(256, 256, (g, w, h) => {
    noiseFill(g, w, h, '#4a4c4e', 70, 2600);
    g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 2;
    g.strokeRect(1, 1, w - 2, h - 2);
  }, R.x * 2 / 2.2, D / 2.2);
  const wallTex = canvasTex(256, 256, (g, w, h) => {
    noiseFill(g, w, h, '#3c3a38', 50, 1800);
    g.fillStyle = 'rgba(0,0,0,.35)';
    for (let y = 0; y < h; y += 32) { g.fillRect(0, y, w, 2); for (let x = (y / 32 % 2) * 32; x < w; x += 64) g.fillRect(x, y, 2, 32); }
  }, 6, 2);
  const woodTex = canvasTex(128, 128, (g, w, h) => {
    noiseFill(g, w, h, '#6b4a2a', 40, 600);
    g.fillStyle = 'rgba(0,0,0,.3)'; for (let y = 0; y < h; y += 16) g.fillRect(0, y, w, 1.5);
  }, 1, 1);
  const floorM = stdMat(0xffffff, 0.9, 0, { map: concrete }); ROOM.floorM = floorM;
  const wallM = stdMat(0xffffff, 0.95, 0, { map: wallTex });
  const darkM = stdMat(0x1a1b1d, 0.9);
  const woodM = stdMat(0xffffff, 0.8, 0, { map: woodTex });
  const metalM = stdMat(0x25282b, 0.5, 0.7);

  // 光：窓からの月明かり（青白い光の筋）、吊りランプ（暖かい光）、うっすらした環境光
  ROOM.hemi = new THREE.HemisphereLight(0x4a5870, 0x1a1410, 0.3);
  scene.add(ROOM.hemi);
  const moon = new THREE.DirectionalLight(0x7f9ad0, 0.75);
  moon.position.set(0, 5.5, 13); moon.target.position.set(0, 0, -2);
  moon.castShadow = true; moon.shadow.mapSize.set(1024, 1024);
  Object.assign(moon.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 30 });
  moon.shadow.bias = -0.001;
  scene.add(moon, moon.target); ROOM.moon = moon;
  const lamp = new THREE.PointLight(0xffb464, 1.7, 15, 1.6);
  lamp.position.set(...STAGE1.ents.lamp.pos);
  lamp.castShadow = true; lamp.shadow.mapSize.set(1024, 1024); lamp.shadow.bias = -0.003; lamp.shadow.radius = 3;
  scene.add(lamp); ROOM.lampLight = lamp;

  // 床・天井・壁
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(Wd, D), floorM);
  floor.rotation.x = -Math.PI / 2; floor.position.set(0, 0, (zf + zl) / 2); floor.receiveShadow = true; scene.add(floor);
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(Wd, D), darkM);
  ceil.rotation.x = Math.PI / 2; ceil.position.set(0, H, (zf + zl) / 2); scene.add(ceil);
  mkBox(scene, Wd, 3, 0.3, wallM, 0, 1.5, zl - 0.15);                          // 奥
  mkBox(scene, Wd, H - 3, 0.3, wallM, 0, 3 + (H - 3) / 2, zl - 0.15);
  mkBox(scene, 0.3, H, D, wallM, R.x + 0.15, H / 2, (zf + zl) / 2);            // 左右
  mkBox(scene, 0.3, H, D, wallM, -R.x - 0.15, H / 2, (zf + zl) / 2);
  // 手前の壁（窓の穴つき）
  const wy0 = W.y - W.h / 2, wy1 = W.y + W.h / 2, wx0 = W.x - W.w / 2, wx1 = W.x + W.w / 2;
  mkBox(scene, Wd, wy0, 0.3, wallM, 0, wy0 / 2, zf + 0.15);
  mkBox(scene, Wd, H - wy1, 0.3, wallM, 0, wy1 + (H - wy1) / 2, zf + 0.15);
  mkBox(scene, wx0 + R.x, W.h, 0.3, wallM, (-R.x + wx0) / 2, W.y, zf + 0.15);
  mkBox(scene, R.x - wx1, W.h, 0.3, wallM, (R.x + wx1) / 2, W.y, zf + 0.15);
  // 窓枠・ガラス
  mkBox(scene, 0.06, W.h + 0.1, 0.1, metalM, W.x, W.y, zf);
  mkBox(scene, W.w + 0.1, 0.06, 0.1, metalM, W.x, W.y, zf);
  mkBox(scene, W.w + 0.1, 0.07, 0.12, metalM, W.x, wy0, zf);
  mkBox(scene, W.w + 0.1, 0.07, 0.12, metalM, W.x, wy1, zf);
  const glass = new THREE.Mesh(new THREE.BoxGeometry(W.w, W.h, 0.02),
    new THREE.MeshStandardMaterial({ color: 0x9fb8d8, roughness: 0.1, metalness: 0.1, transparent: true, opacity: 0.28 }));
  glass.position.set(W.x, W.y, zf); scene.add(glass); ROOM.glass = glass;
  // 梁・柱・配管（暗い倉庫らしさ）
  for (let z = -4; z <= 2; z += 2) mkBox(scene, Wd, 0.25, 0.18, darkM, 0, H - 0.12, z);
  for (const sx of [-1, 1]) {
    mkBox(scene, 0.35, H, 0.35, wallM, sx * (R.x - 0.3), H / 2, -4.3);
    mkBox(scene, 0.35, H, 0.35, wallM, sx * (R.x - 0.3), H / 2, 1.5);
    const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, D, 8), metalM);
    pipe.rotation.x = Math.PI / 2; pipe.position.set(sx * (R.x - 0.1), 3.5, (zf + zl) / 2); scene.add(pipe);
  }
  // 棚と木箱（奥・左）
  mkBox(scene, 0.12, 2.4, 0.5, metalM, -3.9, 1.2, -3.2); mkBox(scene, 0.12, 2.4, 0.5, metalM, -2.6, 1.2, -3.2);
  for (const y of [0.6, 1.3, 2.0]) mkBox(scene, 1.4, 0.06, 0.55, metalM, -3.25, y, -3.2);
  mkBox(scene, 0.5, 0.4, 0.4, woodM, -3.5, 0.83, -3.2); mkBox(scene, 0.4, 0.3, 0.4, woodM, -2.9, 1.53, -3.2);
  mkBox(scene, 0.6, 0.6, 0.6, woodM, -3.5, 0.3, -1.6); mkBox(scene, 0.55, 0.5, 0.55, woodM, -2.8, 0.25, -1.5);
  for (const [x, z] of [[-3.6, 3.6], [-2.9, 3.9], [3.6, 2.8]]) {
    const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.9, 14), stdMat(0x2c3a4a, 0.5, 0.5));
    bar.position.set(x, 0.45, z); bar.castShadow = bar.receiveShadow = true; scene.add(bar);
  }

  // ほこり（ゆっくり漂う光の粒）
  const dg = new THREE.SphereGeometry(0.012, 4, 3), dm = new THREE.MeshBasicMaterial({ color: 0xffe0b0, transparent: true, opacity: 0.55 });
  for (let i = 0; i < 70; i++) {
    const m = new THREE.Mesh(dg, dm);
    m.position.set((Math.random() - 0.5) * 9, Math.random() * 3.6, -4 + Math.random() * 8);
    m.userData = { ph: Math.random() * 6.3, sp: 0.1 + Math.random() * 0.2 };
    scene.add(m); ROOM.dust.push(m);
  }
}

// 動く小物・棚・ドラム缶など（STAGE1.ents ごとに見た目を作る。位置は剛体から毎フレーム反映）
function buildProps(scene) {
  const RZ = STAGE1.room.zFront;
  ROOM.front = scene.children.filter(m => m.isMesh && m.position.z > RZ - 0.06 && m.position.z < RZ + 0.4);   // 手前の壁（窓つき）。ロケットの間だけ消して、外から中を見せる
  const E = STAGE1.ents;
  const darkM = stdMat(0x1a1b1d, 0.9), metalG = stdMat(0x6b7078, 0.5, 0.6);
  const V = ROOM.views;
  const wrap = (id, build) => { const g = new THREE.Group(); build(g); scene.add(g); V[id] = { obj: g }; return g; };
  const cyl = (g, r0, r1, h, mat, x, y, z, cast) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(r0, r1, h, 16), mat); m.position.set(x, y, z); m.castShadow = cast !== false; g.add(m); return m; };

  wrap('ext', g => {                                       // 床に寝ている消火器（軸は x。ノズルは +x 側）
    const red = stdMat(0xc02a20, 0.35, 0.3), c = cyl(g, 0.085, 0.085, 0.48, red, -0.02, 0, 0); c.rotation.z = Math.PI / 2;
    const top = cyl(g, 0.05, 0.085, 0.07, red, -0.28, 0, 0); top.rotation.z = -Math.PI / 2;
    const band = cyl(g, 0.088, 0.088, 0.1, stdMat(0xeae4d0, 0.6), -0.05, 0, 0); band.rotation.z = Math.PI / 2;
    const valve = mkBox(g, 0.07, 0.04, 0.05, darkM, -0.2, 0.1, 0);
    const hose = cyl(g, 0.012, 0.012, 0.18, darkM, -0.3, -0.04, 0); hose.rotation.z = Math.PI / 2 + 0.5;
    ROOM.extNozzle = new THREE.Object3D(); ROOM.extNozzle.position.set(-0.4, -0.08, 0); g.add(ROOM.extNozzle);
  });
  wrap('drum', g => {                                      // 青いドラム缶（物理は球。転がるとごろごろ回る）
    const blue = stdMat(0x2a5a9a, 0.45, 0.4);
    cyl(g, 0.3, 0.3, 0.56, blue, 0, 0, 0);
    for (const y of [-0.17, 0.17]) cyl(g, 0.312, 0.312, 0.035, stdMat(0x1f4472, 0.5, 0.5), 0, y, 0);
    cyl(g, 0.27, 0.27, 0.02, stdMat(0x1b3f6a, 0.5, 0.4), 0, 0.29, 0);
  });
  wrap('shelf', g => {                                     // B の後ろの金属の棚（4 段・一番上にペンキ缶）
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) mkBox(g, 0.05, 1.7, 0.05, metalG, sx * 0.27, 0, sz * 0.47);
    for (const y of [-0.82, -0.25, 0.32, 0.85]) mkBox(g, 0.6, 0.04, 1.0, metalG, 0, y, 0);
    mkBox(g, 0.4, 0.3, 0.4, stdMat(0x7a5530, 0.8), 0, -0.64, -0.1);
    mkBox(g, 0.35, 0.22, 0.5, stdMat(0x5a5f66, 0.6, 0.3), 0, -0.1, 0.1);
    mkBox(g, 0.3, 0.2, 0.3, stdMat(0x8a6a3a, 0.8), 0, 0.45, -0.15);
  });
  wrap('duck', g => {                                      // ゴムのアヒル（前は -Z）
    const y = stdMat(0xffd830, 0.5), o = stdMat(0xff8a1a, 0.5);
    const b = new THREE.Mesh(new THREE.SphereGeometry(0.09, 14, 10), y); b.scale.set(1, 0.85, 1.25); b.castShadow = true; g.add(b);
    const h = new THREE.Mesh(new THREE.SphereGeometry(0.055, 12, 10), y); h.position.set(0, 0.095, -0.07); g.add(h);
    mkBox(g, 0.05, 0.016, 0.045, o, 0, 0.09, -0.125, false);
    for (const sx of [-1, 1]) { const e = new THREE.Mesh(new THREE.SphereGeometry(0.008, 6, 6), new THREE.MeshBasicMaterial({ color: 0x111111 })); e.position.set(sx * 0.03, 0.11, -0.105); g.add(e); }
    const tail = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 6), y); tail.position.set(0, 0.04, 0.1); g.add(tail);
  });
  wrap('cyl', g => {                                       // ガスボンベ（赤）。ロケットになると軸 +y が機首
    const r = 0.17, hh = E.cyl.half[1], m = stdMat(0xe63424, 0.4, 0.3, { emissive: 0x7a1208, emissiveIntensity: 0.9 });   // 明るい赤＋うっすら自ら光る（暗い壁の前でも見える）
    cyl(g, r, r, hh * 2 - 0.2, m, 0, 0, 0);
    const dome = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2), m); dome.position.y = hh - 0.1; dome.castShadow = true; g.add(dome);
    cyl(g, 0.04, 0.04, 0.14, stdMat(0xb8a040, 0.4, 0.8), 0, hh + 0.05, 0, false);
    cyl(g, r + 0.004, r + 0.004, 0.1, stdMat(0xe8e0d0, 0.6), 0, -0.3, 0, false);
    ROOM.cylTail = new THREE.Object3D(); ROOM.cylTail.position.set(0, -hh, 0); g.add(ROOM.cylTail);
  });
  wrap('lamp', g => {
    const shade = new THREE.Mesh(new THREE.ConeGeometry(0.34, 0.3, 20, 1, true), new THREE.MeshStandardMaterial({ color: 0x2d4a36, roughness: 0.5, metalness: 0.4, side: THREE.DoubleSide }));
    shade.position.y = 0.12; shade.castShadow = false; g.add(shade);
    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 10), new THREE.MeshBasicMaterial({ color: 0xffe4a8 })); bulb.position.y = -0.04; g.add(bulb);
    cyl(g, 0.04, 0.04, 0.12, stdMat(0x25282b, 0.5, 0.7), 0, 0.32, 0);
    ROOM.lampShade = shade;
  });
  // 鎖（天井からランプまで）
  const chain = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 1, 6), stdMat(0x333333, 0.4, 0.8));
  scene.add(chain); ROOM.chain = chain;
}

// 場面をはじめの状態に戻す（リトライのとき）
function roomReset() {
  for (const id in ROOM.views) ROOM.views[id].obj.visible = true;
  ROOM.lampLight.intensity = 1.7; ROOM.lampLight.color.setHex(0xffb464);
}
// 剛体の位置・向きを見た目に反映
function roomSync(S, time) {
  for (const id in ROOM.views) {
    const e = S.ents[id], v = ROOM.views[id];
    if (!e) continue;
    if (e.broken) { v.obj.visible = false; continue; }
    const p = e.body.position, q = e.body.quaternion;
    v.obj.position.set(p.x, p.y, p.z); v.obj.quaternion.set(q.x, q.y, q.z, q.w);
  }
  const lamp = S.ents.lamp, top = STAGE1.chainTop;
  const y = lamp.body.position.y + 0.3, len = top - y;
  ROOM.chain.scale.y = len; ROOM.chain.position.set(lamp.body.position.x, y + len / 2, lamp.body.position.z);
  ROOM.lampLight.position.set(lamp.body.position.x, lamp.body.position.y - 0.05, lamp.body.position.z);
  // ほこり
  for (const m of ROOM.dust) {
    const u = m.userData;
    m.position.y += Math.sin(time * u.sp + u.ph) * 0.0006; m.position.x += Math.cos(time * u.sp * 0.7 + u.ph) * 0.0006;
  }
}
// ===== 人型（箱の組み合わせ）。立っている間は位置を追い、倒れる・吹き飛ぶときは剛体の動きにそのまま乗る =====
const PEOPLE = {};

function makePerson(scene, id, look) {
  const d = STAGE1.ents[id], hy = d.half[1];
  const outer = new THREE.Group(), g = new THREE.Group();     // outer：剛体の中心に合わせる／g：足元が原点
  g.position.y = -hy; outer.add(g); scene.add(outer);
  const skin = stdMat(0xd6a984, 0.7), cloth = stdMat(look.cloth, 0.8), pants = stdMat(look.pants, 0.85), dark = stdMat(0x111214, 0.5, 0.4);
  const P = { outer, g, id, limbs: {}, seated: id === 'hero' };
  const limb = (x, y, w, h, d2, mat, pivotY) => {            // 上端を軸に回せる四肢
    const piv = new THREE.Group(); piv.position.set(x, y, 0); g.add(piv);
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d2), mat); m.position.y = -h / 2; m.castShadow = true; m.receiveShadow = true; piv.add(m);
    return piv;
  };
  if (!P.seated) {
    P.limbs.legL = limb(-0.1, 0.84, 0.16, 0.84, 0.18, pants);
    P.limbs.legR = limb(0.1, 0.84, 0.16, 0.84, 0.18, pants);
  } else {
    // 椅子にすわる：ももは前へ、すねは下へ。椅子と縄
    const wood = stdMat(0x4a3320, 0.8);
    mkBox(g, 0.5, 0.06, 0.5, wood, 0, 0.45, 0.02);
    mkBox(g, 0.5, 0.55, 0.05, wood, 0, 0.75, 0.27);
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) mkBox(g, 0.05, 0.45, 0.05, wood, sx * 0.21, 0.22, sz * 0.21 + 0.02);
    for (const sx of [-1, 1]) {
      mkBox(g, 0.16, 0.16, 0.45, pants, sx * 0.1, 0.56, -0.2);
      mkBox(g, 0.15, 0.45, 0.15, pants, sx * 0.1, 0.3, -0.42);
    }
    P.rope = mkBox(g, 0.54, 0.06, 0.34, stdMat(0xb89a64, 0.9), 0, 1.0, 0);
  }
  const torsoY = P.seated ? 0.88 : 1.16;
  const torso = mkBox(g, 0.5, 0.62, 0.28, cloth, 0, torsoY, 0); P.torso = torso;
  P.head = new THREE.Group(); P.head.position.set(0, torsoY + 0.42, 0); g.add(P.head);
  const masked = !!look.mask, face = { x: 0, y: 0, z: -0.121 };      // 顔は体の前（-Z）。ここに目がある
  const hm = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.27, 0.24), masked ? stdMat(0x17181b, 0.9) : skin); hm.castShadow = true; P.head.add(hm);
  if (!masked) { const hair = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.1, 0.26), stdMat(look.hair, 0.9)); hair.position.set(0, 0.11, 0.01); P.head.add(hair); }
  const eyeM = new THREE.MeshBasicMaterial({ color: masked ? 0xfff2cc : 0x16120e });
  if (masked) {                                            // 目出し帽：前だけに肌色の細い窓と、明るい目
    const slit = new THREE.Mesh(new THREE.BoxGeometry(0.19, 0.055, 0.006), skin); slit.position.set(0, 0.03, face.z); P.head.add(slit);
  }
  for (const sx of [-1, 1]) { const e = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.032, 0.006), eyeM); e.position.set(sx * 0.052, 0.03, face.z - 0.004); P.head.add(e); }
  if (look.vest) {                                         // 体の前：明るいベストとベルトのバックル（背中は無地）
    mkBox(g, 0.36, 0.44, 0.02, stdMat(look.vest, 0.7), 0, torsoY + 0.03, -0.145, false);
    mkBox(g, 0.5, 0.06, 0.3, dark, 0, torsoY - 0.3, 0, false);
    mkBox(g, 0.075, 0.055, 0.02, stdMat(0xc8a84a, 0.3, 0.8), 0, torsoY - 0.3, -0.155, false);
  }
  if (P.seated) {
    const gag = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.05, 0.26), stdMat(0xd8d0c0, 0.9)); gag.position.y = -0.06; P.head.add(gag);
  } else {
    P.limbs.armL = limb(-0.31, torsoY + 0.27, 0.11, 0.6, 0.11, cloth);
    P.limbs.armR = limb(0.31, torsoY + 0.27, 0.11, 0.6, 0.11, cloth);
    const gun = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.2, 0.08), dark); gun.position.set(0, -0.68, -0.02); gun.castShadow = true; P.limbs.armR.add(gun);
    const hand = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.1), skin); hand.position.y = -0.62; P.limbs.armR.add(hand);
  }
  if (look.flash) {                                        // 左手の懐中電灯の筒とレンズ（光そのものは buildPeople の「リグ」。手を離れると宙を舞う）
    const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.03, 0.2, 10), stdMat(0x2a2c30, 0.4, 0.7)); tube.position.set(0, -0.7, 0); P.limbs.armL.add(tube);
    const lens = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.02, 10), new THREE.MeshBasicMaterial({ color: 0xfff6dc })); lens.position.set(0, -0.81, 0); P.limbs.armL.add(lens);
    P.flashProps = [tube, lens];
  }
  PEOPLE[id] = P;
  return P;
}

function buildPeople(scene) {
  makePerson(scene, 'hero', { cloth: 0xc8c4b8, pants: 0x3a4a63, hair: 0x2a1c12 });
  makePerson(scene, 'A', { cloth: 0x1b1d24, pants: 0x15161a, hair: 0x101010, mask: true, vest: 0x8f939b });
  makePerson(scene, 'B', { cloth: 0x4a5a3a, pants: 0x2a2a25, hair: 0x4a3a20, mask: true, vest: 0xc4bc9c, flash: true });
  // 懐中電灯の光（スポットライト + うっすら見える光の筋）。flash の剛体の位置と向きにそのまま付ける（B の手 → 宙を舞って A の顔へ）
  const rig = new THREE.Group(), L = 6.5, R = 1.25;

function peopleSync(S, time) {
  const fe = S.ents.flash, rg = PEOPLE.rig;
  rg.g.position.set(fe.body.position.x, fe.body.position.y, fe.body.position.z); rg.g.quaternion.set(fe.body.quaternion.x, fe.body.quaternion.y, fe.body.quaternion.z, fe.body.quaternion.w);
  for (const id of ['hero', 'A', 'B']) {
    const P = PEOPLE[id], e = S.ents[id], p = e.body.position, q = e.body.quaternion;
    P.outer.position.set(p.x, p.y, p.z); P.outer.quaternion.set(q.x, q.y, q.z, q.w);
    let crouch = 1, headTilt = 0;
    if (id === 'hero') {
      P.head.rotation.x = S.hero.alive ? Math.sin(time * 1.3) * 0.05 : 0.6;
      continue;
    }
    const en = id === 'A' ? S.A : S.B, held = e.held;
    const L = P.limbs, st = en.state;
    let la = 0, ra = 0, legs = 0;
    const flail = () => { la = 2.4 * Math.sin(time * 7 + (id === 'A' ? 0 : 2)); ra = 2.2 * Math.cos(time * 6) + 1.5; legs = 1.0; };
    if (id === 'A') {
      if (st === 'aim' || st === 'fired' || st === 'turn' || st === 'standoff') { la = ra = Math.PI / 2; }
      else if (st === 'dodge') { crouch = 0.55; la = ra = 2.4; }

    } else {

      else if (st === 'lit' || st === 'standoff' || st === 'fired') { la = ra = Math.PI / 2; }
      else if (st === 'dodge') { crouch = 0.55; la = ra = 2.4; }
      else flail();

    setArms(P, la, ra);

}

function fxSpawn(o) {
  const p = FX.free.pop(); if (!p) return null;
  const m = p.m;
  m.visible = true; m.position.set(o.x, o.y, o.z);
  m.material.color.setHex(o.color === undefined ? 0xffffff : o.color);
  m.material.blending = o.add ? THREE.AdditiveBlending : THREE.NormalBlending;
  m.material.depthWrite = !o.add;
  m.rotation.set(Math.random() * 6, Math.random() * 6, Math.random() * 6);
  p.life = p.max = o.life; p.grav = o.grav || 0; p.s0 = o.s0; p.s1 = o.s1 === undefined ? o.s0 : o.s1; p.o0 = o.op === undefined ? 1 : o.op;
  p.vel.set(o.vx || 0, o.vy || 0, o.vz || 0);
  p.spin.set((Math.random() - 0.5) * (o.spin || 0), (Math.random() - 0.5) * (o.spin || 0), (Math.random() - 0.5) * (o.spin || 0));
  p.flat = !!o.flat;
  m.scale.setScalar(p.s0);

}

function fxUpdate(dt) {
  for (const p of FX.parts) {
    if (p.life <= 0) continue;
    p.life -= dt;
    const m = p.m;
    if (p.life <= 0) { m.visible = false; FX.free.push(p); continue; }
    p.vel.y += p.grav * dt;
    m.position.addScaledVector(p.vel, dt);
    m.rotation.x += p.spin.x * dt; m.rotation.y += p.spin.y * dt; m.rotation.z += p.spin.z * dt;
    const k = 1 - p.life / p.max, s = p.s0 + (p.s1 - p.s0) * k;
    if (p.flat) m.scale.set(s, s * 0.15, s * 0.6); else m.scale.setScalar(s);
    m.material.opacity = p.o0 * (1 - k * k);
    if (m.position.y < 0.02 && p.grav < 0) { m.position.y = 0.02; p.vel.set(p.vel.x * 0.4, 0, p.vel.z * 0.4); p.spin.multiplyScalar(0.2); }
  }
  FX.shake = Math.max(0, FX.shake - dt * 2.2);
  FX.flashLight.intensity = Math.max(0, FX.flashLight.intensity - dt * 28);
}

function fxClear() {

  FX.shake = 0; FX.flashLight.intensity = 0; if (FX.shock) FX.shock.visible = false;
  for (const m of FX.rings) m.visible = false;

  FX.tracers.length = 0;

}

// fov は「横の視野角」で持つ。縦の視野角は画面の縦横比から求める（縦長でも横に同じだけ入る）
const CAM = { cam: null, p: { x: 0, y: 2, z: 5 }, l: { x: 0, y: 1.5, z: 0 }, fov: 60 };

// goal: {x,y,z,lx,ly,lz,fov}。k: 追いつく速さ（1 秒あたり）。k が null なら即座に
function camGo(goal, dt, k) {
  const f = k === null ? 1 : Math.min(1, dt * k);
  const C = CAM;
  C.p.x += (goal.x - C.p.x) * f; C.p.y += (goal.y - C.p.y) * f; C.p.z += (goal.z - C.p.z) * f;
  C.l.x += (goal.lx - C.l.x) * f; C.l.y += (goal.ly - C.l.y) * f; C.l.z += (goal.lz - C.l.z) * f;
  C.fov += (goal.fov - C.fov) * f;
}
function camApply(shake) {
  const C = CAM, c = C.cam, s = shake || 0;
  c.position.set(C.p.x + rr(s * 0.15), C.p.y + rr(s * 0.15), C.p.z + rr(s * 0.15));
  c.lookAt(C.l.x, C.l.y, C.l.z);
  const v = Math.min(118, 2 * Math.atan(Math.tan(C.fov * Math.PI / 360) / c.aspect) * 180 / Math.PI);
  if (Math.abs(c.fov - v) > 0.01) { c.fov = v; c.updateProjectionMatrix(); }
}
function camShot(w) { return { x: w.x, y: w.y, z: w.z, lx: w.lx, ly: w.ly, lz: w.lz, fov: w.fov }; }
function camWide() { return camShot(CFG.camera.wide); }
function camFreeze() { return camShot(CFG.camera.freeze); }
// 弾の斜め後ろから追う。near（0〜1）が大きいほど近く・狭く
function camFollow(pos, dir, near) {
  const f = CFG.camera.follow, n = CFG.camera.near, k = near || 0;
  const back = f.back + (n.back - f.back) * k, up = f.up + (n.up - f.up) * k, side = f.side + (n.side - f.side) * k;
  const sx = dir.z, sz = -dir.x, sl = Math.hypot(sx, sz) || 1;       // 進行方向の右
  return { x: pos.x - dir.x * back + sx / sl * side, y: pos.y - dir.y * back + up, z: pos.z - dir.z * back + sz / sl * side,
    lx: pos.x + dir.x * 1.5, ly: pos.y + dir.y * 1.5, lz: pos.z + dir.z * 1.5, fov: CFG.camera.follow.fov + (n.fov - CFG.camera.follow.fov) * k };
}
// 状況を見る：部屋をゆっくり見回す（u: 0〜1）。机 → 敵 A と主人公 → 敵 B の順に縦へ・横へ
function camIntro(u) {
  const e = u * u * (3 - 2 * u);
  return { x: -0.8 + e * 1.6, y: 3.4 - e * 0.5, z: 4.5, lx: -1.0 + e * 3.0, ly: 1.1, lz: 0.2 - e * 3.6, fov: 58 };
}
// ===== 弾の経路と、分岐点での選択（画面上の向き）。three.js は使わない =====
const BUL = {
  // 時間の割合 tau(0〜1) → 経路の割合 u(0〜1)。経路の後ろのほう（nearFrac から先）は nearSpeed 倍の速さになる（近づいたらさらにスロー）
  u(tau) {
    const B = CFG.bullet, f = B.nearFrac, s = B.nearSpeed, tn = (1 - f) / s, total = f + tn, p = Math.max(0, Math.min(1, tau)) * total;
    return p <= f ? p : f + (p - f) * s;
  },
  // 近いか（寄りのカメラ・風切り音を強める割合 0〜1）
  near(u) { const f = CFG.bullet.nearFrac; return Math.max(0, Math.min(1, (u - f * 0.8) / (1 - f * 0.8))); },
  // 分岐点から対象へ曲がって飛ぶ 2 次ベジェ
  curve(from, to) {
    const dx = to.x - from.x, dy = to.y - from.y, dz = to.z - from.z, l = Math.hypot(dx, dy, dz);
    const sx = dz / (Math.hypot(dx, dz) || 1), sz = -dx / (Math.hypot(dx, dz) || 1);   // 進行方向の横
    const k = CFG.bullet.curve * l;
    return { p0: from, p1: to, c: { x: (from.x + to.x) / 2 + sx * k, y: (from.y + to.y) / 2 + k * 0.5, z: (from.z + to.z) / 2 + sz * k } };
  },
  at(cv, u) {
    const a = (1 - u) * (1 - u), b = 2 * (1 - u) * u, c = u * u;
    return { x: a * cv.p0.x + b * cv.c.x + c * cv.p1.x, y: a * cv.p0.y + b * cv.c.y + c * cv.p1.y, z: a * cv.p0.z + b * cv.c.z + c * cv.p1.z };
  },
};

// 画面上の向き dir（{x,y}。y は下が正）にある、次の対象を選ぶ。items: [{id, x, y}]（画面の座標）
function pickDir(items, curId, dir) {
  const cur = items.find(i => i.id === curId);
  if (!cur) return curId;
  let best = null, bestScore = 1e9;
  for (const it of items) {
    if (it.id === curId) continue;
    const vx = it.x - cur.x, vy = it.y - cur.y, l = Math.hypot(vx, vy);
    if (l < 1) continue;
    const cos = (vx * dir.x + vy * dir.y) / l;
    if (cos < 0.35) continue;                              // 向きがだいぶ違うものは選ばない
    const score = l * (2 - cos);
    if (score < bestScore) { bestScore = score; best = it.id; }
  }
  return best || curId;
}
// ===== 入力：キー（← → ↑ ↓ で選ぶ・Enter / Space で撃つ・R でやり直し）とタップ =====
const INPUT = { touch: false };
function initInput(h) {
  addEventListener('touchstart', () => { INPUT.touch = true; document.body.classList.add('touch'); }, { passive: true });
  const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1], KeyA: [-1, 0], KeyD: [1, 0], KeyW: [0, -1], KeyS: [0, 1] };
  addEventListener('keydown', e => {
    if (e.repeat && !dirs[e.code]) return;
    h.any();
    if (dirs[e.code]) { e.preventDefault(); h.dir(dirs[e.code][0], dirs[e.code][1]); }
    else if (e.code === 'Enter' || e.code === 'Space') { e.preventDefault(); h.confirm(); }

    G.grade += (want - G.grade) * Math.min(1, dt * 6);
    ROOM.hemi.color.copy(hemiN).lerp(hemiF, G.grade); ROOM.hemi.intensity = 0.4 + G.grade * 0.2 + (G.S.ents.lamp.broken ? 0.28 : 0);
    if (ROOM.lampLight.intensity > 0.5) ROOM.lampLight.color.copy(lampN).lerp(lampF, G.grade);
  }

  // ---------- 毎フレーム ----------
  startIntro();
  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000); last = now;     // 止めている間も last は進める
    let wallOff = false;
    if (portrait.matches) { renderer.render(scene, camera); return; }
    G.time += dt;
    const S = G.S;

    if (G.phase === 'intro') {
      G.t += dt; G.ts = 1;
      camGo(camIntro(Math.min(1, G.t / CFG.camera.introSec)), dt, null);
      if (G.t >= CFG.camera.introSec) endIntro();
    } else if (G.phase === 'fly1') {
      G.t += dt;
      const f = G.f1, slow = G.t >= f.ex;
      let z;
      if (!slow) z = f.startZ + (STAGE1.room.zFront - f.startZ) * (G.t / f.ex);
      else z = STAGE1.room.zFront + (br.z - STAGE1.room.zFront) * Math.min(1, (G.t - f.ex) / B.fly1Sec);
      const p = { x: br.x, y: br.y, z };
      if (!f.broke && slow) {                                  // ガラスが割れる
        f.broke = true; G.glassBroken = true; ROOM.glass.visible = false; G.ts = B.slowScale;
        sndGlass(); fxGlassBreak(p.x, p.y, STAGE1.room.zFront, 36); FX.shake += 0.4; hudFlash(0.25, 250);
      }
      fxBullet(p, G.camDir, true); fxTrailPush(p); fxTrailDraw();
      camGo(camFollow(p, G.camDir, 0), dt, null);
      sndWhooshSet(0.15);
      if (G.t >= f.ex + B.fly1Sec) { fxBullet(br, G.camDir, true); enterFreeze(); }
    } else if (G.phase === 'freeze') {
      G.t += dt; G.ts = 0.01;
      camGo(camFreeze(), dt, 3);
      camApply(0); camera.updateMatrixWorld();
      const items = markerItems();
      hudMarkers(items, G.sel);
      fxPreview(BUL.curve(br, tgt(G.sel).aim));
      fxBullet(br, { x: 0, y: 0, z: -1 }, true);
      fxRings(br, G.time, camera.position, true);
      fxTrailDraw();
    } else if (G.phase === 'fly2') {
      G.t += dt;
      const tau = Math.min(1, G.t / B.fly2Sec), u = BUL.u(tau), near = BUL.near(u);
      const p = BUL.at(G.curve, u), q = BUL.at(G.curve, Math.min(1, u + 0.02)), r = BUL.at(G.curve, Math.max(0, u - 0.02));
      const d = u < 0.98 ? { x: q.x - p.x, y: q.y - p.y, z: q.z - p.z } : { x: p.x - r.x, y: p.y - r.y, z: p.z - r.z };
      const dl = Math.hypot(d.x, d.y, d.z) || 1; d.x /= dl; d.y /= dl; d.z /= dl;
      G.camDir.x += (d.x - G.camDir.x) * Math.min(1, dt * 5); G.camDir.y += (d.y - G.camDir.y) * Math.min(1, dt * 5); G.camDir.z += (d.z - G.camDir.z) * Math.min(1, dt * 5);
      G.ts = B.slowScale + (B.nearScale - B.slowScale) * near;
      fxBullet(p, d, true); fxTrailPush(p); fxTrailDraw();
      fxRings(p, G.time, camera.position, near > 0.3);
      camGo(camFollow(p, G.camDir, near), dt, 7);
      sndWhooshSet(0.25 + near * 0.75);
      if (tau >= 1) impact();
    } else {                                                   // sim / result
      const K = CFG.beat;
      let scale = 1;
      if (G.phase === 'sim') {
        // 連鎖はゆっくり流す（chainScale）。ステップごとに「見せ場」で一瞬さらに遅く。タップで 3 倍速の早送り
        let beat = 1;
        if (G.beat) {
          const age = G.time - G.beat.t0, bd = G.beat.dur, bs = G.beat.slow, ez = Math.min(K.ease, bd / 3);
          if (age >= bd) G.beat = null;
          else beat = age < ez ? 1 + (bs - 1) * (age / ez) : age > bd - ez ? bs + (1 - bs) * ((age - (bd - ez)) / ez) : bs;
        }
        const ct = G.fast ? { backlog: false, ready: true } : capTick();
        scale = G.fast ? K.ffScale : CFG.time.chainScale * beat * (G.S.flags.rocketOn && G.S.hero.alive ? K.rocketScale : 1) * (ct.backlog ? K.backlogScale : 1);
        if (G.pendingResult && (G.fast || (!G.capQ.length && ct.ready))) { showResult(); return; }
        G.acc += dt * scale; let n = 0;
        while (G.acc >= CFG.time.step && G.S.state === 'running' && n++ < 12) { simStep(G.S, CFG.time.step); G.acc -= CFG.time.step; if (G.S.events.length) handleEvents(); }
        if (G.S.events.length) handleEvents();
      }
      G.ts = scale; $('ff').classList.toggle('on', G.phase === 'sim' && !G.fast && G.time - G.simT0 < 4);
      const F = G.S.flags;                       // 消火器の噴射・ロケットの噴射（毎フレームの粒と、1 つだけのループ音）
      if (F.extOn && ROOM.extNozzle) { ROOM.views.ext.obj.updateMatrixWorld(true); ROOM.extNozzle.getWorldPosition(__nz); const ev2 = G.S.ents.ext.body.velocity, es = Math.hypot(ev2.x, ev2.y, ev2.z) || 1; fxSpray(__nz, { x: -ev2.x / es, y: -ev2.y / es, z: -ev2.z / es }); sndSprayStart(); } else sndLoopStop('spray');
      if (F.rocketOn && ROOM.cylTail) { ROOM.views.cyl.obj.updateMatrixWorld(true); ROOM.cylTail.getWorldPosition(__nz); const cv = G.S.ents.cyl.body.velocity, cs = Math.hypot(cv.x, cv.y, cv.z) || 1; fxJet(__nz, { x: -cv.x / cs, y: -cv.y / cs, z: -cv.z / cs }); sndJetStart(); }
      if (G.phase === 'result') sndLoopStop('jet');
      // カメラの方針：連鎖の間は「安定した引き画」のまま。ステップごとには動かさない（見る場所は光る輪で示す）。
      // 寄るのは 1 つの未来につき 1 回だけ（CFG.beat.key のステップ）。寄ったらもとの引き画へゆっくり戻る。
      // ロケットの間（④）は、手前の壁を消して外から部屋全体を見る。ボンベを追う目線の動きはごく小さく。
      let base = camWide(G.S.target);
      if (G.S.target === 'cyl' && F.rocketOn) {
        const RC = CFG.rocketCam, cp = posOf(G.S.ents.cyl);
        base = { x: RC.x, y: RC.y, z: RC.z, lx: RC.cx * 0.7 + cp.x * 0.3, ly: RC.cy * 0.7 + cp.y * 0.3, lz: RC.cz * 0.7 + cp.z * 0.3, fov: RC.fov };
        if (G.S.hero.alive) { fxTrailPush(cp); fxTrailDraw(); }      // ボンベのうしろの短い軌跡
      }
      let goal = base, kk = G.S.target === 'cyl' && F.rocketOn ? CFG.rocketCam.k : 2.2;
      if (G.push && G.phase === 'sim' && !G.fast) {
        const age = G.time - G.push.t0;
        if (age >= K.pushDur) G.push = null;
        else {
          const sm = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
          const wgt = sm(age / K.pushIn) * (1 - sm((age - (K.pushDur - K.pushOut)) / K.pushOut));
          const p = posOf(G.S.ents[G.push.focus]), w = camWide(G.S.target);
          let dx = w.x - p.x, dz = w.z - p.z; const dl = Math.hypot(dx, dz) || 1; dx /= dl; dz /= dl;
          const t = { x: clamp(p.x + dx * K.pushDist, -3.8, 3.8), y: clamp(p.y + 1.3, 1.9, 3.6), z: Math.min(4.5, p.z + dz * K.pushDist), lx: p.x, ly: Math.max(0.6, p.y), lz: p.z, fov: K.pushFov };
          goal = {}; for (const k in base) goal[k] = base[k] + (t[k] - base[k]) * wgt;
          kk = 6;
        }
      }
      camGo(goal, dt, kk);
      wallOff = G.S.target === 'cyl' && CAM.p.z > 4.5;              // 外から見ている間は手前の壁を消す
      hlUpdate();
    }

    for (const m of ROOM.front) m.visible = !wallOff;
    if (G.phase === 'result' && FX.trailPts.length) { FX.trailPts.length = 0; fxTrailDraw(); }
    roomSync(G.S, G.time); peopleSync(G.S, G.time);
    applyGrade(dt);
    fxUpdate(dt * G.ts); fxTracerUpdate(dt); fxShockUpdate(dt * G.ts);
    if (G.phase !== 'freeze') camApply(FX.shake);
    renderer.render(scene, camera);
  }
  G.dbg = { fire, retry: doRetry, endIntro, intro: startIntro };
  requestAnimationFrame(frame);
})();
</script>
</body>
