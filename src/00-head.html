<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>BULLET TIME</title>
<style>
  /* --u は「枠の幅の 1/100」（JS が入れる）。文字や余白をこれで決めるので、スマホ(375)でも PC の枠(540)でも同じ見た目の比になる */
  :root{--u:3.75px;--ink:#f2efe8;--gold:#ffd04a;--ice:#8fc8ff;--red:#e0483c;--jp:"Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Meiryo","Noto Sans JP",sans-serif}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#020305;color:var(--ink);font-family:var(--jp);
    touch-action:none;user-select:none;-webkit-user-select:none}
  button{font-family:var(--jp)}

  /* ---- 縦長 9:16 の枠。PC では高さいっぱいの 9:16 を中央に置き、左右は暗い帯。スマホ(縦)では画面いっぱい ---- */
  #stage{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(100vw,56.25vh);overflow:hidden;background:#05070a;
    box-shadow:0 0 0 1px rgba(255,255,255,.06),0 0 60px rgba(0,0,0,.8)}
  #stage canvas{display:block;width:100%;height:100%}

  /* ---- 上：目的・未来の数 ---- */
  #obj{position:absolute;left:calc(var(--u)*4);top:calc(env(safe-area-inset-top) + var(--u)*3.5);z-index:6;pointer-events:none;text-shadow:0 1px 8px #000}
  #obj b{display:block;font-size:calc(var(--u)*4.2);letter-spacing:.1em}
  #obj small{display:block;margin-top:2px;font-size:calc(var(--u)*3.1);opacity:.75;letter-spacing:.06em}
  #topR{position:absolute;right:calc(var(--u)*4);top:calc(env(safe-area-inset-top) + var(--u)*3.5);z-index:7;pointer-events:none}
  #fut{padding:calc(var(--u)*1.2) calc(var(--u)*3.4);border-radius:calc(var(--u)*5);background:rgba(8,10,14,.6);font-size:calc(var(--u)*3.6);letter-spacing:.1em;white-space:nowrap}
  #fut b{font-size:calc(var(--u)*5);color:var(--gold);font-variant-numeric:tabular-nums}

  /* ---- 下：やり直し・撃つ（親指が届く位置） ---- */
  #bar{position:absolute;left:calc(var(--u)*4);right:calc(var(--u)*4);bottom:calc(env(safe-area-inset-bottom) + var(--u)*4);z-index:9;display:flex;gap:calc(var(--u)*3);pointer-events:none}
  #bar button{pointer-events:auto;touch-action:manipulation;cursor:pointer}
  #retryBtn{flex:none;padding:0 calc(var(--u)*4.5);height:calc(var(--u)*13);border:1px solid rgba(255,255,255,.5);border-radius:calc(var(--u)*7);
    background:rgba(8,10,14,.7);color:var(--ink);font-size:calc(var(--u)*3.6);letter-spacing:.06em}
  #retryBtn.off{display:none}
  #fireBtn{flex:1;display:none;height:calc(var(--u)*13);border:2px solid var(--gold);border-radius:calc(var(--u)*7);background:rgba(60,44,10,.9);color:var(--gold);
    font-size:calc(var(--u)*5.6);font-weight:700;letter-spacing:.4em;text-indent:.4em}
  #fireBtn.on{display:block}
  #hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + var(--u)*21);z-index:6;text-align:center;font-size:calc(var(--u)*3);letter-spacing:.06em;
    opacity:0;pointer-events:none;text-shadow:0 1px 6px #000;transition:opacity .2s}
  #hint.on{opacity:.85}
  body.touch #hint{display:none}

  /* ---- 分岐点：青白い色合いと、印（輪） ---- */
  #tint{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .25s;
    background:radial-gradient(ellipse at center,rgba(90,150,255,0) 45%,rgba(20,50,130,.38) 100%)}
  #tint.on{opacity:1}
  #markers{position:absolute;inset:0;z-index:8;pointer-events:none}
  .mk{position:absolute;display:none;width:calc(var(--u)*17);height:calc(var(--u)*17);margin:calc(var(--u)*-8.5) 0 0 calc(var(--u)*-8.5);cursor:pointer;pointer-events:auto;touch-action:manipulation}
  .mk.on{display:block}
  .mk i{position:absolute;left:calc(var(--u)*2.5);top:calc(var(--u)*2.5);width:calc(var(--u)*12);height:calc(var(--u)*12);border-radius:50%;border:3px solid rgba(255,255,255,.85);
    background:rgba(255,255,255,.08);box-shadow:0 0 12px rgba(0,0,0,.6),inset 0 0 8px rgba(0,0,0,.4);transition:transform .12s}
  .mk span{position:absolute;left:50%;top:calc(var(--u)*15);transform:translateX(-50%);white-space:nowrap;font-size:calc(var(--u)*3.2);font-weight:700;letter-spacing:.12em;
    text-shadow:0 1px 6px #000,0 0 3px #000}
  .mk.sel i{border-color:var(--gold);background:rgba(255,208,74,.16);transform:scale(1.18);animation:pulse .9s ease-in-out infinite}
  .mk.sel span{color:var(--gold);font-size:calc(var(--u)*3.8)}
  @keyframes pulse{0%,100%{box-shadow:0 0 12px rgba(255,208,74,.5),inset 0 0 8px rgba(0,0,0,.4)}50%{box-shadow:0 0 26px rgba(255,208,74,.95),inset 0 0 8px rgba(0,0,0,.4)}}

  /* ---- 状況を見る・お知らせ ---- */
  #intro{position:absolute;left:50%;top:24%;transform:translate(-50%,-50%);z-index:7;text-align:center;opacity:0;pointer-events:none;transition:opacity .3s;text-shadow:0 2px 14px #000;white-space:nowrap}
  #intro.on{opacity:1}
  #intro h2{font-size:calc(var(--u)*9);letter-spacing:.2em}
  #intro p{margin-top:8px;font-size:calc(var(--u)*3.4);letter-spacing:.15em;opacity:.8}
  #cap{position:absolute;left:50%;top:60%;transform:translateX(-50%);z-index:7;font-size:calc(var(--u)*3.6);letter-spacing:.12em;padding:calc(var(--u)*1) calc(var(--u)*3.4);border-radius:calc(var(--u)*3);background:rgba(8,10,14,.55);text-shadow:0 1px 6px #000;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .5s}
  #cap.on{opacity:1}
  #pop{position:absolute;left:50%;top:20%;transform:translate(-50%,-50%);z-index:7;font-size:calc(var(--u)*11);font-weight:700;letter-spacing:.1em;
    opacity:0;pointer-events:none;text-shadow:0 2px 16px #000;white-space:nowrap}
  #pop.on{opacity:1}
  #flash{position:absolute;inset:0;z-index:4;background:#fff;opacity:0;pointer-events:none}
  #hurt{position:absolute;inset:0;z-index:4;background:radial-gradient(ellipse at center,rgba(160,0,0,0) 30%,rgba(190,20,10,.7) 100%);opacity:0;pointer-events:none}

  /* ---- 結果：上に判定、下にログとボタン（真ん中は連鎖の絵を見せる） ---- */
  #result{position:absolute;inset:0;z-index:12;display:none;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;
    padding:calc(env(safe-area-inset-top) + var(--u)*16) calc(var(--u)*4) calc(env(safe-area-inset-bottom) + var(--u)*5);
    background:linear-gradient(to bottom,rgba(6,8,12,.7) 0%,rgba(6,8,12,.1) 30%,rgba(6,8,12,.1) 45%,rgba(6,8,12,.82) 70%)}
  #result.on{display:flex}
  #stage.res #obj,#stage.res #topR{opacity:0}
  #result h2{font-size:calc(var(--u)*13);letter-spacing:.1em;line-height:1.1}
  #result h2.ok{color:var(--gold)} #result h2.ng{color:var(--red)}
  #result .sub{margin-top:calc(var(--u)*1.5);font-size:calc(var(--u)*4.4);letter-spacing:.2em;opacity:.9}
  #resBadge{display:none;margin:calc(var(--u)*2) auto 0;width:max-content;padding:calc(var(--u)*1) calc(var(--u)*4);border-radius:calc(var(--u)*5);border:1px solid var(--gold);background:rgba(255,208,74,.18);color:var(--gold);font-size:calc(var(--u)*3.6);letter-spacing:.12em}
  #resBadge.on{display:block}
  #result .low{width:100%;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*2.4)}
  #chain{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:calc(var(--u)*1.6) calc(var(--u)*1.2);font-size:calc(var(--u)*3.6)}
  #chain span{padding:calc(var(--u)*.8) calc(var(--u)*3);border-radius:calc(var(--u)*4);background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);white-space:nowrap}
  #chain span.last{background:rgba(255,208,74,.2);border-color:var(--gold)}
  #chain span.last.ng{background:rgba(224,72,60,.22);border-color:var(--red)}
  #chain b{line-height:1;font-size:calc(var(--u)*3.4);opacity:.55;font-weight:400}
  #resFut{font-size:calc(var(--u)*4);letter-spacing:.15em}
  #resFut b{color:var(--gold);font-size:1.4em}
  #againBtn{width:100%;height:calc(var(--u)*13);font-size:calc(var(--u)*5);font-weight:700;letter-spacing:.2em;color:#fff;background:#c8402f;border:0;border-radius:calc(var(--u)*7);cursor:pointer;touch-action:manipulation}
  #result small{font-size:calc(var(--u)*2.8);opacity:.6;letter-spacing:.08em}

  /* ---- スマホが横向きのときの案内（縦専用なので、縦にしてもらう） ---- */
  #rotate{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:22px;padding:24px;text-align:center;background:#0b0e14}
  #rotate .phone{width:46px;height:80px;border:4px solid var(--ink);border-radius:9px;position:relative;animation:turn 2.4s ease-in-out infinite}
  #rotate .phone::after{content:"";position:absolute;left:50%;bottom:5px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--ink)}
  @keyframes turn{0%,25%{transform:rotate(-90deg)}55%,85%{transform:rotate(0)}100%{transform:rotate(-90deg)}}
  #rotate p{font-size:20px;letter-spacing:.1em;line-height:1.8}
  #rotate small{display:block;font-size:14px;opacity:.75;letter-spacing:.05em}
  @media (orientation: landscape) and (pointer: coarse){#rotate{display:flex}}
</style>
</head>
<body>
<div id="stage">
  <div id="tint"></div>
  <div id="obj"><b>目的：主人公を助けろ</b><small>3.5 秒後、敵が主人公を撃つ</small></div>
  <div id="topR"><div id="fut">未来 <b id="futN">0</b>/4</div></div>
  <div id="markers">
    <div class="mk" data-id="A"><i></i><span></span></div>
    <div class="mk" data-id="ext"><i></i><span></span></div>
    <div class="mk" data-id="duck"><i></i><span></span></div>
    <div class="mk" data-id="cyl"><i></i><span></span></div>
  </div>
  <div id="hint">← → ↑ ↓ で選ぶ　Enter / Space で撃つ　R でやり直し</div>
  <div id="bar"><button id="retryBtn" class="off">やり直し</button><button id="fireBtn">撃つ</button></div>
  <div id="intro"><h2>状況を見る</h2><p>タップかキーで飛ばす</p></div>
  <div id="pop"></div>
  <div id="cap"></div>
  <div id="flash"></div>
  <div id="hurt"></div>
  <div id="result">
    <div><h2 id="resTitle"></h2><div class="sub" id="resSub"></div><div id="resBadge">隠れた未来を発見</div></div>
    <div class="low">
      <div id="chain"></div>
      <div id="resFut"></div>
      <button id="againBtn">もう一度</button>
      <small>画面をタップでもやり直せます（R キー）</small>
    </div>
  </div>
</div>
<div id="rotate"><div class="phone"></div><p>縦画面にしてください<small>スマホを縦向きにすると遊べます</small></p></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script>
"use strict";
