<script>
"use strict";
// ===== 調整する数字はここだけ =====
const CFG = {
  // 時間の流れ
  time: {
    step: 1 / 60,            // 物理を進める刻み（秒）
    aFireAt: 3.5,            // 敵 A が主人公を撃つ時刻（命中から。資料どおり 3.5 秒）

    simMax: 9,               // 念のための上限
    chainScale: 0.6,         // 命中後の連鎖を流す速さ（1 でそのまま。論理の時間は変えず、見る速さだけ遅くする）

    nearSpeed: 0.35,         // 近い間の速さ（それまでを 1 として）

    aimErr: 0.015,           // ふだんの狙いのずれ（ラジアン）
    bRun: 4.4, bRunJit: 0.4, // B の駆け足の速さ
    turnRate: 4.5,           // 振り向く速さ（rad/s）。光が主人公へ振れるのが見える速さ
  },

  gunSlide: {

    aim: { x: 2.2, z: -2.2 },// 銃の行き先（B の足元）
    aimJit: 0.12,
    reactDelay: 0.3,         // 音を聞いてから動き出すまで
    pickDist: 0.45,          // この近さまで来たらかがむ
    buttAt: 0.35,            // かがんでからお尻が棚に当たるまで
    paintAt: 0.55,           // かがんでからペンキ缶が飛ぶまで
    paintFlight: 0.45,       // 缶の飛んでいる時間
    paintJit: 0.05,          // 缶の落ち先のばらつき（頭の大きさ内）
    shelfWobble: 0.9,        // 棚が揺れている時間
  },
  blind: {
    start: 0.45,             // 缶をかぶってから撃ち始めるまで
    shots: 7,                // めちゃくちゃに撃つ回数
    interval: 0.27,
    yawErr: 0.55,            // 主人公の方を中心にした、向きのばらつき（片側）
    pitchLo: -0.2, pitchHi: 0.15,
  },
  // ② 消火器：噴射して滑る → ドラム缶 → B をなぎ倒す → 懐中電灯 → A がまぶしい → スプリンクラー → 水浸し
  ext: {
    thrust: 45,              // 噴射の力（N）
    maxT: 2.6,               // 噴射の最長
    afterHit: 0.25,          // ドラム缶に当たってから噴射が止まるまで
  },
  drum: {
    homing: 38,              // 転がるドラム缶を B のほうへ寄せる力（N）
    homingT: 2.2,
    knockSpeed: 0.7,         // B を倒す最低の速さ
    push: 3.6, up: 1.6,      // B が飛ばされる強さ
  },
  flash: {
    throwDelay: 0.12,        // B が倒れてから懐中電灯が手を離れるまで
    flight: 0.55,            // 宙を舞う時間
    face: { dx: 0.1, y: 1.65, dz: -0.9 },   // A の顔の前（A の位置からの差）
    dazzleDelay: 0.45,       // 照らされてから A が反射で撃つまで
    aimErr: 0.03,            // スプリンクラーへの狙いのずれ
  },
  wet: {
    floodDelay: 0.7,         // スプリンクラーが当たってから「水浸し」になるまで
    riseMin: 0.45, riseMax: 0.9,   // 倒れてから起き上がり始めるまで
    standT: 0.55,            // 起き上がってからすべるまで
    friction: 0.08,          // 濡れた床の摩擦
    push: 2.6, up: 2.0,
  },
  // ③ アヒル：鳴く → A が B のほうへ振り向く → B が A を照らす → 撃ち合い
  duck: {
    loud: 0.95,
    aTurn: 0.4, bTurn: 0.35, bTurnJit: 0.08,
    fireMin: 0.12, fireMax: 0.3,     // 振り向いてから撃つまで
    aimErr: 0.02,
    push: 3.6, up: 1.2,              // 撃たれて飛ばされる強さ
  },
  // ④ ガスボンベ：爆発しない。栓が飛ぶ → ロケット → 敵は伏せる → 主人公の椅子に直撃
  rocket: {
    thrust: 450,             // 噴射の力（N）。速さの向きに押す
    maxSpeed: 9.5,
    launch: { x: -0.7, y: 0.28, z: 0.65 },   // 最初の向き（跳ね回ってから主人公へ寄る）
    steerFrom: 1.2,          // この時刻から主人公のほうへ寄せ始める
    steerRamp: 0.8,          // 完全に主人公へ向くまで
    restitution: 0.85,       // 壁・天井・床での跳ね返り
    dodgeDist: 3.2,          // 敵がこの近さまで来たら伏せる
    dodgeT: 1.1,
    hitSpeed: 2,             // 主人公に当たる最低の速さ
  },
  // 音の大きさ（1 で hearing の距離まで届く）
  loud: { clatter: 0.8 },
  // 物理
  phys: { gravity: -9.8, friction: 0.5, restitution: 0.15, iterations: 12 },
  // カメラ
  camera: {
    // fov は横の視野角（縦長の画面でも横に同じだけ入るように。縦は画面の比から求める）
    wide: { x: -1.0, y: 3.7, z: 4.6, lx: 0.5, ly: 0.7, lz: -2.4, fov: 68 },
    wideBy: { A: { x: -0.4, y: 3.2, z: 4.4, lx: 1.5, ly: 0.9, lz: -2.7, fov: 56 } },     // 対象ごとの引き画（① は B・棚・主人公のあたりを大きく）
    freeze: { x: 0, y: 3.6, z: 4.6, lx: 0, ly: 1.0, lz: -1.2, fov: 62 },
    follow: { back: 2.0, up: 0.45, side: 0.6, fov: 56 },
    near: { back: 0.9, up: 0.2, side: 0.3, fov: 30 },
    introSec: 2.5,
  },
  // 連鎖の見せ場：ステップ（ログ）が来るたびに一瞬スローにして、そのステップの物へカメラが寄る
  beat: { slow: 0.3, dur: 0.7, ease: 0.2, cooldown: 0.5, ffScale: 3,
    // 寄るのは 1 つの未来につき 1 回だけ（その未来の山場のステップ）。ほかのステップは、カメラを動かさず光る輪で示す
    key: { A: 'paint', ext: 'flashA', duck: 'shootout', cyl: 'heroHit' }, pushDur: 2.0, pushIn: 0.5, pushOut: 0.6, pushDist: 3.2, pushFov: 46, hlDur: 1.6,
    bounceSlow: 0.25, bounceDur: 0.45, bounceCool: 0.2, bounceMax: 6,   // ロケットの跳ね返り 1 回ごとの小さな見せ場（回数に上限）
    capMin0: 1.3, capBase: 0.7, capPer: 0.08,   // 字幕 1 つが最低限出ている実時間 = max(capMin0, capBase + capPer × 文字数)
    backlogScale: 0.25,                          // 字幕が追いついていない間の、見る速さ（さらに掛ける）
    rocketScale: 0.8 },                                                  // ロケットの間は、さらに少しゆっくり（見る速さだけ）
  // ロケットの間のカメラ：手前の壁を消して、部屋の外から全体を見る。ボンベと次にぶつかる所を結んで、ゆっくり追う
  rocketCam: { x: 0, y: 2.7, z: 9.2, cx: 0, cy: 1.4, cz: -0.3, fov: 52, k: 2.0 },
  ui: { hintSec: 2.2 },
  futures: 4,
};
// ===== STAGE 1「単純な未来」の配置（データだけ。three.js は使わない） =====
// 座標：x は右、y は上、z は手前（窓の側）。部屋は x ±4.2、z -4.8〜4.8、高さ 4.2。
// 向き yaw：0 で -z（奥）を向く。yawToward(dx,dz) で向きたい方向から求める
// 撃てる対象は 4 つ：敵 A（普通の答え）／消火器（地味な置物）／ゴムのアヒル（どうでもいい物）／ガスボンベ（いかにも正解）
const STAGE1 = {
  title: '単純な未来',
  goal: '主人公を助けろ',
  room: { x: 4.2, zBack: -4.8, zFront: 4.8, h: 4.2 },
  window: { x: 0, y: 1.75, w: 1.5, h: 1.1 },        // 手前の壁の窓（ここを割って弾が入る）
  gun: { x: 0, y: 1.75, z: 9.5 },                    // 窓の外の狙撃銃
  branch: { x: 0, y: 1.75, z: 1.8 },                 // 分岐点（時間が止まる場所）
  // half は箱の半分の大きさ、radius は球。held：手を離されるまで動かない
  ents: {
    hero:  { kind: 'person', pos: [0, 0.7, -4.15],  half: [0.3, 0.7, 0.3],   mass: 60, yaw: Math.PI },
    A:     { kind: 'person', pos: [0, 0.9, -1.3],   half: [0.28, 0.9, 0.22], mass: 75, yaw: 0 },
    B:     { kind: 'person', pos: [2.6, 0.9, -2.4], half: [0.28, 0.9, 0.22], mass: 75, yaw: Math.PI * 0.85 },
    lamp:  { kind: 'lamp',   pos: [0, 3.0, -2.1],   radius: 0.3, mass: 4 },                 // 部屋の明かり（ずっと吊られている）
    sprk:  { kind: 'sprk',   pos: [-0.8, 4.05, -3.4], radius: 0.16, mass: 0 },             // 天井のスプリンクラー（A の外れ弾の先）
    ext:   { kind: 'ext',    pos: [-1.2, 0.1, 1.6], half: [0.32, 0.1, 0.1], mass: 5, yaw: 0.727 },   // 床に寝ている消火器（向きはドラム缶のほう）
    drum:  { kind: 'drum',   pos: [0.6, 0.32, 0.0], radius: 0.32, mass: 10 },
    shelf: { kind: 'shelf',  pos: [3.4, 0.85, -2.85], half: [0.3, 0.85, 0.5], mass: 40 },   // B の後ろの棚
    paint: { kind: 'paint',  pos: [3.4, 1.82, -2.85], half: [0.1, 0.12, 0.1], mass: 1.5, held: true },   // 棚の上のペンキ缶
    duck:  { kind: 'duck',   pos: [-3.3, 1.42, -3.2], radius: 0.09, mass: 0.15, held: true },          // 左奥の棚の上のアヒル
    gun:   { kind: 'gun',    pos: [0.3, 0.3, -1.7], half: [0.05, 0.03, 0.11], mass: 0.5, held: true }, // 敵 A の銃（A が倒れると手を離れる）
    flash: { kind: 'flash',  pos: [2.3, 1.0, -2.7], half: [0.04, 0.04, 0.12], mass: 0.3, held: true }, // B の懐中電灯
    cyl:   { kind: 'cyl',    pos: [2.1, 0.65, 0.5], half: [0.17, 0.65, 0.17], mass: 30 },
  },
  chainTop: 4.2,             // 鎖の上端（天井）
  // 撃てる対象。aim は弾が当たる点
  targets: [
    { id: 'A',    name: '敵A',        aim: { x: 0,    y: 1.3,  z: -1.05 } },
    { id: 'ext',  name: '消火器',     aim: { x: -1.2, y: 0.22, z: 1.6 } },
    { id: 'duck', name: 'ゴムのアヒル', aim: { x: -3.3, y: 1.44, z: -3.2 } },
    { id: 'cyl',  name: 'ガスボンベ', aim: { x: 2.1,  y: 1.0,  z: 0.5 } },
  ],
};

function yawToward(dx, dz) { return Math.atan2(-dx, -dz); }
function yawFwd(yaw) { return { x: -Math.sin(yaw), z: -Math.cos(yaw) }; }
// ===== 物理（cannon.js）。世界の構築・保持・衝突の記録・レイキャスト。three.js は使わない =====
function makeWorldBodies(S) {
  const st = S.stage, P = CFG.phys, w = new CANNON.World();
  w.gravity.set(0, P.gravity, 0);
  w.broadphase = new CANNON.NaiveBroadphase();
  w.solver.iterations = P.iterations;
  w.defaultContactMaterial.friction = P.friction;
  w.defaultContactMaterial.restitution = P.restitution;
  const matRocket = new CANNON.Material('rocket'), matGround = new CANNON.Material('ground'), matSlick = new CANNON.Material('slick');
  w.addContactMaterial(new CANNON.ContactMaterial(matGround, matRocket, { friction: 0, restitution: CFG.rocket.restitution }));
  w.addContactMaterial(new CANNON.ContactMaterial(matGround, matSlick, { friction: 0, restitution: 0.1 }));   // 噴射で滑る消火器・床を滑る銃（cannon の箱は摩擦が 0.02 でもびくともしないほど強く効くので、摩擦なしにして減速は damping で）
  S.world = w;

  // 床・天井・壁（吹き飛んだものが部屋の外へ出ないように）
  const R = st.room;
  const plane = (px, py, pz, nx, ny, nz, tag) => {
    const b = new CANNON.Body({ mass: 0, material: matGround });
    b.addShape(new CANNON.Plane());
    b.quaternion.setFromVectors(new CANNON.Vec3(0, 0, 1), new CANNON.Vec3(nx, ny, nz));
    b.position.set(px, py, pz); b.tag = tag; w.addBody(b);
  };
  plane(0, 0, 0, 0, 1, 0, 'floor');
  plane(0, R.h, 0, 0, -1, 0, 'ceil');
  plane(R.x, 0, 0, -1, 0, 0, 'wall'); plane(-R.x, 0, 0, 1, 0, 0, 'wall');
  plane(0, 0, R.zBack, 0, 0, 1, 'wall'); plane(0, 0, R.zFront, 0, 0, -1, 'wall');

  S.ents = {};
  for (const id in st.ents) {
    const d = st.ents[id];
    const e = { id, def: d, body: null, held: false, hold: { x: d.pos[0], y: d.pos[1], z: d.pos[2] }, yaw: d.yaw || 0, tilt: 0, pv: new CANNON.Vec3(), broken: false };
    const b = new CANNON.Body({ mass: d.mass, material: id === 'cyl' ? matRocket : (id === 'ext' || id === 'gun') ? matSlick : null });
    b.addShape(d.radius ? new CANNON.Sphere(d.radius) : new CANNON.Box(new CANNON.Vec3(d.half[0], d.half[1], d.half[2])));
    b.position.set(d.pos[0], d.pos[1], d.pos[2]);
    b.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), e.yaw);
    b.tag = id;
    if (d.kind === 'person' || d.kind === 'lamp' || d.kind === 'shelf' || d.held) e.held = true;   // 立っている人・吊られたもの・棚は、手を離されるまで動かない
    if (d.kind === 'person') { b.linearDamping = 0.05; b.angularDamping = 0.15; }
    if (id === 'drum') { b.linearDamping = 0.25; b.angularDamping = 0.1; }
    if (id === 'ext') { b.linearDamping = 0.1; b.angularDamping = 0.5; }
    if (id === 'gun') { b.linearDamping = 0.8; b.angularDamping = 0.5; }
    if (id === 'paint') { b.collisionFilterMask = 0; }                  // 缶は棚にも体にも当たらず、落ち先だけを重力で飛ぶ
    b.addEventListener('collide', ev => { S.collisions.push({ ent: e, other: ev.body.tag, speed: Math.hypot(e.pv.x, e.pv.y, e.pv.z), ov: ev.body.velocity }); });
    e.body = b; w.addBody(b);
    S.ents[id] = e;
  }
}

function holdEnts(S) {
  const Y = new CANNON.Vec3(0, 1, 0);
  for (const id in S.ents) {
    const e = S.ents[id];
    if (!e.held || !e.body) continue;
    const b = e.body;
    b.position.set(e.hold.x, e.hold.y, e.hold.z);
    b.velocity.set(0, 0, 0); b.angularVelocity.set(0, 0, 0);
    b.quaternion.setFromAxisAngle(Y, e.yaw);
    if (e.tilt) { const t = new CANNON.Quaternion(); t.setFromAxisAngle(new CANNON.Vec3(0, 0, 1), e.tilt); b.quaternion = b.quaternion.mult(t); }   // 棚の揺れ
  }
}

function physStep(S, dt) {
  holdEnts(S);
  for (const id in S.ents) { const e = S.ents[id]; if (e.body) { const v = e.body.velocity; e.pv.set(v.x, v.y, v.z); } }
  S.world.step(dt);
}

function releaseEnt(e) { e.held = false; if (e.body) e.body.wakeUp(); }

// ===== レイキャスト（敵の射撃）。箱・球と、部屋の壁・天井・床 =====
function rayEnt(from, dir, e) {
  const b = e.body, d = e.def;
  if (d.radius) {                                           // 球
    const ox = from.x - b.position.x, oy = from.y - b.position.y, oz = from.z - b.position.z;
    const bq = ox * dir.x + oy * dir.y + oz * dir.z, c = ox * ox + oy * oy + oz * oz - d.radius * d.radius;
    const disc = bq * bq - c; if (disc < 0) return null;
    const t = -bq - Math.sqrt(disc); return t > 0 ? t : null;
  }
  const qi = b.quaternion.inverse();                        // 箱：回転を戻して軸に沿った箱として調べる
  const p = qi.vmult(new CANNON.Vec3(from.x - b.position.x, from.y - b.position.y, from.z - b.position.z));
  const v = qi.vmult(new CANNON.Vec3(dir.x, dir.y, dir.z));
  let t0 = 0, t1 = 1e9;
  const pp = [p.x, p.y, p.z], vv = [v.x, v.y, v.z], hh = d.half;
  for (let i = 0; i < 3; i++) {
    if (Math.abs(vv[i]) < 1e-9) { if (Math.abs(pp[i]) > hh[i]) return null; continue; }
    let a = (-hh[i] - pp[i]) / vv[i], c = (hh[i] - pp[i]) / vv[i];
    if (a > c) { const t = a; a = c; c = t; }
    t0 = Math.max(t0, a); t1 = Math.min(t1, c);
    if (t0 > t1) return null;
  }
  return t0 > 0 ? t0 : null;
}

// from から dir（単位ベクトル）へ撃つ。最初に当たったものを返す
function castRay(S, from, dir, exclude) {
  let best = { t: 1e9, ent: null, surface: null };
  for (const id of ['hero', 'A', 'B', 'shelf', 'cyl', 'lamp', 'sprk', 'drum', 'ext']) {
    if (id === exclude) continue;
    const e = S.ents[id]; if (!e || e.broken) continue;
    const t = rayEnt(from, dir, e);
    if (t !== null && t < best.t) best = { t, ent: e, surface: null };
  }
  const R = S.stage.room;
  const planes = [[dir.x > 0 ? R.x : -R.x, 'x', 'wall'], [dir.z > 0 ? R.zFront : R.zBack, 'z', 'wall'],
                  [dir.y > 0 ? R.h : 0, 'y', dir.y > 0 ? 'ceiling' : 'floor']];
  for (const [val, ax, name] of planes) {
    if (Math.abs(dir[ax]) < 1e-9) continue;
    const t = (val - from[ax]) / dir[ax];
    if (t > 0 && t < best.t) best = { t, ent: null, surface: name };
  }
  best.point = { x: from.x + dir.x * best.t, y: from.y + dir.y * best.t, z: from.z + dir.z * best.t };
  return best;
}
// ===== 連鎖のルール。物理の衝突・音・時刻 → 物や敵の動き → 結果。three.js は使わない =====
// 結果は台本ではなく、剛体の衝突・敵の弾（レイキャスト）・単純な状態機械で決まる。
// 4 つの未来：① 敵 A（銃が滑る→B がかがむ→棚→ペンキ缶→めちゃくちゃに撃つ）② 消火器（ドラム缶→B→懐中電灯→A がまぶしい→スプリンクラー→水浸し）
//             ③ アヒル（鳴く→A が B に振り向く→撃ち合い）④ ガスボンベ（ロケットになって跳ね回り、主人公の椅子に直撃）
function newSim(stage, rng) {
  const S = { stage, rng: rng || Math.random, t: 0, state: 'ready', events: [], log: [], logKeys: {}, collisions: [],
    world: null, ents: null, target: null, result: null, doneAt: null,
    flags: { extOn: false, rocketOn: false, rain: false, wet: false },   // 見た目（粒・床の濡れ）用
    ext: { on: false, t0: 0, hitAt: null, dirx: 0, dirz: 0 },
    drum: { homeUntil: 0 },
    flashT: { throwAt: null, thrown: false, arriveAt: 0 },
    rocket: { startAt: null, on: false },
    wetAt: null, flooded: false, allOutAt: null, knocks: [],
    hero: { alive: true, tipped: false, blasted: false, killedBy: null, hitText: null } };
  makeWorldBodies(S);
  S.A = newEnemyA(S);
  S.B = newEnemyB(S);
  return S;
}

function rnd(S, a, b) { return a + (b - a) * S.rng(); }
// ステップごとにカメラが見る物（ログのキー → 物の名前）
const STEP_FOCUS2 = { flashA: 'flash', aTurn: 'B', bLit: 'A', shootout: 'B', dodge: 'B', paint: 'shelf' };   // 輪を付けるもう 1 つの物
const STEP_FOCUS = { aDown: 'A', gunSlide: 'gun', stoop: 'B', butt: 'shelf', paint: 'B', blind: 'B', heroHit: 'hero', allMiss: 'hero', ext: 'ext', drumHit: 'drum', bKnock: 'B', flashA: 'A',
  dazzle: 'A', sprinkler: 'sprk', slipLoop: 'B', duck: 'duck', aTurn: 'A', bLit: 'B', shootout: 'A', bothDown: 'B', cylShot: 'cyl', rocket: 'cyl', dodge: 'A' };
function pushLog(S, key, text) {
  if (S.logKeys[key]) return; S.logKeys[key] = 1; S.log.push({ key, text, t: S.t });
  if (key !== 'target' && key !== 'end') S.events.push({ type: 'step', key, text, focus: STEP_FOCUS[key] || null, focus2: STEP_FOCUS2[key] || null });   // 画面の字幕・見せ場の合図（本物の出来事から出る）
}
function emit(S, ev) { S.events.push(ev); }
function posOf(e) { const p = e.body.position; return { x: p.x, y: p.y, z: p.z }; }
function dist3(a, b) { return Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z); }
function distXZ(a, b) { return Math.hypot(a.x - b.x, a.z - b.z); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
const UP = () => new CANNON.Vec3(0, 1, 0);

// 命中：ここから連鎖が始まる（t = 0）
function simShoot(S, id) {
  const tg = S.stage.targets.find(x => x.id === id);
  S.state = 'running'; S.target = id; S.t = 0;
  pushLog(S, 'target', tg.name);
  emit(S, { type: 'impact', target: id, point: tg.aim });
  const E = S.ents, br = S.stage.branch;
  if (id === 'A') {                                          // ① 敵 A が倒れる → 銃が床を滑って B の足元へ
    const a = E.A; releaseEnt(a);
    const d = { x: tg.aim.x - br.x, z: tg.aim.z - br.z }, l = Math.hypot(d.x, d.z);
    a.body.velocity.set(d.x / l * 6.5, 1.5, d.z / l * 6.5);
    a.body.angularVelocity.set(-3.2, 0, 0);                 // 前へのめって倒れる
    S.A.state = 'down'; S.A.byBullet = true;
    pushLog(S, 'aDown', '倒れる');
    const g = E.gun, G = CFG.gunSlide, gp = g.hold;
    g.held = false; g.body.wakeUp();
    const ax = G.aim.x + rnd(S, -G.aimJit, G.aimJit), az = G.aim.z + rnd(S, -G.aimJit, G.aimJit);
    const gx = ax - gp.x, gz = az - gp.z, gl = Math.hypot(gx, gz);
    g.body.velocity.set(gx / gl * G.speed, 0, gz / gl * G.speed);
    g.body.angularVelocity.set(0, rnd(S, -3, 3), 0);
    emit(S, { type: 'gunDrop', pos: gp });
  } else if (id === 'ext') {                                  // ② 消火器が噴射して滑走
    S.ext.on = true; S.ext.t0 = S.t; S.flags.extOn = true;
    pushLog(S, 'ext', '噴射して床を滑走');
    emit(S, { type: 'extStart', point: tg.aim });
  } else if (id === 'duck') {                                 // ③ アヒルが鳴いて棚から落ちる
    const d = E.duck; releaseEnt(d);
    d.body.velocity.set(rnd(S, 0.4, 0.8), 1.2, rnd(S, 0.6, 1.0));
    pushLog(S, 'duck', 'ピーッと鳴いて棚から落ちる');
    emit(S, { type: 'squeak', pos: posOf(d) });
    emitNoise(S, 'squeak', posOf(d), CFG.duck.loud);
  } else if (id === 'cyl') {                                  // ④ ガスボンベ：栓が飛ぶ → ロケットになる
    S.rocket.startAt = S.t + 0.35;
    pushLog(S, 'cylShot', '栓が飛ぶ');
    emit(S, { type: 'capPop', pos: posOf(E.cyl) });
  }
}

// 音。聞こえた敵が反応する。誰かが反応したら true
function emitNoise(S, kind, pos, loud) {
  emit(S, { type: 'noise', kind, pos, loud });
  const a = enemyAHear(S, kind, pos, loud), b = enemyBHear(S, kind, pos, loud);
  return a || b;
}

function simStep(S, dt) {
  if (S.state !== 'running') return;
  S.t += dt;
  syncFlashHold(S);
  extUpdate(S, dt); drumUpdate(S); flashUpdate(S); rocketUpdate(S); shelfUpdate(S);
  enemyAUpdate(S, dt);
  enemyBUpdate(S, dt);
  for (const k of S.knocks) knockPerson(S, k.e, k.dir);
  S.knocks.length = 0;
  wetUpdate(S, dt);
  physStep(S, dt);
  processCollisions(S);
  checkEnd(S);
}

// ---- ② 消火器・ドラム缶・懐中電灯・スプリンクラー ----
function extUpdate(S, dt) {
  const x = S.ext; if (!x.on) return;
  const e = S.ents.ext, d = S.ents.drum, E = CFG.ext;
  if (S.t - x.t0 > E.maxT || (x.hitAt !== null && S.t - x.hitAt > E.afterHit)) { x.on = false; S.flags.extOn = false; return; }
  const p = e.body.position, dp = d.body.position;
  if (x.hitAt === null) { const dx = dp.x - p.x, dz = dp.z - p.z, l = Math.hypot(dx, dz) || 1; x.dirx = dx / l; x.dirz = dz / l; }   // ドラム缶のほうへ噴射の向きを寄せる
  e.body.force.x += x.dirx * E.thrust; e.body.force.z += x.dirz * E.thrust;
  e.body.quaternion.setFromAxisAngle(UP(), Math.atan2(-x.dirz, x.dirx));
  e.body.angularVelocity.set(0, 0, 0);
}
function drumUpdate(S) {
  if (S.drum.homeUntil <= S.t) return;
  const d = S.ents.drum.body, b = S.ents.B.body, dx = b.position.x - d.position.x, dz = b.position.z - d.position.z, l = Math.hypot(dx, dz) || 1;
  d.force.x += dx / l * CFG.drum.homing; d.force.z += dz / l * CFG.drum.homing;           // 転がるドラム缶を B のほうへ軽く寄せる
}
function knockB(S) {                                          // ドラム缶が B をなぎ倒す
  const b = S.B, e = S.ents.B, dv = S.ents.drum.body.velocity, l = Math.hypot(dv.x, dv.z) || 1, D = CFG.drum;
  releaseEnt(e); b.state = 'down'; b.lp = null;
  e.body.velocity.set(dv.x / l * D.push, D.up, dv.z / l * D.push);
  e.body.angularVelocity.set(rnd(S, -3, 3), rnd(S, -1, 1), rnd(S, -3, 3));
  pushLog(S, 'bKnock', '転がるドラム缶が敵Bをなぎ倒す');
  emit(S, { type: 'thud', pos: posOf(e), speed: 7 });
  S.flashT.throwAt = S.t + CFG.flash.throwDelay;
}
function syncFlashHold(S) {                                   // 懐中電灯は B の手に付いている間、B について動く
  const f = S.ents.flash;
  if (!f.held) return;
  const b = S.ents.B.body, o = b.quaternion.vmult(new CANNON.Vec3(-0.3, 0.12, -0.35));
  f.hold.x = b.position.x + o.x; f.hold.y = b.position.y + o.y; f.hold.z = b.position.z + o.z;
  f.yaw = S.ents.B.yaw;
}
function flashUpdate(S) {
  const F = S.flashT, f = S.ents.flash, C = CFG.flash;
  if (F.throwAt !== null && !F.thrown && S.t >= F.throwAt) {   // 懐中電灯が宙を舞って A の顔の前へ
    F.thrown = true; F.arriveAt = S.t + C.flight;
    const a = posOf(S.ents.A), p = f.hold;
    releaseEnt(f);
    const T = C.flight, P = { x: a.x + C.face.dx + rnd(S, -0.08, 0.08), y: C.face.y, z: a.z + C.face.dz };
    f.body.velocity.set((P.x - p.x) / T, (P.y - p.y) / T - 0.5 * CFG.phys.gravity * T, (P.z - p.z) / T);
    pushLog(S, 'flashA', '懐中電灯が宙を舞い敵Aの顔を照らす');
    emit(S, { type: 'flashThrow', pos: p });
  }
  if (F.thrown && S.t < F.arriveAt + 1.8) {                    // 飛んでいる間もそのあとも、光は A の顔のほうを向く
    const a = posOf(S.ents.A), p = f.body.position, d = new CANNON.Vec3(a.x - p.x, a.y + 0.7 - p.y, a.z - p.z);
    d.normalize(); f.body.quaternion.setFromVectors(new CANNON.Vec3(0, 0, -1), d); f.body.angularVelocity.set(0, 0, 0);
    if (!F.dazzled && S.t >= F.arriveAt) { F.dazzled = true; enemyADazzle(S); }
  }
}
function onSprinkler(S) {
  if (S.wetAt !== null) return;
  S.wetAt = S.t; S.flags.rain = true;
  pushLog(S, 'sprinkler', '外れた弾がスプリンクラーに当たる');
  emit(S, { type: 'sprinkler', pos: posOf(S.ents.sprk) });
}
function wetUpdate(S, dt) {
  if (S.wetAt === null) return;
  if (!S.flooded && S.t >= S.wetAt + CFG.wet.floodDelay) {
    S.flooded = true; S.flags.wet = true; S.world.defaultContactMaterial.friction = CFG.wet.friction;
    pushLog(S, 'flood', '倉庫中が水浸し');
    emit(S, { type: 'flood' });
  }
  if (S.flooded) enemyWetLoop(S);
}

// ---- ① 棚 ----
function shelfUpdate(S) {
  const e = S.ents.shelf, B = S.B;
  if (B.bumpAt === undefined || B.bumpAt === null) return;
  const t = S.t - B.bumpAt, W = CFG.gunSlide.shelfWobble;
  e.tilt = t < 0 ? 0 : t < W ? Math.sin(t * 22) * 0.07 * (1 - t / W) : 0;   // 棚が揺れる
}

// ---- ④ ロケット ----
function rocketUpdate(S) {
  const R = S.rocket, C = CFG.rocket, e = S.ents.cyl;
  if (R.startAt === null) return;
  if (!R.on) {
    if (S.t < R.startAt) return;
    R.on = true; R.t0 = S.t; S.flags.rocketOn = true;
    const l = Math.hypot(C.launch.x, C.launch.y, C.launch.z);
    e.body.velocity.set(C.launch.x / l * 3, C.launch.y / l * 3, C.launch.z / l * 3);
    pushLog(S, 'rocket', 'ロケットになって跳ね回る');
    emit(S, { type: 'rocketStart', pos: posOf(e) });
  }
  const b = e.body, v = b.velocity, sp = Math.hypot(v.x, v.y, v.z), t = S.t - R.t0;
  let dx = sp > 0.5 ? v.x / sp : C.launch.x, dy = sp > 0.5 ? v.y / sp : C.launch.y, dz = sp > 0.5 ? v.z / sp : C.launch.z;
  const h = posOf(S.ents.hero), p = posOf(e); h.y += 0.3;   // 狙いは主人公の胸の高さ（椅子ではなく体）
  const hl = dist3(h, p) || 1, w = clamp((t - C.steerFrom) / C.steerRamp, 0, 1);
  dx = dx * (1 - w) + (h.x - p.x) / hl * w; dy = dy * (1 - w) + (h.y - p.y) / hl * w; dz = dz * (1 - w) + (h.z - p.z) / hl * w;
  const l = Math.hypot(dx, dy, dz) || 1;
  b.force.x += dx / l * C.thrust; b.force.y += dy / l * C.thrust + b.mass * 9.8 * 0.95; b.force.z += dz / l * C.thrust;   // 向きに噴射しつつ、ほぼ無重力で飛ぶ
  if (w > 0 && sp > 0.5) { const k = 0.14 * w, s2 = Math.min(sp, C.maxSpeed); v.x += ((h.x - p.x) / hl * s2 - v.x) * k; v.y += ((h.y - p.y) / hl * s2 - v.y) * k; v.z += ((h.z - p.z) / hl * s2 - v.z) * k; }   // 主人公のほうへ速さの向きを寄せる（ロケットの誘導）
  if (sp > C.maxSpeed) { v.x *= C.maxSpeed / sp; v.y *= C.maxSpeed / sp; v.z *= C.maxSpeed / sp; }
  if (sp > 0.5) { const n = new CANNON.Vec3(v.x / sp, v.y / sp, v.z / sp); b.quaternion.setFromVectors(new CANNON.Vec3(0, 1, 0), n); }   // 機首は進む向き
  b.angularVelocity.set(0, 0, 0);
  if (sp > C.hitSpeed && dist3(h, p) < 0.62) killHero(S, 'cyl', '主人公に直撃', v);
  const near = [S.ents.A, S.ents.B].some(x => dist3(posOf(x), p) < C.dodgeDist);
  for (const X of [S.A, S.B]) {                                // ロケットが近づいたら、敵 2 人とも伏せてよける
    const ex = S.ents[X === S.A ? 'A' : 'B'];
    if (X.state === 'dodge' || X.state === 'down' || X.state === 'dead') continue;
    if (sp > 3 && near) startDodge(S, X, ex);
  }
}
function startDodge(S, X, ex) {
  X.prevState = X.state; X.state = 'dodge'; X.dodgeEnd = S.t + CFG.rocket.dodgeT;
  if (!X.removed) { S.world.remove(ex.body); X.removed = true; }
  if (S.A.state === 'dodge' && S.B.state === 'dodge') pushLog(S, 'dodge', '敵2人は伏せてよける');
}
function endDodge(S, X, ex, backTo) {
  if (X.removed) { S.world.addBody(ex.body); X.removed = false; }
  X.state = backTo;
}

function killHero(S, who, text, dirv) {
  if (!S.hero.alive) return;
  const h = S.ents.hero;
  S.hero.alive = false; S.hero.killedBy = who; S.hero.hitText = text;
  pushLog(S, 'heroHit', text);
  releaseEnt(h);
  h.body.velocity.set((dirv.x || 0) * 0.5, 1.5, (dirv.z || 0) * 0.5);
  h.body.angularVelocity.set((dirv.z || 0) * 0.5, 0, -(dirv.x || 0) * 0.5);
  emit(S, { type: 'heroHit', point: posOf(h), who });
}

function processCollisions(S) {
  const list = S.collisions; S.collisions = [];
  for (const c of list) {
    const e = c.ent;
    if (e.id === 'ext' && c.other === 'drum' && S.ext.on && S.ext.hitAt === null) {          // 消火器がドラム缶を弾く
      S.ext.hitAt = S.t; S.drum.homeUntil = S.t + CFG.drum.homingT;
      pushLog(S, 'drumHit', 'ドラム缶を弾く');
      emit(S, { type: 'extHit', pos: posOf(S.ents.drum) });
    } else if (e.id === 'drum' && c.other === 'B' && S.B.state !== 'down' && S.ents.B.held && c.speed > CFG.drum.knockSpeed && S.drum.homeUntil > 0) {
      knockB(S);
    } else if (e.id === 'cyl' && c.other === 'hero' && c.speed > CFG.rocket.hitSpeed && S.rocket.on) {
      killHero(S, 'cyl', '主人公に直撃', e.body.velocity);
    } else if (e.id === 'cyl' && S.rocket.on && (c.other === 'wall' || c.other === 'ceil' || c.other === 'floor') && c.speed > 4) {
      if (!e.lastBounce || S.t - e.lastBounce > 0.15) { e.lastBounce = S.t; emit(S, { type: 'ricochet', pos: posOf(e), speed: c.speed }); }
    } else if (e.id === 'duck' && c.other === 'floor' && c.speed > 1 && !S.duckLanded) {
      S.duckLanded = true; emit(S, { type: 'thud', pos: posOf(e), speed: 3, soft: true });
    } else if (e.id === 'gun' && c.other === 'floor' && c.speed > 1 && !S.gunLanded) {       // 銃が床に落ちた音
      S.gunLanded = true;
      if (distXZ(posOf(e), posOf(S.ents.B)) < 3.2) pushLog(S, 'gunSlide', '銃が床を滑って敵Bの足元へ');
      emit(S, { type: 'thud', pos: posOf(e), speed: 3, soft: true });
      emitNoise(S, 'clatter', posOf(e), CFG.loud.clatter);
    } else if (e.id === 'A' && c.other === 'floor' && c.speed > 1.2 && S.A.byBullet && !S.A.noised && e.body.quaternion.vmult(new CANNON.Vec3(0, 1, 0)).y < 0.6) {   // 体が傾いて倒れたとき
      S.A.noised = true;
      emit(S, { type: 'thud', pos: posOf(e), speed: 6 });
    } else if ((e.def.kind === 'person' || e.id === 'drum' || e.id === 'shelf') && c.other === 'floor' && c.speed > 2.5) {
      if (!e.lastThud || S.t - e.lastThud > 0.3) { e.lastThud = S.t; emit(S, { type: 'thud', pos: posOf(e), speed: c.speed }); }
    }
  }
}

// 銃を撃つ。レイキャストで当たったものが決まる
function fireGun(S, who, from, dir, kind) {
  const r = castRay(S, from, dir, who);
  emit(S, { type: 'gunshot', who, kind, from, to: r.point, hit: r.ent ? r.ent.id : r.surface });
  if (r.ent && r.ent.id === 'hero') {
    killHero(S, who, who === 'B' && S.target === 'A' ? '1発が主人公に命中' : '弾が主人公に命中', dir);
  } else if (r.ent && r.ent.id === 'sprk') {
    onSprinkler(S);
  } else if (r.ent && (r.ent.id === 'A' || r.ent.id === 'B')) {
    if (kind === 'duel') S.knocks.push({ e: r.ent, dir });      // 撃ち合いは同時：両方撃ってから倒す
    else knockPerson(S, r.ent, dir);
  }
  return r;
}
function knockPerson(S, e, dir) {
  const X = e.id === 'A' ? S.A : S.B;
  if (X.state === 'down') return;
  if (X.removed) { S.world.addBody(e.body); X.removed = false; }
  releaseEnt(e); X.state = 'down'; X.lp = null;
  e.body.velocity.set(dir.x * CFG.duck.push, CFG.duck.up, dir.z * CFG.duck.push);
  e.body.angularVelocity.set(dir.z * 3, 0, -dir.x * 3);
  emit(S, { type: 'thud', pos: posOf(e), speed: 6 });
}

function checkEnd(S) {
  if (S.target === 'duck') {                                   // ③ 2 人とも倒れたら「敵が勝手に全滅」
    if (S.A.state === 'down' && S.B.state === 'down') { pushLog(S, 'bothDown', '2人とも倒れる'); if (S.allOutAt === null) S.allOutAt = S.t + 0.5; }
    if (S.allOutAt !== null && S.t >= S.allOutAt) pushLog(S, 'allOut', '敵が勝手に全滅');
  }
  if (S.doneAt === null) {
    if (!S.hero.alive) { S.doneAt = S.t + CFG.time.hitHold; finishSim(S, false); }
    else if (S.t >= CFG.time.endAt) { S.doneAt = S.t + 0.3; finishSim(S, true); }
  }
  if (S.doneAt !== null && S.t >= S.doneAt && S.state === 'running') { S.state = 'done'; emit(S, { type: 'done', result: S.result }); }
  if (S.t > CFG.time.simMax && S.state === 'running') { S.state = 'done'; if (!S.result) finishSim(S, S.hero.alive); }
}

function finishSim(S, ok) {
  const id = S.target;
  if (ok) {
    if (id === 'A' && S.B.blindShots >= CFG.blind.shots) pushLog(S, 'allMiss', '全部外れる');
    pushLog(S, 'end', '主人公 生存');
  } else if (!S.logKeys.heroHit) pushLog(S, 'end', '主人公 被弾');
  let title = ok ? 'CLEAR' : 'GAME OVER', sub, badge = false;
  if (id === 'A') { if (ok) { title = 'CLEAR？'; sub = '奇跡的に全部外れた'; badge = true; } else sub = 'ペンキ缶で全部台無し'; }
  else if (id === 'ext') sub = ok ? '地味な物が一番強い' : '消火器は消えなかった';
  else if (id === 'duck') sub = ok ? 'どうでもいい物が正解' : 'アヒルは鳴いただけ';
  else if (id === 'cyl') sub = ok ? '偶然よけた' : 'いちばん派手な方法で失敗';
  else sub = ok ? '偶然の成功' : '未来は変わらなかった';
  S.result = { ok, target: id, title, sub, badge, lines: S.log.map(l => l.text) };
}

function newEnemyA(S) {

function newEnemyB(S) {

function aimDir(from, to, errYaw, errPitch) {

function enemyBHear(S, kind, pos, loud) {

function enemyBUpdate(S, dt) {

// ---------- 濡れた床：起き上がろうとして、すべって転ぶ（くり返し） ----------
function enemyWetLoop(S) {
  const W = CFG.wet;
  for (const [X, e] of [[S.A, S.ents.A], [S.B, S.ents.B]]) {
    if (X.state !== 'frozen' && X.state !== 'down' && X.state !== 'rising') continue;
    if (!X.lp) X.lp = { phase: X.state === 'down' ? 'down' : 'stand', until: S.t + rnd(S, W.riseMin, W.riseMax) };
    if (S.t < X.lp.until) continue;
    if (X.lp.phase === 'down') {                         // 起き上がる
      const p = posOf(e);
      e.hold.x = clamp(p.x, -3.7, 3.7); e.hold.z = clamp(p.z, -4.2, 4.2); e.hold.y = 0.9; e.yaw = rnd(S, -3, 3);
      e.held = true; X.state = 'rising'; X.lp = { phase: 'rising', until: S.t + W.standT };
    } else {                                             // すべって転ぶ
      releaseEnt(e);
      const a = rnd(S, 0, Math.PI * 2);
      e.body.velocity.set(Math.cos(a) * W.push, W.up, Math.sin(a) * W.push);
      e.body.angularVelocity.set(rnd(S, -4, 4), rnd(S, -2, 2), rnd(S, -4, 4));
      X.state = 'down'; X.lp = { phase: 'down', until: S.t + rnd(S, 0.9, 1.4) };
      X.slips = (X.slips || 0) + 1;
      pushLog(S, 'slipLoop', '起き上がろうとした敵が次々すべって転ぶ');
      emit(S, { type: 'slip', pos: posOf(e) });
    }
  }
}
// ===== 弾の経路と、分岐点での選択（画面上の向き）。three.js は使わない =====
const BUL = {
  // 時間の割合 tau(0〜1) → 経路の割合 u(0〜1)。経路の後ろのほう（nearFrac から先）は nearSpeed 倍の速さになる（近づいたらさらにスロー）
  u(tau) {
    const B = CFG.bullet, f = B.nearFrac, s = B.nearSpeed, tn = (1 - f) / s, total = f + tn, p = Math.max(0, Math.min(1, tau)) * total;
    return p <= f ? p : f + (p - f) * s;
  },
  // 近いか（寄りのカメラ・風切り音を強める割合 0〜1）
  near(u) { const f = CFG.bullet.nearFrac; return Math.max(0, Math.min(1, (u - f * 0.8) / (1 - f * 0.8))); },
  // 分岐点から対象へ曲がって飛ぶ 2 次ベジェ
  curve(from, to) {
    const dx = to.x - from.x, dy = to.y - from.y, dz = to.z - from.z, l = Math.hypot(dx, dy, dz);
    const sx = dz / (Math.hypot(dx, dz) || 1), sz = -dx / (Math.hypot(dx, dz) || 1);   // 進行方向の横
    const k = CFG.bullet.curve * l;
    return { p0: from, p1: to, c: { x: (from.x + to.x) / 2 + sx * k, y: (from.y + to.y) / 2 + k * 0.5, z: (from.z + to.z) / 2 + sz * k } };
  },
  at(cv, u) {
    const a = (1 - u) * (1 - u), b = 2 * (1 - u) * u, c = u * u;
    return { x: a * cv.p0.x + b * cv.c.x + c * cv.p1.x, y: a * cv.p0.y + b * cv.c.y + c * cv.p1.y, z: a * cv.p0.z + b * cv.c.z + c * cv.p1.z };
  },
};

// 画面上の向き dir（{x,y}。y は下が正）にある、次の対象を選ぶ。items: [{id, x, y}]（画面の座標）
function pickDir(items, curId, dir) {
  const cur = items.find(i => i.id === curId);
  if (!cur) return curId;
  let best = null, bestScore = 1e9;
  for (const it of items) {
    if (it.id === curId) continue;
    const vx = it.x - cur.x, vy = it.y - cur.y, l = Math.hypot(vx, vy);
    if (l < 1) continue;
    const cos = (vx * dir.x + vy * dir.y) / l;
    if (cos < 0.35) continue;                              // 向きがだいぶ違うものは選ばない
    const score = l * (2 - cos);
    if (score < bestScore) { bestScore = score; best = it.id; }
  }
  return best || curId;
}

const __results = [], __info = [];

function eq(actual, expected, label) {

}
function near(actual, expected, tol, label) {

}

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// 配置を少し揺らした STAGE1（乱数で）。jit=0 なら元のまま
function jitterStage(seed, jit) {
  const st = JSON.parse(JSON.stringify(STAGE1)), r = mulberry32(seed * 7919 + 13), j = (a) => (r() * 2 - 1) * a * jit;
  const E = st.ents;
  E.A.pos[0] += j(0.1); E.A.pos[2] += j(0.1);
  E.B.pos[0] += j(0.25); E.B.pos[2] += j(0.25); E.B.yaw += j(0.4);
  const sx = j(0.08), sz = j(0.08);
  E.shelf.pos[0] += sx; E.shelf.pos[2] += sz; E.paint.pos[0] += sx; E.paint.pos[2] += sz;
  E.drum.pos[0] += j(0.15); E.drum.pos[2] += j(0.15);
  E.ext.pos[0] += j(0.15); E.ext.pos[2] += j(0.15);
  E.duck.pos[0] += j(0.03);
  E.cyl.pos[0] += j(0.15); E.cyl.pos[2] += j(0.15);
  return st;
}
function runSim(target, seed, jit) {
  const S = newSim(jitterStage(seed, jit === undefined ? 1 : jit), mulberry32(seed + 1));
  simShoot(S, target);

}

  for (let sd = 1; sd < 80; sd++) { S = runSim('A', sd, 0); if (S.result.ok) break; }
  eq(S.result.ok, true); eq(S.result.title, 'CLEAR？'); eq(S.result.badge, true);
  eq(texts(S).slice(0, 7), T_A_PREFIX); eq(texts(S).slice(7), ['全部外れる', '主人公 生存']);
});
test('② 消火器：噴射→ドラム缶→B を倒す→懐中電灯→A がまぶしくて外れる→スプリンクラー→水浸し→すべって転ぶ（CLEAR）', () => {
  const S = runSim('ext', 1, 0);
  eq(texts(S), ['消火器', '噴射して床を滑走', 'ドラム缶を弾く', '転がるドラム缶が敵Bをなぎ倒す', '懐中電灯が宙を舞い敵Aの顔を照らす', 'まぶしくてAの弾が外れる',
    '外れた弾がスプリンクラーに当たる', '倉庫中が水浸し', '起き上がろうとした敵が次々すべって転ぶ', '主人公 生存']);
  eq(S.result.ok, true); eq(S.result.sub, '地味な物が一番強い');
  eq((S.A.slips || 0) + (S.B.slips || 0) >= 2, true, 'すべって転ぶのがくり返される');
});
test('③ アヒル：鳴く→A が B に振り向く→B が A を照らす→撃ち合い→2 人とも倒れる（CLEAR）', () => {
  const S = runSim('duck', 1, 0);
  eq(texts(S), ['ゴムのアヒル', 'ピーッと鳴いて棚から落ちる', '敵Aが「誰だ！」とBに振り向く', 'Bも驚いてAを照らす', '撃ち合い', '2人とも倒れる', '敵が勝手に全滅', '主人公 生存']);
  eq(S.result.ok, true); eq([S.A.state, S.B.state], ['down', 'down']);
});
test('④ ガスボンベ：爆発しない。栓が飛ぶ→ロケット→敵は伏せる→主人公に直撃（GAME OVER）', () => {
  const S = runSim('cyl', 1, 0);
  eq(texts(S), ['ガスボンベ', '栓が飛ぶ', 'ロケットになって跳ね回る', '敵2人は伏せてよける', '主人公に直撃']);
  eq(S.result.ok, false); eq(S.hero.killedBy, 'cyl');
  eq(S.events.concat([]).some(e => e.type === 'explode'), false);
});
test('A が撃つ時刻は命中から約 3.5 秒（アヒル・消火器ではその前に流れが変わる）', () => {
  const l = runSim('cyl', 5, 0);
  eq(l.log.some(x => x.key === 'aFire') || l.hero.alive === false, true);
  const e = runSim('ext', 2, 0);
  eq(e.log.some(x => x.key === 'aFire'), false, '消火器では A は普通には撃たない');
  const d = runSim('duck', 2, 0);
  eq(d.log.some(x => x.key === 'aFire'), false, 'アヒルでも A は主人公を撃たない');
});

// ===== 20 回ずつ（配置と乱数を揺らす） =====
const RUNS = 20, COUNT = {};
for (const id of ['A', 'ext', 'duck', 'cyl']) {
  let ok = 0; for (let i = 0; i < RUNS; i++) if (runSim(id, 100 + i, 1).result.ok) ok++;
  COUNT[id] = ok;
}
info('20 回の成功数（CLEAR になった回数。配置・乱数を揺らす）  ① 敵A ' + COUNT.A + '/20（失敗 ' + (20 - COUNT.A) + '）  ② 消火器 ' + COUNT.ext + '/20  ③ アヒル ' + COUNT.duck + '/20  ④ ガスボンベ ' + COUNT.cyl + '/20（失敗 ' + (20 - COUNT.cyl) + '）');
{
  const wide = {};
  for (const id of ['A', 'ext', 'duck', 'cyl']) { let ok = 0; for (let i = 0; i < RUNS; i++) if (runSim(id, 300 + i, 2.5).result.ok) ok++; wide[id] = ok; }
  info('揺らしを 2.5 倍にしたとき（合否には使わない）  ① ' + wide.A + '/20  ② ' + wide.ext + '/20  ③ ' + wide.duck + '/20  ④ ' + wide.cyl + '/20');
}
{
  let big = 0; for (let i = 0; i < 100; i++) if (runSim('A', 500 + i, 1).result.ok) big++;
  info('① 敵 A は 100 回で CLEAR（偶然の成功）が ' + big + ' 回');
  COUNT.A100 = big;
}
test('② 消火器は 20 回中 19 回以上 CLEAR', () => { eq(COUNT.ext >= 19, true, '成功 ' + COUNT.ext); });
test('③ アヒルは 20 回中 19 回以上 CLEAR', () => { eq(COUNT.duck >= 19, true, '成功 ' + COUNT.duck); });
test('④ ガスボンベは 20 回中 18 回以上 GAME OVER', () => { eq(20 - COUNT.cyl >= 18, true, '失敗 ' + (20 - COUNT.cyl)); });
test('① 敵 A は 20 回中 11〜19 回 GAME OVER（ときどき偶然の成功）', () => { eq(20 - COUNT.A >= 11 && 20 - COUNT.A <= 19, true, '失敗 ' + (20 - COUNT.A)); });

// ===== リトライの軽さ =====
test('シミュレーションの作り直しは速い（20 回の平均）', () => {
  const t0 = performance.now(); for (let i = 0; i < 20; i++) newSim(STAGE1, mulberry32(i));
  const ms = (performance.now() - t0) / 20;
  info('newSim 1 回 ' + ms.toFixed(2) + ' ms');
  eq(ms < 50, true, ms + ' ms');
});

// ===== 結果表示 =====
(function () {
  const out = document.getElementById('out');
  let pass = 0;
  for (const r of __results) {
    const d = document.createElement('div');
    d.className = 'r ' + (r.ok ? 'ok' : 'ng');
    d.textContent = r.name;
    out.appendChild(d);
    if (r.ok) pass++;
    else { const w = document.createElement('div'); w.className = 'why'; w.textContent = r.why; out.appendChild(w); }
  }
  for (const s of __info) { const d = document.createElement('div'); d.className = 'info'; d.textContent = s; out.appendChild(d); }
  const sum = pass + '/' + __results.length;
  document.getElementById('sum').textContent = (pass === __results.length ? 'すべて通過 ' : '失敗あり ') + sum;
  document.title = (pass === __results.length ? 'PASS ' : 'FAIL ') + sum;
})();
</script>
